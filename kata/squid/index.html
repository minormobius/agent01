<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07080c" />
<meta name="description" content="SQUID — jet through an open four-dimensional sea with no down. The funnel aims three ways: right, up, and ana. Spread your arms for stability, fold them for speed and fight the Munk moment. Chase the glowing jellies." />
<title>SQUID — kata.mino.mobi</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="css/squid.css" />
</head>
<body>
<div id="view">
  <canvas id="gl" aria-label="Your 3D slice of a 4D sea, looking along your heading: glowing jellies, drifting plankton, and the squid"></canvas>
  <canvas id="ov" aria-hidden="true"></canvas>
  <div id="hud"><b>SQUID</b><span id="hudInfo"></span></div>
  <div id="bar"><div id="barFill"></div></div>
  <div id="btns"><button type="button" id="diceB" aria-label="a new sea">🎲</button><button type="button" id="retryB" aria-label="start again">↺</button><button type="button" id="armsB" class="on">arms: spread</button></div>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="ana" class="lever" aria-label="aim the funnel ana or kata"><div id="anaKnob"></div><b>ana</b><i>kata</i></div>
  <button type="button" id="jet" aria-label="jet (hold)">JET</button>
  <div id="card" hidden>
    <h2 id="cardKicker">kata.mino.mobi</h2>
    <h1 id="cardTitle">SQUID</h1>
    <p id="cardText"></p>
    <p id="cardStats" class="stats"></p>
    <div class="row"><button type="button" id="cardGo" class="primary">SWIM</button><button type="button" id="cardDice">🎲 new sea</button></div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
