  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
  master.connect(comp); comp.connect(out);
  const T0 = ac.currentTime + 0.15;           // timeline zero on the audio clock
  const at = t => T0 + t;
  const noiseBuf = (() => { const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; })();
  const shaper = (() => { const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = Math.tanh(x * 3.5); } const ws = ac.createWaveShaper(); ws.curve = c; ws.oversample = '2x'; return ws; })();
  const dist = ac.createGain(); dist.gain.value = 0.7; shaper.connect(dist); dist.connect(master);
  function env(g, t, a, peak, dur, floor = 0.0001) { g.gain.setValueAtTime(floor, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(floor, t + dur); }
  function noise(t, dur, peak, filt) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const g = ac.createGain(); env(g, t, 0.004, peak, dur);
    let node = s; if (filt) { s.connect(filt); node = filt; }
    node.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  // --- beat bus: lowpass "muffled" until the drop
  const bus = ac.createGain(); bus.gain.value = 1;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(420, at(0)); lp.Q.value = 0.7;
  lp.frequency.setValueAtTime(420, at(DROP - 0.01)); lp.frequency.setValueAtTime(18000, at(DROP));
  bus.connect(lp); lp.connect(master);
  const kick = (t, v = 1) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.11); env(g, t, 0.002, 1.1 * v, 0.34); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.4); noise(t, 0.03, 0.3 * v); };
  const snare = (t, v = 1) => { const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.9; const s = ac.createBufferSource(); s.buffer = noiseBuf; const g = ac.createGain(); env(g, t, 0.003, 0.7 * v, 0.19); s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + 0.25); const o = ac.createOscillator(), g2 = ac.createGain(); o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.08); env(g2, t, 0.002, 0.5 * v, 0.1); o.connect(g2); g2.connect(bus); o.start(t); o.stop(t + 0.15); };
  const hat = (t, v = 0.3, open = false) => { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8500; const s = ac.createBufferSource(); s.buffer = noiseBuf; const g = ac.createGain(); env(g, t, 0.002, v, open ? 0.28 : 0.05); s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + 0.35); };
  const cowbell = (t, ratio = 1, v = 0.5) => { const g = ac.createGain(); env(g, t, 0.002, v, 0.3); const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900 * ratio; f.Q.value = 2.5; [587, 845].forEach(fr => { const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = fr * ratio; o.connect(f); o.start(t); o.stop(t + 0.35); }); f.connect(g); g.connect(bus); };
  const bass = (t, f0, dur, v = 0.9) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(f0 * 1.5, t); o.frequency.exponentialRampToValueAtTime(f0, t + 0.06); env(g, t, 0.006, v, dur); o.connect(g); g.connect(shaper); o.start(t); o.stop(t + dur + 0.05); };
  // --- one-shots (not on the muffled bus so they always hit)
  const boom = (t, amp = 1) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(26, t + 1.3); env(g, t, 0.01, 1.2 * amp, 2.0); o.connect(g); g.connect(shaper); o.start(t); o.stop(t + 2.1); const o2 = ac.createOscillator(), g2 = ac.createGain(); o2.type = 'triangle'; o2.frequency.setValueAtTime(190, t); o2.frequency.exponentialRampToValueAtTime(40, t + 0.6); env(g2, t, 0.005, 0.5 * amp, 0.9); o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t + 1); const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; noise(t, 0.35, 0.6 * amp, f); };
  const hit = (t, amp = 1) => { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400; noise(t, 0.28, 0.7 * amp, f); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.2); env(g, t, 0.004, 0.9 * amp, 0.35); o.connect(g); g.connect(shaper); o.start(t); o.stop(t + 0.4); };
  const riser = (t, dur) => { const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.5; f.frequency.setValueAtTime(250, t); f.frequency.exponentialRampToValueAtTime(7000, t + dur); const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const g = ac.createGain(); g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.7, t + dur); g.gain.setValueAtTime(0.0001, t + dur + 0.001); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02); const o = ac.createOscillator(), g2 = ac.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, t + dur); g2.gain.setValueAtTime(0.001, t); g2.gain.exponentialRampToValueAtTime(0.18, t + dur); g2.gain.setValueAtTime(0.0001, t + dur + 0.001); const lf = ac.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 2500; o.connect(lf); lf.connect(g2); g2.connect(master); o.start(t); o.stop(t + dur + 0.02); };
  const scratch = (t) => { const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); o.type = 'sawtooth'; f.type = 'bandpass'; f.frequency.value = 1300; f.Q.value = 1.2; const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 9; lg.gain.value = 320; lfo.connect(lg); lg.connect(o.frequency); o.frequency.value = 420; for (let i = 0; i < 7; i++) { g.gain.setValueAtTime(i % 2 ? 0.0001 : 0.35, t + i * 0.075); } g.gain.setValueAtTime(0.0001, t + 0.55); o.connect(f); f.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t + 0.6); lfo.stop(t + 0.6); };
  const tick = (t) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 3200; env(g, t, 0.001, 0.5, 0.04); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.06); noise(t, 0.03, 0.4); };
  const ding = (t) => { [1567.98, 2093, 3135.96].forEach((fr, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = fr; env(g, t, 0.003, 0.22 / (i + 1), 0.7); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.8); }); };

  // --- sequence the beat
  const RIFF = [55, 55, 65.41, 49];              // A1 A1 C2 G1
  const COW = [1, 1, 1.19, 1, 0.89, 1, 1.33, 1.19];
  const nBars = Math.floor((DUR - 0.8 - BEAT0) / BAR);
  for (let b = 0; b < nBars; b++) {
    const t0 = BEAT0 + b * BAR, g = t0, drop = g >= DROP, outro = g >= OUTRO - 0.01;
    const step = i => t0 + i * BEAT / 4;
    if (outro) {                                   // half-time outro
      kick(step(0)); bass(step(0), RIFF[b % 4], 1.2, 0.8); snare(step(8), 0.8); hat(step(4), 0.2); hat(step(12), 0.2, true);
      continue;
    }
    const kicks = b % 2 ? [0, 7, 10, 13] : [0, 7, 10];
    kicks.forEach(i => { kick(step(i), drop ? 1 : 0.8); bass(step(i), RIFF[(b + (i > 6 ? 1 : 0)) % 4], 0.5, drop ? 0.95 : 0.5); });
    snare(step(4)); snare(step(12));
    for (let i = 0; i < 16; i++) hat(step(i), i % 2 ? 0.16 : 0.32, i === 14 && b % 2 === 1);
    if (drop && b % 2 === 1) for (let k = 0; k < 6; k++) hat(step(13) + k * BEAT / 12, 0.22);   // 32nd roll
    if (b >= 1) [0, 3, 6, 10, 12].forEach((i, j) => cowbell(step(i), COW[(b * 3 + j) % COW.length] * (drop ? 1 : 0.5), drop ? 0.5 : 0.28));
  }
  // --- cues
  for (const c of CUES) {
    if (c.boom) boom(at(c.t), c.boom);
    if (c.hit) hit(at(c.t), c.hit);
    if (c.riser) riser(at(c.t), c.riser);
    if (c.scratch) scratch(at(c.t));
    if (c.tick) tick(at(c.t));
    if (c.ding) ding(at(c.t));
    if (c.cut) { bus.gain.setValueAtTime(0.0001, at(c.t)); bus.gain.setValueAtTime(1, at(c.t + c.cut)); }
  }
  master.gain.setValueAtTime(0.9, at(DUR - 1)); master.gain.linearRampToValueAtTime(0.0001, at(DUR));
  return { T0 };
}

// ---------------------------------------------------------- narration (live)
const NARRATION = [
  [0.3, 'warning. the following benchmark result is one hundred percent real.'],
  [2.3, 'G P T six Astra just dropped, and the benchmarks are not okay.'],
  [5.2, 'look at the table. wait. wait.'],
  [8.6, 'zoom, and enhance.'],
  [12.6, 'exploit bench. Claude Opus five, seventy. G P T five point six Sol, seventy eight point five. G P T six Astra.'],
  [16.6, 'one hundred percent.'],
  [21.6, 'the benchmark is cooked. they have to make a new one.'],
  [25.6, 'meanwhile, Claude Fable, Claude Fable, Gemini. did not show up. they knew.'],
  [30.2, 'thirty points over Opus five. and it was not close.'],
  [34.2, 'bonus round. S R E bench, ninety nine point two. it needed four attempts. humble king.'],
  [38.6, 'G P T six Astra. it is over. like, subscribe, touch grass.'],
];
function narrate(t, state) {
  if (RENDER || !('speechSynthesis' in window)) return;
  while (state.i < NARRATION.length && NARRATION[state.i][0] <= t) {
    const u = new SpeechSynthesisUtterance(NARRATION[state.i][1]); u.rate = 1.15; u.pitch = 0.9; u.volume = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u); state.i++;
  }
}

// ---------------------------------------------------------------------- run
async function ready() {
  try { await document.fonts.load(`100px Anton`); } catch {}
  if (!img.complete) await new Promise(r => { img.onload = r; img.onerror = r; });
}
// Live playback: the AudioContext is the clock, visuals follow it.
async function play() {
  await ready();
  overlay.hidden = true;
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  const { T0 } = buildAudio(ac, ac.destination);
  const nar = { i: 0 };
  (function loop() {
    const t = ac.currentTime - T0;
    if (t >= 0) { frame(Math.min(t, DUR)); narrate(t, nar); }
    if (t < DUR + 0.4) requestAnimationFrame(loop);
    else { try { speechSynthesis.cancel(); } catch {} ac.close(); replay(); }
  })();
}
function replay() {
  overlay.hidden = false;
  document.getElementById('play').textContent = '🔁 again (why)';
}
// Offline render (`?render=1`, driven by record.mjs): the same timeline, but
// audio comes from an OfflineAudioContext and every frame is pushed through
// WebCodecs at an exact timestamp, so nothing depends on wall-clock speed.
// Muxed to WebM (VP9 + Opus) in-page by webm-muxer; result lands in window.__done.
async function render() {
  await ready();
  overlay.hidden = true;
  const FPS = parseInt(q.get('fps') || '30', 10), KBPS = parseInt(q.get('kbps') || '3500', 10);
  const SR = 48000, N = Math.ceil(DUR * FPS);
  const oac = new OfflineAudioContext(2, Math.ceil(SR * (DUR + 0.5)), SR);
  const { T0 } = buildAudio(oac, oac.destination);       // audio for visual time t sits at T0 + t
  const abuf = await oac.startRendering();
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'webm-muxer.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const muxer = new WebMMuxer.Muxer({
    target: new WebMMuxer.ArrayBufferTarget(),
    video: { codec: 'V_VP9', width: W, height: H, frameRate: FPS },
    audio: { codec: 'A_OPUS', sampleRate: SR, numberOfChannels: 2 },
    firstTimestampBehavior: 'offset',
  });
  const fail = e => { window.__error = String(e && e.message || e); };
  const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: fail });
  aenc.configure({ codec: 'opus', sampleRate: SR, numberOfChannels: 2, bitrate: 128000 });
  const skip = Math.round(T0 * SR), total = Math.ceil(DUR * SR);
  const L = abuf.getChannelData(0), R = abuf.getChannelData(1), CH = 4800;
  for (let off = 0; off < total; off += CH) {
    const n = Math.min(CH, total - off);
    const data = new Float32Array(n * 2);
    data.set(L.subarray(skip + off, skip + off + n), 0); data.set(R.subarray(skip + off, skip + off + n), n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(off / SR * 1e6), data });
    aenc.encode(ad); ad.close();
  }
  await aenc.flush();
  const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: fail });
  venc.configure({ codec: 'vp09.00.10.08', width: W, height: H, bitrate: KBPS * 1000, framerate: FPS, latencyMode: 'quality' });
  for (let i = 0; i < N; i++) {
    frame(i / FPS);
    const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    venc.encode(vf, { keyFrame: i % (FPS * 4) === 0 }); vf.close();
    if (i % FPS === FPS - 1) { await venc.flush(); window.__progress = (i + 1) / N; }
    if (window.__error) throw new Error(window.__error);
  }
  await venc.flush(); venc.close(); aenc.close();
  muxer.finalize();
  const u = new Uint8Array(muxer.target.buffer);
  let b = ''; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  window.__done = { bytes: u.length, frames: N, fps: FPS, b64: btoa(b) };
}
document.getElementById('play').addEventListener('click', play);
overlay.addEventListener('click', e => { if (e.target === overlay) play(); });
document.addEventListener('keydown', e => { if (e.key === ' ' && !overlay.hidden) { e.preventDefault(); play(); } });
if (FRAME != null) { ready().then(() => { overlay.hidden = true; frame(FRAME); window.__frameDrawn = true; }); }
else if (RENDER) { render().catch(e => { window.__error = String(e && e.message || e); }); }
else { ready().then(() => frame(0.0)); }
</script>
