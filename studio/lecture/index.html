<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Minormobius Lectures</title>
<meta name="description" content="No. 10: a documentary lecture. A lecturer made of strange attractors teaches a class aboard an O'Neill cylinder about one poster of the early agent era, minormobius, from the only records he left: 51,134 Bluesky posts, the friends in them, and the agent01 repository. Ten questions, the eras of a social graph, the orb of his posts. Piano and a voice made of arithmetic, rendered in the browser.">
<meta property="og:title" content="The Minormobius Lectures — studio">
<meta property="og:description" content="Ten lectures in an O'Neill cylinder on one poster of the early agent era, from his public record.">
<meta property="og:image" content="https://studio.mino.mobi/lecture/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#05080a">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #ece6d6;
    --dim: rgba(236, 230, 214, 0.74);
    --veil: rgba(10, 9, 16, 0.84);
    --accent: #ffbe6e;
    --serif: "Newsreader", Georgia, serif; --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05080a; color: var(--ink); overflow: hidden; }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  body.playing #stage { cursor: pointer; }

  #card {
    position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%);
    width: min(92vw, 520px); padding: 28px 28px 22px; text-align: center;
    background: var(--veil); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 190, 110, 0.5); border-radius: 2px; box-shadow: 0 10px 40px -20px rgba(0, 0, 0, 0.6);
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #card.gone { opacity: 0; visibility: hidden; }
  h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(32px, 7vw, 48px); letter-spacing: 0.02em; line-height: 1; color: #ffbe6e; }
  .sub { margin: 10px 0 22px; color: var(--dim); font-size: clamp(17px, 2.6vw, 20px); line-height: 1.35; }
  #go {
    font: 500 18px/1 var(--serif); letter-spacing: 0.12em; text-transform: uppercase;
    color: #05080a; background: var(--ink); border: 0; border-radius: 2px;
    padding: 13px 30px 12px; cursor: pointer;
  }
  #go:hover, #go:focus-visible { background: var(--accent); }
  #go:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #status { margin: 16px 0 0; min-height: 1.3em; font: 500 11px/1.4 var(--mono); color: var(--dim); letter-spacing: 0.02em; }
  .hint { margin: 6px 0 0; font: 500 10px/1.4 var(--mono); color: rgba(236, 230, 214, 0.5); }

  .home {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 16px;
    font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(236, 230, 214, 0.6); text-decoration: none; padding: 6px 2px;
  }
  .home:hover { color: var(--accent); }
  #paused {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: italic 400 28px var(--serif); color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  body.paused #paused { opacity: 0.9; }
  noscript { position: fixed; bottom: 16px; left: 16px; right: 16px; font: 500 12px var(--mono); }
</style>
</head>
<body>
<div id="stage" aria-label="A lecturer made of glowing threads stands in a tunnel of lit cells inside an O'Neill cylinder, beside a board of posts, faces and charts"><canvas id="c"></canvas></div>

<div id="card" role="dialog" aria-labelledby="t">
  <h1 id="t">THE MINORMOBIUS LECTURES</h1>
  <p class="sub">No. 10 · ten lectures, given in an O'Neill cylinder,<br>on one poster of the early agent era</p>
  <button id="go" type="button">Begin</button>
  <p id="status" aria-live="polite"></p>
  <p class="hint">sound on · space or tap to pause · about seven and a half minutes</p>
</div>
<div id="paused">paused</div>
<a class="home" href="../">studio</a>
<noscript>This piece is drawn and played by JavaScript.</noscript>
<script type="module" src="./main.js"></script>
</body>
</html>
