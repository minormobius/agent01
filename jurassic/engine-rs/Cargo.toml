[package]
name = "jurassic-engine"
version = "0.1.0"
edition = "2021"
description = "The Daohugou soundscape kernel in Rust → WASM. A stridulation synthesiser (bandlimited file-and-scraper impulse train driving a two-pole wing resonator) plus an ISO 9613 propagation model, spatialised for a moving listener on a forest-floor plane. Zero dependencies, no wasm-bindgen — a raw wasm32-unknown-unknown module driven from an AudioWorklet."

[lib]
# cdylib → the .wasm artifact; rlib → so `cargo test` can unit-test on the host.
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
