name: Deploy foam (voronoi foam walker)

on:
  push:
    branches: ['claude/voronoi-foam-interactive-keo0uy']
    paths:
      - 'foam/**'
      - '.github/workflows/deploy-foam.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kernel selftest (the walk certificate)
        run: node test/foamworld.selftest.mjs
      - name: Install wrangler
        run: npm install wrangler
      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the foam is live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://foam.mino.mobi/ | grep -qi 'voronoi foam'; then
              echo "✓ foam is live"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 4
          done
          echo "⚠️ foam didn't respond within 20s — a FIRST deploy also creates the custom domain, which can take a few minutes to propagate."
