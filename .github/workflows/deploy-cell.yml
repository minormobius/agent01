name: Deploy cell (Minimal Cell Twin)

on:
  push:
    branches: ['claude/cellular-digital-twin-research-o8k3vb']
    paths:
      - 'cell/**'
      - '.github/workflows/deploy-cell.yml'
      - 'scripts/route-dns.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The stage 2 engine's known-answer checks: mass balance, determinism, and the
      # clustered-beats-scattered result the page is about.
      - name: Selftest the simulation engines
        run: |
          node stage2/sim.selftest.mjs
          node stage3/data/genome.selftest.mjs
          node stage3b/sim.selftest.mjs
          node stage3c/sim.selftest.mjs
      - name: Install wrangler
        run: npm install wrangler
      # cell.mino.mobi is a plain route (no custom-domain slot), and a route makes no DNS:
      # without a proxied record the host is dead however green the deploy.
      - name: Ensure DNS for plain routes
        run: node ../scripts/route-dns.mjs wrangler.jsonc --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A green deploy is not proof, least of all on a route: the check is the HOST answering.
      # Strict — a route surface whose host does not serve is a failed deploy.
      - name: Verify cell.mino.mobi serves (route)
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS https://cell.mino.mobi/ | grep -qi 'Minimal Cell Twin'; then
              echo "✓ cell.mino.mobi is live"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 8
          done
          echo "✗ cell.mino.mobi did not serve within ~60s"; exit 1
