name: Deploy b (Bluesky corner)

on:
  push:
    branches: ['claude/mutual-closeness-game-earzue']
    paths:
      - 'b/**'
      - '.github/workflows/deploy-b.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b
    # Mapped to env at the job level because a step-level `if:` cannot read the
    # `secrets` context — only `env`. GitHub still masks the value in logs.
    #
    # NAME MAPPING, and it is the SAME credential mega uses: the key is stored
    # as the GitHub repo secret `jev_key`; the worker reads the Cloudflare
    # secret TYPESAFE_API_KEY. One credential, installed in two places — see
    # b/lib/jev.js for why /mood does not just call mega's proxy instead.
    env:
      TYPESAFE_API_KEY: ${{ secrets.JEV_KEY || secrets.TYPESAFE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      # /mood is the only thing on this surface that spends money, and the
      # question SHAPES are the contract with TypeSafe — a malformed one is a
      # 422 that still cost a round trip. Gate the deploy on them, the way
      # deploy-mega.yml gates on jev's. Runs offline: no key, no network.
      - name: mood selftest (the question shapes, and the averaging trap)
        run: node mood/mood.selftest.mjs

      # Stage the shared OAuth client lib under the assets dir so the /coin
      # posting box can `import` it from b.mino.mobi/packages/oauth-client/auth.js
      # (assets root is b/, so packages/ lives outside it — copy it in at deploy
      # time rather than vendoring a divergent copy; mirrors the mappa pattern).
      - name: Stage shared oauth-client lib
        run: |
          mkdir -p packages/oauth-client
          cp ../packages/oauth-client/auth.js packages/oauth-client/auth.js

      # lathe's `archive` source downloads a whole repo as a CAR and parses it with
      # the vendored Rust->WASM parser that already lives under rite/. The assets
      # binding only serves this surface's directory, so a cross-project import
      # would 404 in the browser — stage a copy in rather than vendoring a second
      # binary into git.
      - name: Stage CAR parser lib (for lathe's archive source)
        run: |
          mkdir -p lib/atproto
          cp -r ../rite/lib/atproto/. lib/atproto/
          ls -la lib/atproto lib/atproto/wasm

      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Without this the /mood page says it is unconfigured rather than
      # pretending — `configured: false` on /api/mood/health, and a 503 with a
      # sentence instead of a blank ring.
      - name: Sync the Jev API key to Cloudflare (for /mood)
        if: ${{ env.TYPESAFE_API_KEY != '' }}
        run: |
          echo "found a repo secret; writing it to the b worker as TYPESAFE_API_KEY"
          printf '%s' "$TYPESAFE_API_KEY" | npx wrangler secret put TYPESAFE_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report when the mood ring has no model to ask
        if: ${{ env.TYPESAFE_API_KEY == '' }}
        run: echo "::notice::Neither jev_key nor TYPESAFE_API_KEY is set on this repo, so b.mino.mobi/mood/ will report itself unconfigured."

      - name: Set feedgen worker secrets (modulo/morphyx search + gemini regex)
        env:
          MODULO_HANDLE: ${{ secrets.BLUESKY_MODULO_HANDLE }}
          MODULO_APP_PASSWORD: ${{ secrets.BLUESKY_MODULO_APP_PASSWORD }}
          MORPHYX_HANDLE: ${{ secrets.BLUESKY_MORPHYX_HANDLE }}
          MORPHYX_APP_PASSWORD: ${{ secrets.BLUESKY_MORPHYX_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$MODULO_APP_PASSWORD" ]; then
            printf '%s' "$MODULO_HANDLE"       | npx wrangler secret put BLUESKY_MODULO_HANDLE
            printf '%s' "$MODULO_APP_PASSWORD" | npx wrangler secret put BLUESKY_MODULO_APP_PASSWORD
            echo "✓ modulo search secrets set (preferred service account)"
          else
            echo "· modulo creds empty — falling back to morphyx"
          fi
          if [ -n "$MORPHYX_APP_PASSWORD" ]; then
            printf '%s' "$MORPHYX_HANDLE"       | npx wrangler secret put BLUESKY_MORPHYX_HANDLE
            printf '%s' "$MORPHYX_APP_PASSWORD" | npx wrangler secret put BLUESKY_MORPHYX_APP_PASSWORD
            echo "✓ morphyx search secrets set"
          else
            echo "· morphyx creds empty — search stays off"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
            echo "✓ GEMINI_API_KEY set (regex assistant on)"
          else
            echo "· GEMINI_API_KEY empty — regex assistant stays off"
          fi
