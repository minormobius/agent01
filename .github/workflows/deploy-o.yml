name: Deploy o (o.mino.mobi — your Bluesky circle)

on:
  push:
    branches: ['claude/focused-knuth-f0oawl']
    paths:
      - 'o/**'
      - '.github/workflows/deploy-o.yml'
      - 'scripts/route-dns.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: o
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Selftest (ranking, rings, the worker's path rules)
        run: node o.selftest.mjs
      - name: Install wrangler
        run: npm install wrangler
      # o.mino.mobi is a plain route (no custom-domain slot), and a route makes no DNS:
      # without a proxied record the host is dead however green the deploy.
      - name: Ensure DNS for plain routes
        run: node ../scripts/route-dns.mjs wrangler.jsonc --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A green deploy is not proof, least of all on a route: the check is the HOST answering.
      # Strict — a route surface whose host does not serve is a failed deploy.
      - name: Verify o.mino.mobi serves (route)
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS https://o.mino.mobi/ | grep -qi 'handle in, circle out' && curl -fsS -o /dev/null https://o.mino.mobi/av/did:plc:z72i7hdynmk6r22z27h6tvur/bafkreihwihm6kpd6zuwhhlro75p5qks5qtrcu55jp3gddbfjsieiv7wuka; then
              echo "✓ o.mino.mobi is live, avatar proxy answers"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 8
          done
          echo "✗ o.mino.mobi did not serve within ~60s"; exit 1
