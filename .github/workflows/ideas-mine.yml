name: Ideas — mine arXiv

# Daily. Fetches one day of arXiv, has an agent write toy concepts from it, gates
# them, and appends the survivors to .github/ideas/queue.jsonl. Posts nothing —
# ideas-post.yml drains the queue on its own schedule.
#
# THREE STAGES, EACH ABLE TO FAIL WITHOUT LYING:
#   fetch  → .github/ideas/inbox.json     (retrieval; no judgement)
#   agent  → .github/ideas/drafts.json    (judgement; no publishing)
#   gate   → .github/ideas/queue.jsonl    (mechanical rejection; the interlock)
#
# NOTE ON `schedule:`. GitHub cron has never fired on this repo (root CLAUDE.md;
# it is why workers/cron exists as a trampoline). The schedule below is declared
# so it works if that is ever fixed, but the RELIABLE trigger is the trampoline
# calling workflow_dispatch. Adding this workflow to workers/cron is a required
# follow-up and belongs on that worker's own branch — see docs/IDEAS-BOT.md.

on:
  schedule:
    # 06:00 UTC — after the ~00:00 UTC arXiv announcement, so "today" is complete.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to mine (YYYY-MM-DD, UTC). Blank = today.'
        required: false
        type: string
      skip_agent:
        description: 'Fetch only — write the inbox and stop (cheap, no model spend).'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'claude/hardware-toy-ideas-*'
    paths:
      - '.github/workflows/ideas-mine.yml'   # edit this file to fire a run

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ~28 categories at 3s spacing, as arXiv asks. Roughly 90 seconds.
      - name: Fetch today's arXiv
        id: fetch
        run: |
          node scripts/ideas-fetch.mjs ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.github/ideas/inbox.json','utf8')).papers.length)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "### Inbox: $COUNT unseen papers" >> "$GITHUB_STEP_SUMMARY"

      # A weekend or a holiday genuinely has no new papers. That is not a failure
      # and must not spend a model call to discover.
      - name: Nothing new
        if: steps.fetch.outputs.count == '0'
        run: |
          echo "No unseen papers — arXiv does not announce every day. Stopping."
          echo "Nothing to mine today (no unseen papers)." >> "$GITHUB_STEP_SUMMARY"

      - name: Check model credentials are present
        if: steps.fetch.outputs.count != '0' && !inputs.skip_agent
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$OAUTH" ]; then
            echo "::error::neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set."
            exit 1
          fi

      - name: Install the agent
        if: steps.fetch.outputs.count != '0' && !inputs.skip_agent
        run: npm install -g @anthropic-ai/claude-code

      # Write-only-to-drafts.json is not enforced by tooling here — the gate is
      # what stands between this step and the timeline, and it re-reads the inbox
      # rather than trusting anything the agent says about it.
      - name: Write concepts
        if: steps.fetch.outputs.count != '0' && !inputs.skip_agent
        timeout-minutes: 20
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          set -uo pipefail
          PROMPT="$(cat .github/ideas/BRIEF.md)

          Today's inbox is at .github/ideas/inbox.json. Write .github/ideas/drafts.json now."
          printf '%s' "$PROMPT" | claude -p \
            --model claude-sonnet-5 \
            --max-turns 40 \
            --max-budget-usd 2 \
            --permission-mode acceptEdits \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
            --disallowedTools "Bash" "WebFetch" "WebSearch" "Task" "NotebookEdit" \
            --output-format stream-json --verbose | tee -a /tmp/ideas-agent.jsonl
          exit ${PIPESTATUS[0]}

      # An agent that produced nothing is a quiet day, not a broken pipeline. The
      # distinction the report has to preserve: no papers, no drafts, or drafts
      # that all failed the gate — three different problems.
      - name: Gate the drafts
        if: steps.fetch.outputs.count != '0' && !inputs.skip_agent
        run: |
          if [ ! -f .github/ideas/drafts.json ]; then
            echo "::warning::the agent wrote no drafts.json — nothing to gate"
            echo "The agent produced no drafts." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/ideas-gate.mjs --write | tee /tmp/gate.txt
          {
            echo '### Gate'
            echo '```'
            cat /tmp/gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # inbox.json and drafts.json are working files and stay out of the commit;
      # the queue and the seen-set are the durable state. seen.json is committed
      # even on a zero-accept day — otherwise tomorrow re-considers today's
      # rejects and spends the same model call to reach the same conclusion.
      - name: Commit the queue
        run: |
          git config user.name "ideas-bot"
          git config user.email "admin@mino.mobi"
          git add .github/ideas/queue.jsonl .github/ideas/seen.json
          if git diff --staged --quiet; then
            echo "Nothing new to queue."
          else
            PENDING=$(node -e "const fs=require('fs');const p='.github/ideas/queue.jsonl';const l=fs.existsSync(p)?fs.readFileSync(p,'utf8').split('\n').filter(Boolean):[];console.log(l.map(JSON.parse).filter(e=>!e.posted).length)")
            git commit -m "ideas: mine $(date -u +%Y-%m-%d) — $PENDING pending"
            for attempt in 1 2 3 4; do
              git push && break || { echo "push failed, retrying…"; git pull --rebase --autostash; sleep $((attempt*2)); }
            done
          fi
