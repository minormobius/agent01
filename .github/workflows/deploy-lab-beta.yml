name: Deploy lab-beta (beta.minomobi.com)

# One of three lab slots. A slot serves up to 100 agent-built tenant sites at
# beta.minomobi.com/<slug>/. See docs/LAB-FACTORY.md.
#
# Tenants are NOT on *.mino.mobi deliberately — that domain carries the shared
# SSO cookie, and agent-written JavaScript must never sit on an origin that
# holds a signed-in visitor's session (LAB-FACTORY.md section 3).
#
# The path-containment gate that keeps one tenant out of another's directory
# lives in lab-build.yml, where the agent's push is validated before it reaches
# this branch. By the time this workflow runs, the diff is already trusted.

on:
  push:
    branches: [main, 'claude/lab-beta']
    paths:
      - 'lab/beta/**'
      # The slot serves the shared kit at /_kit/, copied in at deploy time.
      - 'lab/_kit/**'
      - 'scripts/gen-lab-tenants.mjs'
      - '.github/workflows/deploy-lab-beta.yml'
  workflow_dispatch:

# Two builds must never race the same worker: the loser would publish a stale
# tenant set over the winner.
concurrency:
  group: deploy-lab-beta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # tenants.json is a build artefact, never committed — regenerating here
      # means the grid cannot drift from what is actually on disk.
      - name: Build tenant manifest
        run: node scripts/gen-lab-tenants.mjs lab/beta

      - name: Install wrangler
        run: npm install wrangler

      - name: Deploy worker + assets
        working-directory: lab/beta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tee /tmp/deploy-beta.log

      # THE GOLDEN RULE. A green deploy proves nothing: if the config name is not
      # the worker that owns the domain, wrangler cheerfully updates a stray
      # beta.workers.dev and the live site never changes. The only proof is the
      # custom-domain binding in the log.
      - name: Verify the custom domain is bound
        run: |
          if grep -q 'beta\.minomobi\.com' /tmp/deploy-beta.log; then
            echo "✓ deploy log references beta.minomobi.com"
            grep -i 'custom domain' /tmp/deploy-beta.log || \
              echo "::warning::domain named but no '(custom domain)' line — check the route is custom_domain:true"
          else
            echo "::error::deploy log never mentions beta.minomobi.com — this landed on a stray workers.dev"
            exit 1
          fi

      - name: Verify the slot is live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://beta.minomobi.com/" | grep -q 'lab slot'; then
              echo "✓ beta.minomobi.com is live"; exit 0
            fi
            echo "  attempt $attempt: not yet (cert may still be provisioning), sleeping…"; sleep 5
          done
          echo "::warning::beta.minomobi.com did not respond within 30s — first deploys wait on cert issuance."
