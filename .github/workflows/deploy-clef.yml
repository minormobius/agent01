name: Deploy clef (sheet music viewer & composer)

on:
  push:
    branches: ['claude/sheet-music-viewer-composer-qb4ljl']
    paths:
      - 'clef/**'
      - '.github/workflows/deploy-clef.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The gate. Almost every bug this engraver has had was a wrong NUMBER
      # that still drew something plausible — a key signature an octave low, a
      # stem anchored at the middle line, a tie played as two notes. None of
      # that shows up in a screenshot, so it is checked here, before shipping,
      # against known answers. The sweep also parses and engraves all eight
      # bundled pieces and holds them to their own bar checks.
      - name: Notation selftest (parser, engraver, exports, library)
        run: node test/notation.selftest.mjs

      - name: Install wrangler
        run: npm install wrangler

      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Green is not proof — see the golden rule in the root CLAUDE.md. This
      # asks the live domain whether it is actually serving the new build.
      - name: Verify clef is live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://clef.mino.mobi/ | grep -qi 'sheet music in plain text'; then
              echo "✓ clef.mino.mobi is serving the page"
              curl -fsS https://clef.mino.mobi/health || true
              exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"
            sleep 5
          done
          echo "⚠️ clef.mino.mobi did not answer within ~25s — a FIRST deploy also creates the"
          echo "   custom domain, which can take a few minutes to propagate. Check the deploy"
          echo "   log above binds 'clef.mino.mobi (custom domain)'; if it bound a *.workers.dev"
          echo "   name instead, the worker name in wrangler.jsonc is not the domain's owner."
