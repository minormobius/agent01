name: cad gripper

# The headless loop for morphyx/gripper, run where node and the cad package are:
# generate the trees at a pose, build every part exact, check interference at
# closed, reference and open, and — only when asked — publish the parts and the
# assembly into the morphyx repo as cad.mino.mobi files.
#
# Wakes on a push to its own branch that touches its own files (the sandbox
# cannot dispatch workflows), or by hand. It writes to a public ATProto repo
# only when asked — the `publish` input, or `[publish]` in the head commit
# message — so read morphyx/gripper/README.md first.
on:
  push:
    branches:
      - claude/gripper-mechanism-design-efcdzz
    paths:
      - 'morphyx/gripper/**'
      - '.github/workflows/cad-gripper.yml'
  workflow_dispatch:
    inputs:
      nut:
        description: nut bracket centre y for the analytic audit's reference pose (the document is kinematic)
        default: '53'
      publish:
        description: write the parts and the assembly into the morphyx repo
        type: boolean
        default: false

env:
  NUT: ${{ inputs.nut || '53' }}
  PUBLISH: ${{ inputs.publish || contains(github.event.head_commit.message, '[publish]') }}

jobs:
  gripper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The cad package (the tangled mirror; node 22 and nothing else)
        run: git clone --depth 1 https://tangled.org/morphyxmino.bsky.social/cad /tmp/cad

      - name: Generate the trees at the pose
        run: |
          node morphyx/gripper/gripper.mjs --nut "$NUT" --out /tmp/gripper

      - name: Exact build of every part (Truck) — must be ok and watertight
        working-directory: /tmp/cad
        run: |
          mkdir -p /tmp/gripper/reports
          for f in /tmp/gripper/parts/*.json; do
            n=$(basename "$f" .json)
            echo "── $n"
            node agent/build.mjs "$f" --json "/tmp/gripper/reports/$n.json"
          done

      - name: Closed forms
        run: |
          node -e '
            const fs = require("fs"); const exp = JSON.parse(fs.readFileSync("/tmp/gripper/expected.json"));
            let bad = 0;
            for (const [n, e] of Object.entries(exp)) { if (n === "_") continue;
              const r = JSON.parse(fs.readFileSync(`/tmp/gripper/reports/${n}.json`)); const v = r.invariants.volume;
              const err = Math.abs(v - e.volume) / e.volume; const ok = err < e.tol; if (!ok) bad++;
              console.log(`${ok ? "✓" : "✗"} ${n.padEnd(12)} ${v.toFixed(1)} vs ${e.volume.toFixed(1)}  ${(err * 100).toFixed(3)}%`); }
            process.exit(bad ? 1 : 0);'

      - name: Interference through one grip cycle and through the physical stroke (Manifold, shared volume; the gate)
        working-directory: /tmp/cad
        run: |
          echo "── gripper.json: 24 instants over one clock turn (12 s at rpm 5)"
          node agent/check.mjs /tmp/gripper/gripper.json --sweep 24
          echo "── gripper-stroke.json: 24 instants over one stroke, open → closed"
          node agent/check.mjs /tmp/gripper/gripper-stroke.json --sweep 24 --period "$(node -e 'import(process.env.GITHUB_WORKSPACE + "/morphyx/gripper/gripper.mjs").then(m => console.log(m.D.strokeSeconds))')"

      - name: Clearance table through the cycle (exact meshes; for the record, not a gate — running fits and sliding faces read as close and contact)
        working-directory: /tmp/cad
        run: node agent/check.mjs /tmp/gripper/gripper.json --sweep 24 --clearance 1 || echo "::warning::clearance table has close or contact pairs — read the table above"

      - name: Publish plan
        run: node morphyx/gripper/publish.mjs --cad /tmp/cad --reports /tmp/gripper/reports --nut "$NUT"

      - name: Publish into the morphyx repo
        if: ${{ env.PUBLISH == 'true' }}
        env:
          CAD_HANDLE: ${{ secrets.BLUESKY_MORPHYX_HANDLE }}
          CAD_APP_PASSWORD: ${{ secrets.BLUESKY_MORPHYX_APP_PASSWORD }}
        run: node morphyx/gripper/publish.mjs --cad /tmp/cad --reports /tmp/gripper/reports --nut "$NUT" --write

      - name: Verify on the live host
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          # the morphyx persona's public repo, through the site's read gateway; no credentials involved
          curl -sS 'https://cad.mino.mobi/xrpc/com.atproto.repo.listRecords?repo=morphyxmino.bsky.social&collection=com.minomobi.cad.part' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).records||[];const g=r.filter(x=>x.value.path.startsWith("gripper/"));console.log(`${g.length} gripper files visible through the gateway`);for(const x of g)console.log("  "+x.value.path+"  "+x.uri);if(g.length<17)process.exit(1)})'

      - name: Audit the published corpus (every head rebuilt against the invariants its revision recorded; Truck vs Manifold)
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: /tmp/cad
        run: node agent/audit.mjs --at morphyxmino.bsky.social --kernels
