name: Setup email routing (admin@mino.mobi)

# Adds a Cloudflare Email Routing rule forwarding admin@mino.mobi to a
# destination inbox — the address the Bluesky service account is registered with.
#
# NOT minomobi.com, deliberately. That domain is being handed to the lab factory
# and is the one we accept may get blocklisted for agent-generated content; domain
# blocklists are frequently zone-wide, so putting the service account's RECOVERY
# address there risks losing the account to a flag earned by a generated page.
# See docs/LAB-FACTORY.md §11.2b.
#
# This runs HERE and not from a dev sandbox because the Cloudflare API token is a
# GitHub secret and nothing else has it. "The deploy workflows are your network."
#
# IDEMPOTENT: re-running reconciles rather than duplicating. Safe to re-run.
#
# ONE STEP CANNOT BE AUTOMATED. Cloudflare will not forward to an address until
# that address is verified, and verification is a link in an email only the
# inbox owner can click. If the destination is new, this workflow triggers the
# verification email and then tells you to go and click it.
#
# MEASURED, run 3: this repo's CLOUDFLARE_API_TOKEN can read zones and can read
# the account's destination addresses, but CANNOT create one — the account-scoped
# endpoint returns `10000: Authentication error`. And the destination was
# `absent`, which disproves the assumption written here earlier that the existing
# tips@/editor@/modulo@/morphyx@ routing had already verified it; those forward
# somewhere else. So the destination has to be added once by hand (or the token
# widened), and the step below says exactly that instead of failing opaquely.

# NOTE: workflow_dispatch only resolves for workflows on the DEFAULT branch, so
# while this lives on a feature branch the UI button does not exist. The push
# trigger below is how it is run until then — bump the marker and push. It is
# idempotent, so running it on every edit of this file is harmless.
# marker: 2026-07-26b

on:
  push:
    paths:
      - '.github/workflows/setup-email-routing.yml'
  workflow_dispatch:
    inputs:
      local_part:
        description: 'Mailbox to create, without the @domain'
        required: true
        default: 'admin'
        type: string
      destination:
        description: 'Inbox to forward to (must be verified with Cloudflare)'
        required: true
        type: string
      zone:
        description: 'Domain to add the rule to'
        required: true
        default: 'mino.mobi'
        type: string

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reconcile the forwarding rule
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Defaults apply on a push run, where there are no inputs.
          LOCAL: ${{ inputs.local_part || 'admin' }}
          DEST: ${{ inputs.destination || 'majormobius@gmail.com' }}
          ZONE: ${{ inputs.zone || 'mino.mobi' }}
        run: |
          set -uo pipefail
          API=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")
          ADDR="${LOCAL}@${ZONE}"

          ok() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.exit(JSON.parse(s).success?0:1)}catch{process.exit(1)}})'; }
          errs() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.errors||[]).map(e=>`${e.code}: ${e.message}`).join("; ")||"(no detail)")}catch{console.log(s.slice(0,200))}})'; }

          # --- zone id -------------------------------------------------------
          Z=$(curl -sS "${auth[@]}" "$API/zones?name=$ZONE")
          if ! printf '%s' "$Z" | ok; then
            echo "::error::could not list zones — $(printf '%s' "$Z" | errs)"
            echo "::error::The API token likely lacks Zone:Read. Email Routing needs"
            echo "::error::Zone:Read + Zone:Email Routing Rules:Edit + Account:Email Routing Addresses:Edit."
            exit 1
          fi
          ZID=$(printf '%s' "$Z" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result;process.stdout.write(r&&r[0]?r[0].id:"")})')
          [ -n "$ZID" ] || { echo "::error::zone $ZONE not found on this account"; exit 1; }
          echo "zone $ZONE -> $ZID"

          # --- destination address must exist and be verified ----------------
          D=$(curl -sS "${auth[@]}" "$API/accounts/$CF_ACCOUNT_ID/email/routing/addresses?per_page=50")
          VERIFIED=$(printf '%s' "$D" | DEST="$DEST" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=(JSON.parse(s).result)||[];const m=r.find(a=>a.email===process.env.DEST);process.stdout.write(m?(m.verified?"yes":"pending"):"absent")})')
          echo "destination $DEST -> $VERIFIED"

          if [ "$VERIFIED" = absent ]; then
            A=$(curl -sS -X POST "${auth[@]}" "$API/accounts/$CF_ACCOUNT_ID/email/routing/addresses" \
                 -d "$(node -e 'console.log(JSON.stringify({email:process.env.DEST}))')")
            if printf '%s' "$A" | ok; then
              echo "::warning::Verification email sent to $DEST — click the link, then re-run this workflow."
            else
              DETAIL=$(printf '%s' "$A" | errs)
              echo "::error::could not add $DEST as a destination — $DETAIL"
              echo "::error::"
              echo "::error::A rule cannot forward to an address Cloudflare has not verified, so"
              echo "::error::this is a hard stop. Two ways past it, either is fine:"
              echo "::error::"
              echo "::error::  1. Add it by hand: Cloudflare dashboard → Email → Email Routing →"
              echo "::error::     Destination addresses → Add. Click the link in the resulting"
              echo "::error::     email, then re-run this workflow. Costs one minute, no token change."
              echo "::error::  2. Widen CLOUDFLARE_API_TOKEN with Account → Email Routing Addresses"
              echo "::error::     → Edit, and re-run. Worth it only if this will happen often."
              echo "::error::"
              echo "::error::Either way you still click a verification link — option 1 does not"
              echo "::error::cost you a step, it just moves where the address is created."
              exit 1
            fi
          elif [ "$VERIFIED" = pending ]; then
            echo "::warning::$DEST is added but NOT verified — click the link in the Cloudflare email."
          fi

          # --- the rule ------------------------------------------------------
          # Reconcile rather than duplicate: Cloudflare will happily hold two
          # rules for the same address, and the second is invisible confusion.
          R=$(curl -sS "${auth[@]}" "$API/zones/$ZID/email/routing/rules?per_page=50")
          EXISTING=$(printf '%s' "$R" | ADDR="$ADDR" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=(JSON.parse(s).result)||[];const m=r.find(x=>(x.matchers||[]).some(y=>y.value===process.env.ADDR));process.stdout.write(m?m.tag:"")})')

          BODY=$(ADDR="$ADDR" DEST="$DEST" node -e 'console.log(JSON.stringify({
            name: `${process.env.ADDR} -> ${process.env.DEST}`,
            enabled: true,
            matchers: [{ type: "literal", field: "to", value: process.env.ADDR }],
            actions:  [{ type: "forward", value: [process.env.DEST] }],
          }))')

          if [ -n "$EXISTING" ]; then
            OUT=$(curl -sS -X PUT "${auth[@]}" "$API/zones/$ZID/email/routing/rules/$EXISTING" -d "$BODY")
            VERB=updated
          else
            OUT=$(curl -sS -X POST "${auth[@]}" "$API/zones/$ZID/email/routing/rules" -d "$BODY")
            VERB=created
          fi

          if printf '%s' "$OUT" | ok; then
            echo "✓ rule $VERB: $ADDR -> $DEST"
          else
            echo "::error::rule $VERB failed — $(printf '%s' "$OUT" | errs)"; exit 1
          fi

          {
            echo "### Email routing"
            echo
            echo "- \`$ADDR\` → \`$DEST\` (rule $VERB)"
            echo "- destination status: **$VERIFIED**"
            [ "$VERIFIED" = yes ] || echo "- ⚠️ mail will NOT forward until the destination is verified — check $DEST for the Cloudflare email"
          } >> "$GITHUB_STEP_SUMMARY"
