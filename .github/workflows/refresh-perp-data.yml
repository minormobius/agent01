name: Refresh perp data (daily)

# COMMITS DATA BACK TO THE REPO. Runs the incremental backfill, regenerates the
# derived statistics, commits any new hours to the branch that OWNS fin (perp is
# served at fin.mino.mobi/perp/ since 2026-09-23 — perp.mino.mobi was detached
# to free a custom-domain slot), and then dispatches deploy-finance.yml on that
# branch. A push made with GITHUB_TOKEN does not fire push-triggered workflows,
# but a workflow_dispatch made with it does, which is why this dispatches.
#
# The owning branch is read from deploy-registry.json at run time rather than
# hardcoded: this file runs from main (schedules only fire on the default
# branch), and a hardcoded owner went stale the day perp changed hands.
#
# Schedule only — no push trigger — so a commit can never wake this.

on:
  schedule:
    - cron: '20 5 * * *'   # 05:20 UTC daily, after the hour has closed everywhere
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-perp-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the branch that owns fin (and so serves perp)
        id: owner
        run: |
          b=$(node -e 'const r=require("./deploy-registry.json");const s=r.surfaces.find(x=>x.surface==="finance");if(!s||!s.paths.includes("perp/**"))process.exit(1);console.log(s.branch)')
          echo "branch=$b" >> "$GITHUB_OUTPUT"
          echo "fin (and perp) are owned by $b"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.owner.outputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch new hours from Hyperliquid and Coinbase
        working-directory: perp
        run: node scripts/backfill.mjs

      - name: Recompute derived statistics
        working-directory: perp
        run: node scripts/analyse.mjs

      - name: Selftest before anything is committed
        working-directory: perp
        run: node test/perp.selftest.mjs

      - name: Commit if the series moved
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- perp/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no new hours"
          else
            git add perp/data
            git commit -m "perp: refresh BTC spot and Hyperliquid funding series"
            git push origin "HEAD:${{ steps.owner.outputs.branch }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy fin (which stages perp into dist/perp)
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy-finance.yml --ref "${{ steps.owner.outputs.branch }}" -f skip_migrations=true
        env:
          GH_TOKEN: ${{ github.token }}
