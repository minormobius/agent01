name: Loop tick (the reactor decides whether to take a turn)

# ─────────────────────────────────────────────────────────────────────────────
# THE REACTOR. One turn of the chain reaction:
#
#   tick  ──writes .github/loop/work/<bead>.json──▶  loop-work
#   loop-work  ──writes .github/loop/verdicts/<turn>.json──▶  loop-judge
#   loop-judge  ──appends .github/loop/runs.jsonl──▶  tick   (the cycle closes)
#                └─regenerates loop/data/graph.json──▶  deploy-loop
#
# A PUSH IS THE MESSAGE BUS. Not repository_dispatch, and not because dispatch
# is worse — because workflow_dispatch and repository_dispatch only resolve for
# workflows that exist on the DEFAULT branch, and this pipeline's state lives on
# a feature branch. GitHub 404s a dispatch at a workflow it cannot see on main.
# lab-build.yml hit exactly this and documents it; the ideas bot hit the sibling
# version (`schedule:` also only fires from the default branch) and silently
# stopped posting for 14 hours.
#
# So the loop is driven by committing files, which works from any branch. The
# cost of that choice is the entire §7 risk in docs/CLOSED-LOOP.md — a push
# wakes 135 potential listeners — which is why the firewall below is not
# optional and runs BEFORE the push, not after.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # The cycle: a judged turn appends to runs.jsonl, which wakes the next tick.
  push:
    branches: ['claude/loop-graph-ticketing-surface-7qxu7c']
    paths:
      - '.github/loop/runs.jsonl'
      - '.github/loop/config.json'
  # Out-of-band, and how a human starts the very first turn.
  workflow_dispatch:
  # workers/cron fires this for cadence, because `schedule:` here would only run
  # from main and the ledger does not live there. Needs CRON_GITHUB_PAT, which
  # has never been set — see workers/cron/CLAUDE.md.
  repository_dispatch:
    types: [loop-tick]

concurrency:
  # ONE TICK AT A TIME, AND NEVER CANCEL. Two concurrent ticks read the same
  # ledger and both decide there is a free concurrency slot, which is how a
  # "max 2" budget dispatches four turns. Cancelling mid-run is worse: it can
  # leave a work order committed with nothing about to consume it.
  group: loop-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # A MERGE-DAY GUARD. A squash merge is one ordinary commit touching every
    # file the branch ever added, so a merge that carries months of runs.jsonl
    # appends would look to this trigger like a fresh judged turn and start the
    # loop from an integration commit nobody meant as a run. Real merge commits
    # are safe by accident (git diff-tree prints nothing for them); squashes are
    # not. This is the same scar lab-build.yml carries.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'merge candidate')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Gate 1: the master switch ──────────────────────────────────────────
      # Before anything reads a ledger or spends a second of runner time.
      - name: Is the loop enabled?
        id: enabled
        run: |
          ENABLED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.github/loop/config.json','utf8')).enabled===true)")
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::The loop is disabled in .github/loop/config.json. Nothing to do."
          fi

      # ── Gate 2: the graph is coherent ──────────────────────────────────────
      # A cycle or a dangling edge makes the scheduler refuse to schedule, which
      # presents to a human as "the loop stopped for no reason". Fail loudly here.
      - name: The ledger is a valid graph
        if: steps.enabled.outputs.enabled == 'true'
        run: node scripts/beads.mjs lint

      # ── Gate 3: THE CONTAGION FIREWALL ─────────────────────────────────────
      # docs/CLOSED-LOOP.md §7. Asserted before the loop is allowed to commit,
      # every single turn — not once at design time. A workflow elsewhere in the
      # repo can grow a trigger that overlaps this loop's write paths at any
      # time, and nobody would notice until the loop woke it.
      - name: Blast radius is contained
        if: steps.enabled.outputs.enabled == 'true'
        run: node scripts/loop-blast-radius.mjs --check

      # ── The decision ───────────────────────────────────────────────────────
      # Exit 3 is halt-by-design, not failure. A red run every time a stop
      # condition works correctly is how a team learns to ignore red runs.
      - name: Decide
        id: decide
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          set +e
          node scripts/loop-tick.mjs --write
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            echo "acted=halt" >> "$GITHUB_OUTPUT"
            node scripts/loop-tick.mjs --json > /tmp/decision.json
            echo "::notice::Loop halted — $(node -e "console.log(require('/tmp/decision.json').reason)")"
            exit 0
          fi
          [ "$CODE" = "0" ] || exit "$CODE"
          echo "acted=dispatch" >> "$GITHUB_OUTPUT"

      # ── The push that wakes loop-work ──────────────────────────────────────
      # OS_AGENT_GITHUB_TOKEN, not the Actions token: a push made with the
      # default GITHUB_TOKEN does NOT trigger other workflows, so the chain
      # would go green here and stop dead. That is the single most confusing
      # failure this design can have — everything succeeds and nothing happens.
      - name: Commit the work orders
        if: steps.decide.outputs.acted == 'dispatch'
        env:
          GH_TOKEN: ${{ secrets.OS_AGENT_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::OS_AGENT_GITHUB_TOKEN is not set. A push with the Actions token"
            echo "::error::would not wake loop-work, so the chain would stop here silently."
            exit 1
          fi
          git config user.name  "loop-reactor"
          git config user.email "loop@users.noreply.github.com"
          git add .github/loop/work/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }

          # THE COMMIT MESSAGE IS LOAD-BEARING. The merge-day guard above reads
          # it, and so does anyone reading the branch's history trying to work
          # out what the machine did while they were asleep.
          git commit -m "loop: dispatch $(ls .github/loop/work | tr '\n' ' ')"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "push failed, retry $attempt"; sleep $((2 ** attempt))
          done
          echo "::error::could not push the work orders"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Loop tick"
            echo ""
            echo "- enabled: \`${{ steps.enabled.outputs.enabled }}\`"
            echo "- outcome: \`${{ steps.decide.outputs.acted || 'skipped' }}\`"
            echo ""
            echo "The graph: https://loop.mino.mobi/"
          } >> "$GITHUB_STEP_SUMMARY"
