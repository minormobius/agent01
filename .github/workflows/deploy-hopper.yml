name: Deploy hopper (climb the crystal, drop in the bucket)

on:
  push:
    branches: ['claude/bismuth-crystal-procgen-g6t0dh']
    paths:
      - 'hopper/**'
      - 'packages/bismuth/**'
      - 'packages/tilings/**'
      - 'scripts/sync-dataviz.mjs'
      - '.github/workflows/deploy-hopper.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hopper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Served copies in sync with packages/ (the bismuth engine, tilings)
        working-directory: .
        run: node scripts/sync-dataviz.mjs --check
      - name: Engine selftest (golden hashes, connectivity, deploy and remove)
        working-directory: .
        run: node packages/bismuth/crystal.selftest.mjs
      - name: Level selftest (levels are permalinks, the survey reaches, the bucket lands, the body jumps one layer)
        working-directory: .
        run: node hopper/hopper.selftest.mjs
      - name: Install wrangler
        run: npm install wrangler
      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the game is live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://hopper.mino.mobi/l/1 | grep -qi 'a slab in the void' \
               && curl -fsS 'https://hopper.mino.mobi/api/health' | grep -q '"ok":true'; then
              echo "✓ hopper is live"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 4
          done
          echo "⚠️ hopper didn't respond within 20s — edge propagation may be slow, continuing."
