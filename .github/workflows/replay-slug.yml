name: replay-slug

# Actually spends the Jetstream key. This is the one path bsky.mino.mobi has
# that has never run anywhere: plan a window of the ARCHIVE, download a bounded
# slug of it, decode dictionary-compressed zstd frames, and run the surface's
# real rule over the events.
#
# It deliberately uses the BROWSER shims — @bokuweb/zstd-wasm's
# decompressUsingDict and bsky/lib/sha256.js — rather than the SDK's node
# defaults (node:zlib, node:crypto), because those defaults are exactly what a
# browser does not have. Testing them would verify nothing about the page.
#
# Metered: the archive bills by the byte against the key's quota, so the budget
# is small and explicit, and the run prints what it spent.

on:
  push:
    branches:
      - claude/bsky-app-view-feasibility-8sdflz
    paths:
      - '.github/scripts/replay-slug.mjs'
      - '.github/workflows/replay-slug.yml'
  workflow_dispatch:
    inputs:
      budget_mb:
        description: 'Hard byte budget for the download'
        default: '50'
      seq_back:
        description: 'How far back from the tip to start (in seq)'
        default: '3400000'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed at the repo root, not in RUNNER_TEMP: ESM ignores NODE_PATH,
      # so a bare specifier resolves only by walking up from the importing file
      # to a node_modules. --no-save leaves package.json alone. Unlike
      # deploy-bsky.yml this is safe here — nothing in this workflow publishes
      # the tree, so an installed node_modules cannot reach the live site.
      - name: Install the SDK and a dictionary-capable zstd
        run: npm install --no-save --no-package-lock @bsky/jetstream @bokuweb/zstd-wasm

      - name: Plan a window, buy a slug of it, run the rule
        env:
          JETSTREAM_KEY: ${{ secrets.JETSTREAM_KEY }}
          # A push run uses the smaller figure: this spends a metered credential,
          # so the mechanics get proven cheaply before a full slug is bought.
          BUDGET_MB: ${{ inputs.budget_mb || '50' }}
          SEQ_BACK: ${{ inputs.seq_back }}
        run: node .github/scripts/replay-slug.mjs
