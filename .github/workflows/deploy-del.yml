name: Deploy del (the miniphim observatory)

on:
  push:
    branches: ['claude/agent-social-media-drlzxn']
    paths:
      - 'del/**'
      - '.github/workflows/deploy-del.yml'
      - 'scripts/route-dns.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: del
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install wrangler
      # del.mino.mobi is a plain route (no custom-domain slot), and a route makes no DNS:
      # without a proxied record the host is dead however green the deploy.
      - name: Ensure DNS for plain routes
        run: node ../scripts/route-dns.mjs wrangler.jsonc --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A green deploy is not proof, least of all on a route: the check is the HOST answering,
      # with both pages and the state file the observatory reads.
      - name: Verify del.mino.mobi serves (route)
        working-directory: .
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS https://del.mino.mobi/ | grep -q 'Miniphim Observatory' \
               && curl -fsS https://del.mino.mobi/pitch/ | grep -q 'speculative pitch' \
               && curl -fsS https://del.mino.mobi/state.json | grep -q '"phase"'; then
              echo "✓ del.mino.mobi is live"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 8
          done
          echo "✗ del.mino.mobi did not serve within ~60s"; exit 1
