name: Propagate the lab kit to every slot

# The shared kit is the community's one visual language, so an edit to it must
# re-skin every slot. But slot deploys trigger on their own branch
# (claude/lab-<slot>) — that is what makes the publish pointer work — so a kit
# edit made anywhere else never reaches them, and a slot nobody has built on
# stays stale indefinitely. Caught by curl: the kit 404'd on alph while serving
# fine on the rollup.
#
# This merges the kit commit into each slot branch, which fires that slot's
# deploy and re-copies the kit.
#
# MERGE, never force-push. A slot branch carries its published tenants; force
# -pushing this commit over it would delete every site in that slot.

on:
  push:
    paths:
      - 'lab/_kit/**'
      - '.github/workflows/propagate-kit.yml'
  workflow_dispatch:

concurrency:
  group: propagate-kit
  cancel-in-progress: false

jobs:
  propagate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OS_AGENT_GITHUB_TOKEN || github.token }}

      - name: Merge the kit into each slot branch
        run: |
          set -uo pipefail
          git config user.name  'lab-factory'
          git config user.email 'editor@minomobi.com'
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          fail=0

          for slot in alph beta gamm; do
            BR="claude/lab-$slot"
            echo "::group::$BR"

            if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
              git fetch origin "$BR" --quiet
              git checkout -B "_prop_$slot" "origin/$BR" --quiet
              if ! git merge --no-edit "$SHA" >/dev/null 2>&1; then
                # Never auto-resolve: a wrong resolution between slot content and
                # the kit silently ships a broken slot.
                git merge --abort || true
                echo "::error::$BR conflicts with the kit commit — resolve by hand"; fail=1
                echo "::endgroup::"; continue
              fi
            else
              # No branch yet — this slot has never published a tenant.
              git checkout -B "_prop_$slot" "$SHA" --quiet
            fi

            # ALWAYS write a marker inside the slot's OWN directory, then commit.
            #
            # This is not decoration. Slot deploys are path-filtered on
            # lab/<slot>/**, and a branch-CREATION push has no diff base for
            # GitHub to filter against — so seeding a fresh slot branch silently
            # fires nothing. That is exactly what happened: alph and gamm ended
            # up holding the kit in git and serving 404 for it, while beta
            # deployed only because its merge happened to touch a file that was
            # already in its paths. Touching the slot's own directory makes the
            # filter match on every path, seed or merge alike.
            #
            # It also earns its keep as provenance: which kit is this slot on?
            printf '%s\n' "$SHORT" > "lab/$slot/.kit-version"
            git add "lab/$slot/.kit-version"
            if git diff --cached --quiet; then
              echo "already on kit $SHORT — nothing to do"
              echo "::endgroup::"; continue
            fi
            git commit -q -m "lab($slot): kit $SHORT" \
                          -m "Propagated by propagate-kit.yml so this slot re-copies lab/_kit/."

            if git push origin "HEAD:$BR"; then
              echo "pushed — deploy-lab-$slot will re-copy the kit"
            else
              echo "::error::push to $BR failed"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Note the propagation
        if: always()
        run: |
          {
            echo "### Kit propagation"
            echo
            echo "Merged the current commit into each slot branch so every slot"
            echo "re-copies \`lab/_kit/\` on its next deploy."
          } >> "$GITHUB_STEP_SUMMARY"
