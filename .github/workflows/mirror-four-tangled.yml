name: Mirror four's solvers to Tangled

# Publishes four.mino.mobi's solvers as their own small, MIT-licensed repo on tangled, so someone who wants the
# methods (atoms, Hartree–Fock, molecular dynamics, searches, stars, orbits, nebulae, geometry, all for any number of
# dimensions) clones a few hundred kilobytes instead of the monorepo, under a licence the monorepo doesn't carry.
#
#   git@tangled.org:<TANGLED_REPO_DID>       (the repo's own did:plc, which survives renames; the named form
#   git@tangled.org:<TANGLED_HANDLE>/<TANGLED_REPO> is tried if it doesn't answer)
#
# What ships is decided by four/mirror/build.mjs: the no-DOM modules at their own paths, a known-answer test assembled
# from the site's selftest (the blocks that check methods, not baked data), its fixture, README.md and LICENSE (MIT).
# The staged copy has to pass its own test before anything is pushed.
#
# The repo is created once on tangled by its owner (same account and key as mirror-cad-tangled.yml:
# TANGLED_SSH_KEY_MORPHYX under morphyxmino.bsky.social). Until it exists the push is skipped with a notice, not an
# error. Force-push: the mirror has no history of its own.

on:
  push:
    branches: ['claude/minesweeper-voronoi-mesh-4hc4ir']
    paths:
      - 'four/atom/js/**'
      - 'four/lumen/js/optics.js'
      - 'four/atom/test/atom4.selftest.mjs'
      - 'four/atom/test/fixtures/**'
      - 'four/mirror/**'
      - 'four/atom/tools/bake.mjs'
      - 'four/papers/p1/reproduce.mjs'
      - 'four/papers/p1/data/**'
      - 'four/papers/p1/refs.json'
      - '.github/workflows/mirror-four-tangled.yml'
  workflow_dispatch:

concurrency:
  group: mirror-four-tangled
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      TANGLED_KNOT: tangled.org
      TANGLED_HANDLE: morphyxmino.bsky.social
      TANGLED_REPO: four-atom
      TANGLED_REPO_DID: did:plc:r4ziwpsesst5ykm3afo3rkfq   # four-atom, created 2026-11-10 on knot1.tangled.sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage the mirror and prove it runs alone
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)/four"
          node four/mirror/build.mjs "$OUT"
          ( cd "$OUT" && node atom/test/methods.selftest.mjs | tail -1 )
          ( cd "$OUT" && node papers/p1/reproduce.mjs | tail -1 )   # paper 1's sample, solved again from the copy
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "staged $(find "$OUT" -type f | wc -l) files, $(du -sh "$OUT" | cut -f1)"

      - name: Set up SSH deploy key
        run: |
          test -n "${{ secrets.TANGLED_SSH_KEY_MORPHYX }}" || { echo "✗ secret TANGLED_SSH_KEY_MORPHYX not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.TANGLED_SSH_KEY_MORPHYX }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # IPv4: the knot sits behind Cloudflare and the runner usually has no IPv6 route
          ssh-keyscan -4 -H "$TANGLED_KNOT" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Force-push to tangled (skipped until the repo exists)
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -4 -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519"
          # the repo's DID first (rename-safe), then its name
          REMOTE=""
          for r in "git@${TANGLED_KNOT}:${TANGLED_REPO_DID}" "git@${TANGLED_KNOT}:${TANGLED_HANDLE}/${TANGLED_REPO}"; do
            if git ls-remote "$r" >/dev/null 2>&1; then REMOTE="$r"; break; fi
            echo "  $r did not answer over SSH"
          done
          if [ -z "$REMOTE" ]; then
            echo "::warning::tangled repo ${TANGLED_HANDLE}/${TANGLED_REPO} (${TANGLED_REPO_DID}) not reachable over SSH: is TANGLED_SSH_KEY_MORPHYX's public key in morphyxmino.bsky.social's Tangled keys (the knot reads them from the PDS, cached up to an hour)? Staged and tested; nothing pushed."
            echo "### four: staged and tested, not pushed (${TANGLED_HANDLE}/${TANGLED_REPO} not reachable over SSH)" >> "$GITHUB_STEP_SUMMARY"
            ( set +e; ssh -4 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 -T "git@${TANGLED_KNOT}" 2>&1 | head -5 )
            exit 0
          fi
          # Tangled's Rust knot makes new repos SHA-256 and a SHA-1 repo can't push to one: take the remote's format
          FMT="$(GIT_TRACE_PACKET=1 git -c protocol.version=2 ls-remote "$REMOTE" 2>&1 | grep -o 'git< object-format=sha[0-9]*' | head -1 | cut -d= -f2)"
          FMT="${FMT:-sha1}"
          echo "remote ${REMOTE}, object format ${FMT}"
          cd "$OUT"
          git init -q -b main --object-format="$FMT"
          git add -A
          git -c user.name='four-mirror' -c user.email='mirror@morphyxmino.bsky.social' \
            commit -qm "mirror four's solvers — ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d)"
          git remote add origin "$REMOTE"
          # the knot rate-limits by address; wait and push again
          for attempt in 1 2 3 4; do
            if git push -f origin main; then break; fi
            [ "$attempt" = 4 ] && { echo "✗ the knot refused the push four times"; exit 1; }
            echo "  push refused (attempt $attempt); waiting $((attempt * 30)) s"; sleep $((attempt * 30))
          done
          echo "✓ mirrored four's solvers → ${TANGLED_HANDLE}/${TANGLED_REPO} on ${TANGLED_KNOT}"
          echo "### four mirrored" >> "$GITHUB_STEP_SUMMARY"
          echo "git clone https://tangled.org/${TANGLED_HANDLE}/${TANGLED_REPO}" >> "$GITHUB_STEP_SUMMARY"
