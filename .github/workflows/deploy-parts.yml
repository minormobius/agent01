name: Deploy parts (communities of CAD parts)

on:
  push:
    branches: ['claude/browser-cad-ideation-ollmd3']
    paths:
      - 'parts/**'
      - '.github/workflows/deploy-parts.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The index is SQL over a seam; the selftest runs the same SQL under
      # node:sqlite against a fake PDS and a fake Constellation.
      - name: Selftest the index
        working-directory: parts
        run: node parts.selftest.mjs

      - name: Install wrangler
        run: npm install wrangler

      - name: Deploy worker + assets
        working-directory: parts
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The front door is the cad worker's mount (cad.mino.mobi/parts/), so this
      # waits on deploy-cad too when both run on one push. wrangler.jsonc says
      # why there is no parts.mino.mobi.
      - name: Verify live
        continue-on-error: true
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsSL https://cad.mino.mobi/parts/api/status | grep -q '"ok":true'; then
              echo "✓ parts is live at cad.mino.mobi/parts/"; curl -fsSL https://cad.mino.mobi/parts/api/status; echo
              exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 5
          done
          echo "⚠️ cad.mino.mobi/parts/api/status didn't answer. The mount is the cad"
          echo "   worker's PARTS service binding (packages/cad/wrangler.jsonc); check"
          echo "   deploy-cad's log bound it. Green here alone is not proof."
