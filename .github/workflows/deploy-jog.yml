name: Deploy jog (running-loop finder)

on:
  push:
    branches: ['claude/jog-running-loops']
    paths:
      - 'jog/**'
      - '.github/workflows/deploy-jog.yml'
      - 'scripts/route-dns.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install wrangler
      - name: Solver selftest
        run: node solver.selftest.mjs
      # jog.mino.mobi is a plain route (no custom-domain slot), and a route makes no DNS:
      # without a proxied record the host is dead however green the deploy.
      - name: Ensure DNS for plain routes
        run: node ../scripts/route-dns.mjs wrangler.jsonc --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A green deploy is not proof, least of all on a route: the check is the HOST answering.
      # Strict — a route surface whose host does not serve is a failed deploy.
      - name: Verify jog.mino.mobi serves (route)
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS https://jog.mino.mobi/ | grep -qi 'running loops'; then
              echo "✓ jog.mino.mobi is live"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 8
          done
          echo "✗ jog.mino.mobi did not serve within ~60s"; exit 1
