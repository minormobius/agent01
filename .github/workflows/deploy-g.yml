name: Deploy g (WebGPU gallery)

# g.mino.mobi — the WebGPU gallery. The site lives in clock/; this stages a
# mirror of it into g/dist at build time (sources are NOT moved), so
# clock.mino.mobi keeps serving the same toys until its dashboard redirect to
# g.mino.mobi is in place. Surface docs: g/CLAUDE.md.
#
# No build step here. A toy that needs one compiles in its own workflow and
# commits the artefact — see build-bearings-solver.yml, which dispatches this
# workflow when it lands a new .wasm.

on:
  push:
    branches: ['claude/ball-bearing-assembly-dc9cph']
    paths:
      - 'clock/**'
      - 'g/**'
      - '.github/workflows/deploy-g.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage gallery (mirror of clock/)
        working-directory: g
        run: |
          rm -rf dist && mkdir -p dist
          cp -r ../clock/. dist/
          rm -f dist/wrangler.jsonc dist/wrangler.toml
          # never ship build trees: a toy with a Rust solver (bearings) carries a
          # target/ dir locally, and uploading one would be gigabytes of nothing
          find dist -type d \( -name target -o -name node_modules \) -prune -exec rm -rf {} +
          du -sh dist
          ls -la dist/ | head -30

      - name: Deploy to Cloudflare
        working-directory: g
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
