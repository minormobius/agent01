name: Deploy zest (embedding geometry)

# zest.mino.mobi — posts as spherical-harmonic solids.
#
# Stages the static half into zest/dist (so worker.js, the selftests and the
# wrangler config never reach the published bundle), applies the D1 migration
# for its two tables on the shared atpolls-db, then deploys.
#
# Static Assets replaces the WHOLE manifest on every deploy, so the staging step
# is not a convenience — anything missing from dist/ is missing from the site.

on:
  push:
    branches: ['claude/3d-feed-embedding-geometry-uiveyf']
    paths:
      - 'zest/**'
      - 'poll/apps/api/migrations/0037_zest.sql'
      - '.github/workflows/deploy-zest.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The geometry, the scoring and the worker's pure logic all have
      # known-answer tests. They gate the deploy: if the map stops being
      # faithful, the binomial test stops being calibrated, or the text-only
      # filter springs a leak, the site should not ship.
      - name: Selftests
        run: |
          node embed-geometry.selftest.mjs
          node rounds.selftest.mjs
          node worker.selftest.mjs

      - name: Stage site into dist/
        run: |
          rm -rf dist && mkdir -p dist
          cp index.html atlas.html how.html dist/
          cp embed-geometry.js feed.js game.js rounds.js dist/
          ls -la dist/

      - name: Run D1 migration (zest tables on shared atpolls-db)
        run: |
          npx wrangler d1 execute atpolls-db \
            --file=../poll/apps/api/migrations/0037_zest.sql --remote \
            || echo "⚠️ migration returned non-zero (likely already applied), continuing…"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
