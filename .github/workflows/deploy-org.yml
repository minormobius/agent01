name: Deploy Org

on:
  push:
    branches: ['claude/agent-social-media-drlzxn']
    paths:
      - 'org/**'
      - 'packages/pm/**'
      - '.github/workflows/deploy-org.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: org

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: PM engine selftests (packages/pm, which org's engine.ts re-exports)
        run: node ../packages/pm/engine.selftest.mjs && node ../packages/pm/earned.selftest.mjs

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
