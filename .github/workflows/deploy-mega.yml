name: Deploy Megaproject Dashboard

on:
  push:
    branches: ['claude/jev-demo-website-pw3us1']
    paths:
      - 'mega/**'
      - '.github/workflows/deploy-mega.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mega
    # Mapped to env at the job level because step-level `if:` cannot read the
    # `secrets` context — only `env`. GitHub still masks the value in logs.
    #
    # NAME MAPPING: the key is stored as the GitHub repo secret `jev_key`; the
    # worker reads the Cloudflare secret TYPESAFE_API_KEY. This job is the
    # bridge. TYPESAFE_API_KEY is accepted as a fallback repo-secret name.
    env:
      TYPESAFE_API_KEY: ${{ secrets.JEV_KEY || secrets.TYPESAFE_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The /jev sub-site's selftests. Both run offline against bundled
      # fixtures — no API key, no network. They gate the deploy on purpose:
      # the question shapes are the contract with TypeSafe, and the worker
      # test is what proves the secret cannot come back out of the proxy AND
      # that mounting jev has not disturbed mega's own /sprite and /bees APIs.
      - name: jev delve selftest (question shapes, gate, a full run)
        run: node jev/test/delve.selftest.mjs
      - name: jev worker selftest (the proxy never leaks the key)
        run: node jev/test/worker.selftest.mjs
      - name: jev telemetry selftest (the stats, and what they refuse to claim)
        run: node jev/test/telemetry.selftest.mjs
      - name: jev character selftest (the pack, the tree, and item legality)
        run: node jev/test/character.selftest.mjs
      - name: jev memory selftest (the frontier, and the fog of war it keeps)
        run: node jev/test/memory.selftest.mjs
      - name: jev cascade selftest (the router escalates on state, not confidence)
        run: node jev/test/cascade.selftest.mjs
      - name: jev lab selftest (paper book costs, controls, the gate and the latch)
        run: node jev/test/lab.selftest.mjs

      - name: Deploy static site
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Push the Jev key as a Cloudflare worker secret on `mega`. Skipped (not
      # failed) when the repo secret is unset — the site still deploys and says
      # on the page that it is running the offline stand-in, rather than
      # pretending.
      - name: Sync the Jev API key to Cloudflare
        if: ${{ env.TYPESAFE_API_KEY != '' }}
        run: |
          echo "found a repo secret; writing it to the mega worker as TYPESAFE_API_KEY"
          printf '%s' "$TYPESAFE_API_KEY" | npx wrangler secret put TYPESAFE_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report whether the key is configured
        if: ${{ env.TYPESAFE_API_KEY == '' }}
        run: |
          echo "::notice::Neither jev_key nor TYPESAFE_API_KEY is set on this repo, so mega.mino.mobi/jev/ runs its offline stand-in."

      - name: Verify mega and its sub-sites are live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://mega.mino.mobi/ >/dev/null 2>&1; then
              echo "✓ mega.mino.mobi is live"
              curl -fsS https://mega.mino.mobi/jev/ | grep -qi 'foam dungeon' \
                && echo "✓ /jev/ is live" || echo "⚠️ /jev/ did not answer"
              echo "  /jev/api/health: $(curl -fsS https://mega.mino.mobi/jev/api/health || echo unreachable)"
              curl -fsS "https://mega.mino.mobi/sprite/api/sprite.svg?seed=1" >/dev/null 2>&1 \
                && echo "✓ /sprite/api still serving" || echo "⚠️ /sprite/api did not answer"
              exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 5
          done
          echo "⚠️ mega.mino.mobi didn't respond within ~30s. Check the deploy log bound 'mega.mino.mobi (custom domain)'."
