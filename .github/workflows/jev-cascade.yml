# Runs the three-tier decision cascade end to end with real keys and reports
# what it routed, what it got right, and what it cost.
#
# This spends model budget on every run, so the triggers are deliberately
# narrow: by hand, or when the router or its eval actually changes. NOT on
# `mega/jev/**`, which would bill a run for every unrelated edit to the
# dungeon demo sitting next to it.
name: jev cascade eval

on:
  push:
    branches: [claude/jev-minecraft-headless-9sbgxk]
    paths:
      - 'mega/jev/cascade.mjs'
      - 'mega/jev/eval/**'
      - '.github/workflows/jev-cascade.yml'
  workflow_dispatch:
    inputs:
      tier3_model:
        description: 'Top-tier model (the one the cascade tries not to call)'
        required: false
        default: 'claude-opus-5'
      tier3_budget:
        description: 'How many decisions may reach the top tier. 0 disables it — the default, because the only Claude credential here has no Messages API quota.'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The cascade module itself has no dependencies; only the eval runner
      # needs the SDK, so it is installed here rather than vendored.
      - name: install the Anthropic SDK
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk

      - name: the router's own selftest
        run: node mega/jev/test/cascade.selftest.mjs

      - name: run the cascade
        env:
          # Tier 1 goes through the deployed proxy, which holds the Jev key
          # itself — nothing to inject here.
          JEV_ENDPOINT: https://mega.mino.mobi/jev/api/ask
          # Tier 2. The key lives under any of four names in this repo; the
          # first one set wins, matching deploy-os-api.yml.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DS_API_KEY || secrets.DEEPSEEK }}
          # Tier 3. This repo authenticates Claude both ways depending on the
          # workflow, so pass whichever exists; the runner picks the right
          # auth header for each.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TIER3_MODEL: ${{ inputs.tier3_model }}
          TIER3_BUDGET: ${{ inputs.tier3_budget || 0 }}
        run: node mega/jev/eval/run.mjs
