name: Deploy Neuro

on:
  push:
    branches: ['claude/website-hidden-paper-8vum5k']
    paths:
      - 'neuro/**'
      - '.github/workflows/deploy-neuro.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble the asset stage
        # Serve neuro/ minus this config and minus engine-rs/ — the Rust sources
        # aren't web assets; homeostasis/pkg/ (the built wasm) is what ships.
        run: |
          rm -rf .neuro-stage && mkdir -p .neuro-stage
          rsync -a --exclude 'wrangler.jsonc' --exclude 'engine-rs/' \
                --exclude '*.selftest.mjs' --exclude 'CLAUDE.md' \
                neuro/ .neuro-stage/
          echo "staged: $(find .neuro-stage -type f | wc -l) files"
          test -f .neuro-stage/homeostasis/pkg/homeostasis_bg.wasm \
            || { echo "::error::wasm module missing from the stage — run build-neuro-engine.yml"; exit 1; }

      - name: Install wrangler
        run: npm install wrangler

      - name: Deploy worker + assets
        working-directory: neuro
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://neuro.mino.mobi/ | grep -qi 'homeostasis'; then
              echo "✓ neuro is live"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 5
          done
          echo "⚠️ neuro.mino.mobi didn't respond. If this is the FIRST deploy, the"
          echo "   custom domain probably isn't attached yet — that's dashboard-only"
          echo "   (docs/DEPLOYS.md §7). Check the deploy log above for"
          echo "   'neuro.mino.mobi (custom domain)'; if it only bound a workers.dev"
          echo "   host, attach the domain to the 'neuro' worker and re-run."
