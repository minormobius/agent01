name: Farm merge party (weekly graduation)

# THE MERGE PARTY. Once a week the testing table's experiments come up for graduation:
# this workflow checks what claude/farm-next holds beyond mainline, runs the FULL walls
# (tests + the scales, hard — this is the road to production), assembles patch notes from
# the ledger delta, opens a PR to the mainline branch, and announces the party on Bluesky.
# A HUMAN merges the PR — experiments may carry mechanics, and mechanics are Tier 3.
# Deliberately deterministic: no agent here; the council session already did its authoring
# on the table, and graduating an x-pocket into real save fields (a v-bump migration) is
# work a human reviews in the PR either way.

# MANUAL TRIGGER WHILE TESTING: cron and workflow_dispatch both need this file on the DEFAULT
# branch to fire; until a merge candidate carries it there, push any commit to the kick branch:
#   git commit --allow-empty -m kick && git push origin HEAD:claude/farm-merge-party-kick
#
# ⚠ THE SCHEDULE LANDS DORMANT — a deliberate edit by the merge candidate, for
# the same reason as farm-sweep.yml (see the note there: `schedule:` does fire
# from main on this repo). No agent runs here, so the cost case is mild, but a
# weekly run of this opens a PR and announces on Bluesky unattended, and the
# party has nothing to graduate until the council it depends on is switched on.
# Turn both on together: uncomment the two `schedule:` lines below.
on:
  # schedule:
  #   - cron: '0 17 * * 5'
  workflow_dispatch:
  push:
    branches:
      - 'claude/farm-merge-party-kick'

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-party:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/farm-next

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Anything to graduate?
        id: delta
        run: |
          git fetch origin claude/farmville-atproto-game-745mcr
          if git diff --quiet origin/claude/farmville-atproto-game-745mcr...HEAD -- farm/; then
            echo "empty=1" >> "$GITHUB_OUTPUT"
            echo "the table is bare — no party this week"
          else
            echo "empty=0" >> "$GITHUB_OUTPUT"
          fi

      - name: The full walls (tests + the scales, hard)
        if: steps.delta.outputs.empty == '0'
        run: |
          fail=0
          for t in farm/test/*.selftest.mjs; do node "$t" || { echo "FAIL $t"; fail=1; }; done
          [ $fail -eq 0 ] || exit 1
          node farm/sim/gate.mjs

      - name: Assemble patch notes
        if: steps.delta.outputs.empty == '0'
        id: notes
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const git = (...a) => execFileSync("git", a, { encoding: "utf8" });
            const base = "origin/claude/farmville-atproto-game-745mcr";
            // ledger delta = the granted petitions graduating this week
            let baseLedger = { entries: [] };
            try { baseLedger = JSON.parse(git("show", base + ":farm/council/ledger.json")); } catch {}
            const headLedger = JSON.parse(require("fs").readFileSync("farm/council/ledger.json", "utf8"));
            const seen = new Set(baseLedger.entries.map((e) => e.date + "|" + e.change));
            const fresh = headLedger.entries.filter((e) => !seen.has(e.date + "|" + e.change));
            const stat = git("diff", "--shortstat", base + "...HEAD", "--", "farm/").trim();
            const lines = fresh.map((e) => "- " + e.change + " — petitioned by " + e.by);
            const body = ["## This week on the testing table", "", ...(lines.length ? lines : ["- (experiments without ledger entries — see the diff)"]), "", "`" + stat + "`", "", "Graduating x-pockets into real save fields (a v-bump migration) happens in review here if needed. The scales and every selftest passed on the head of this PR.", "", "---", "_Generated by [Claude Code](https://claude.ai/code)_"].join("\n");
            require("fs").writeFileSync("party-notes.md", body);
            const summary = lines.length ? lines.map((l) => l.slice(2).split(" — ")[0]).join(" · ").slice(0, 180) : "assorted experiments";
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "summary<<EOF\n" + summary + "\nEOF\n");
          '

      - name: Open the graduation PR
        if: steps.delta.outputs.empty == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --head claude/farm-next --base claude/farmville-atproto-game-745mcr --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file party-notes.md
            echo "refreshed PR #$EXISTING"
          else
            gh pr create \
              --base claude/farmville-atproto-game-745mcr \
              --head claude/farm-next \
              --title "merge party: $(date -u +%Y-%m-%d) — the week's graduating experiments" \
              --body-file party-notes.md
          fi
          # If PR creation is forbidden, flip "Allow GitHub Actions to create and approve
          # pull requests" in the repo's Actions settings — the walls above already passed.

      - name: Announce the party
        if: steps.delta.outputs.empty == '0'
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_BOT_HANDLE || secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_BOT_APP_PASSWORD || secrets.BLUESKY_APP_PASSWORD }}
        run: |
          node farm/sim/reply.mjs --announce --text "this week's graduating experiments: ${{ steps.notes.outputs.summary }} — merging to the mainline farm"
