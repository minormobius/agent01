name: Sync bot passwords (miniphim-bots)

# The person runs this by hand, from the Actions tab, after adding a bot's password to GitHub as
# BOT_<NAME>_PASSWORD (the name LIVE.md and miniphim.minomobi.com/_bots/ give). It copies every
# BOT_*_PASSWORD secret into the miniphim-bots worker, and nothing else anywhere. It reads every
# secret to find them, which is why it lives apart from deploy-miniphim.yml: GitHub holds a
# workflow like that for a person's approval, and the house's own deploys must not wait on one.
on:
  workflow_dispatch:

concurrency:
  group: deploy-miniphim
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniphim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install wrangler
      # The names are logged, never the values (GitHub masks them anyway).
      - name: Copy BOT_*_PASSWORD secrets to the bots worker
        run: |
          umask 077; f=$(mktemp)
          node -e "const s=JSON.parse(process.env.ALL);const o={};for(const[k,v] of Object.entries(s))if(/^BOT_[A-Z0-9_]+_PASSWORD$/.test(k))o[k]=v;require('fs').writeFileSync(process.argv[1],JSON.stringify(o));console.log('bot passwords: '+(Object.keys(o).join(', ')||'none'))" "$f"
          if [ "$(cat "$f")" != "{}" ]; then npx wrangler secret bulk "$f" -c bot.wrangler.jsonc; fi
          rm -f "$f"
        env:
          ALL: ${{ toJSON(secrets) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A secret upload once left the worker's cron silent (2026-10-07), so the triggers go last.
      - name: Re-arm the cron
        run: npx wrangler triggers deploy -c bot.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Show the bots
        run: curl -s https://miniphim.minomobi.com/_bots/ | head -c 1500
