name: Deploy bismuth (hopper crystals grown brick by brick)

on:
  push:
    branches: ['claude/bismuth-crystal-procgen-g6t0dh']
    paths:
      - 'bismuth/**'
      - 'packages/tilings/**'
      - 'scripts/sync-dataviz.mjs'
      - '.github/workflows/deploy-bismuth.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bismuth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tilings library selftest (exact, closed, covering, golden signatures)
        working-directory: .
        run: node packages/tilings/tilings.selftest.mjs
      - name: Served copies in sync with packages/ (tilings)
        working-directory: .
        run: node scripts/sync-dataviz.mjs --check
      - name: Engine selftest (golden hashes, connectivity, hopper morphology, habits, playground, prism)
        run: node js/crystal.selftest.mjs
      - name: Install wrangler
        run: npm install wrangler
      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the crystal is live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://bismuth.mino.mobi/c/48112 | grep -qi 'bismuth hopper crystal' \
               && curl -fsS 'https://bismuth.mino.mobi/api/health' | grep -q '"ok":true'; then
              echo "✓ bismuth is live"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 4
          done
          echo "⚠️ bismuth didn't respond within 20s — edge propagation may be slow, continuing."
