name: Deploy loop (the ticket graph viewer)

# The publish end of the chain. Everything upstream writes the LEDGER under
# .github/loop/; this deploys the VIEW under loop/, which is generated from it.
#
# Note the asymmetry, which is the point: the ledger is not served, the view is.
# A loop turn cannot put text on the internet by writing a bead — someone (or
# the judge workflow, deliberately) has to run the generator and commit the
# result, and that commit is what lands here.

on:
  push:
    branches: ['claude/loop-graph-ticketing-surface-7qxu7c']
    paths:
      - 'loop/**'
      - '.github/workflows/deploy-loop.yml'
  workflow_dispatch:

concurrency:
  group: deploy-loop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # THE GENERATED FILE MUST MATCH ITS SOURCE. loop/data/graph.json is built
      # from .github/loop/; if someone hand-edited the view, or committed a
      # ledger change without regenerating, the page would show a graph that is
      # not the graph the scheduler is reading. That divergence is invisible
      # from the outside — the page still renders, it is just wrong — so it is
      # checked here rather than trusted.
      - name: The published graph matches the ledger
        run: node scripts/gen-loop-data.mjs --check

      # The firewall, again, on the deploy path. It is cheap and it is the check
      # whose failure mode is a runaway; running it in one place only means
      # trusting that the one place ran.
      - name: Blast radius is still contained
        run: node scripts/loop-blast-radius.mjs --check

      - name: Install wrangler
        working-directory: loop
        run: npm install wrangler

      - name: Deploy worker + assets
        working-directory: loop
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ⭐ GREEN IS NOT PROOF (docs/DEPLOYS.md §4). A deploy that does not bind
      # the custom domain has updated a stray loop.workers.dev and changed
      # nothing a visitor can see. So this probes the live domain, and it is NOT
      # continue-on-error: the domain is attached and a run has bound it, so a
      # failure here now means a real unbinding and must go red.
      #
      # It was continue-on-error for exactly one run. Run 30875224557 created
      # the hostname from the `routes` declaration — DEPLOYS.md §7's
      # dashboard-only rule turns out to cover detaching and moving a domain,
      # not creating a new one on a zone already in the account. Recorded as a
      # finding in the ledger, because the first-run symptoms are misleading:
      # DNS took ~10s to resolve and Cloudflare then served error 1104 for a few
      # minutes while the certificate was issued. That is provisioning, not a
      # binding failure, and only a first deploy sees it.
      - name: Verify the custom domain is bound
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS https://loop.mino.mobi/health | grep -q '"beads"'; then
              echo "✓ loop.mino.mobi is serving the graph"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 5
          done
          echo "::error::loop.mino.mobi did not answer /health after 40s."
          echo "::error::Check the wrangler output above for 'loop.mino.mobi (custom domain)'."
          echo "::error::If it only mentions loop.workers.dev, the domain has been detached."
          exit 1
