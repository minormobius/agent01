name: Loop work (an agent takes one turn on one bead)

# THE CONSUMER. One work order in, one outbox out.
#
#   tick writes .github/loop/work/<bead>.json  ──▶  THIS  ──▶  .github/loop/verdicts/<turn>.json ──▶ loop-judge
#
# The agent here has NO Bash, NO git and NO network tools. That is not caution,
# it is the enforcement: with Bash gone it cannot reach a branch, so the
# containment gate below cannot be bypassed, and it cannot write the ledger, so
# scripts/loop-apply-outbox.mjs stays the only door into the graph. lab-build.yml
# states the principle and it holds here: **prompts leak; tool grants don't.**
#
# What is genuinely new versus the lab factory: the agent is briefed with the
# graph's MEMORY. Every dead-end and finding goes into the prompt before the
# task does. That is the whole reason the graph exists — CLOSED-LOOP.md opens
# with a build that spent several turns working around a fetch failure the
# system had already hit and not recorded, then published the wrong conclusion.

on:
  push:
    branches: ['claude/loop-graph-ticketing-surface-7qxu7c']
    paths:
      - '.github/loop/work/**'
  workflow_dispatch:
    inputs:
      bead:
        description: 'Bead id to work (must already have a work order, or be ready)'
        required: true
        type: string

concurrency:
  # Per bead, so two orders can run in parallel up to maxConcurrentWork — but
  # never two turns on the SAME bead, which would race on its outbox.
  group: loop-work-${{ github.event.inputs.bead || github.sha }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The merge-day guard. A squash merge is one commit containing every work
    # order the branch ever created; without this, merging the loop's branch
    # would re-run every turn it has ever taken, at full model cost, weeks late.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'merge candidate')
    steps:
      - uses: actions/checkout@v4
        with:
          # PERSIST-CREDENTIALS: FALSE IS LOAD-BEARING — do not drop it.
          # actions/checkout stores its token as an http.<host>.extraheader in
          # the local git config, and that header OVERRIDES credentials embedded
          # in a remote URL. So `git remote set-url origin https://x-access-token:$PAT@…`
          # is silently ignored and the push goes out as github-actions[bot],
          # which cannot push here: "Permission to … denied to github-actions[bot]",
          # 403, four retries, dead. The PAT was present the whole time and never
          # used. Turning the persisted header off is what lets the URL's
          # credentials apply.
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Is the loop enabled?
        id: enabled
        run: |
          ENABLED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.github/loop/config.json','utf8')).enabled===true)")
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          [ "$ENABLED" = "true" ] || echo "::notice::The loop is disabled. Nothing to do."

      # WHICH ORDER? On a push, the newest one this commit added — NOT `ls | tail`,
      # which picks arbitrarily and is exactly how the factory nearly rebuilt
      # forty strangers' sites from one squash. `git diff-tree` is empty for a
      # real merge commit, which is why real merges skip harmlessly.
      - name: Select the work order
        id: order
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          if [ -n "${{ github.event.inputs.bead }}" ]; then
            ORDER=".github/loop/work/${{ github.event.inputs.bead }}.json"
          else
            ORDER=$(git diff-tree --no-commit-id --name-only -r HEAD \
              | grep '^\.github/loop/work/.*\.json$' | head -1 || true)
          fi
          if [ -z "$ORDER" ] || [ ! -f "$ORDER" ]; then
            echo "::notice::No work order in this push — nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "order=$ORDER" >> "$GITHUB_OUTPUT"
          echo "bead=$(node -e "console.log(require('./$ORDER').bead)")" >> "$GITHUB_OUTPUT"
          echo "turn=$(node -e "console.log(require('./$ORDER').turn)")" >> "$GITHUB_OUTPUT"
          echo "Working $ORDER"; cat "$ORDER"

      # ── The brief, and the memory that makes it worth having ───────────────
      - name: Compose the brief
        id: brief
        if: steps.order.outputs.found == 'true'
        env:
          BEAD: ${{ steps.order.outputs.bead }}
        run: |
          # THE BRIEF GOES TO A FILE, NOT TO A STEP OUTPUT.
          #
          # It used to be written to $GITHUB_OUTPUT and read back through the
          # env: block, which puts the whole brief in the child process's
          # ENVIRONMENT. The kernel caps argv+env together, and the brief
          # carries vision.md verbatim plus the ticket, the memory and the
          # protocol — so it grew until exec failed outright:
          #
          #   An error occurred trying to start process '/usr/bin/bash' …
          #   Argument list too long
          #
          # The failure is silent in the only way that matters. `Run the agent`
          # is continue-on-error, so the step goes GREEN in zero seconds, the
          # agent never runs, no outbox is written, and the turn is recorded as
          # a real turn that produced nothing. Turns 34 and 35 were spent that
          # way. Nothing was red; the run just stopped producing.
          #
          # A file has no such limit, and the agent reads it on stdin exactly as
          # before. Editing vision.md can no longer break the loop by length.
          {
            echo "You are taking ONE turn on one ticket in an instrumented agent loop."
            echo "Your work is judged and the score is published. Depth beats breadth:"
            echo "one thing that genuinely works beats three that nearly do."
            echo
            echo "=== WHAT THE LOOP ALREADY KNOWS ==="
            echo "These were paid for by earlier turns. Do not rediscover them."
            echo
            node scripts/beads.mjs stats
            echo
            node --input-type=module -e "
              import {readFileSync} from 'node:fs';
              import {parseLedger} from './scripts/lib/beads.mjs';
              const {beads}=parseLedger(readFileSync('.github/loop/beads.jsonl','utf8'));
              for (const b of beads.filter(x=>x.kind==='dead-end')) console.log('DEAD END: '+b.title+'\n  '+b.body.replace(/\n/g,'\n  ')+'\n');
              for (const b of beads.filter(x=>x.kind==='finding')) console.log('FINDING: '+b.title+'\n  '+b.body.replace(/\n/g,'\n  ')+'\n');
              // Decisions the OPERATOR made in answer to an ask. These are the only
              // facts in this brief that came from outside the loop, so they are the
              // only ones no amount of further looping could have produced.
              for (const b of beads.filter(x=>x.kind==='decision'&&x.tags.includes('answer')))
                console.log('THE OPERATOR ANSWERED: '+b.title+'\n  '+b.body.replace(/\n/g,'\n  ')+'\n');
            "
            echo "=== WHAT THE OPERATOR SAYS MATTERS RIGHT NOW ==="
            echo "Asserted, not derived. It outranks what you infer from the repository."
            echo
            cat .github/loop/vision.md
            echo
            echo "=== YOUR TICKET ==="
            node scripts/beads.mjs show "$BEAD"
            echo
            echo "=== HOW TO REPORT ==="
            echo "You have Read/Write/Edit/Glob/Grep and nothing else. No Bash, no network."
            echo "When you are done, write EXACTLY ONE file: .github/loop/outbox/$BEAD.json"
            echo
            echo '{'
            echo '  "bead": "'"$BEAD"'",'
            echo '  "outcome": "done" | "blocked" | "failed",'
            echo '  "summary": "one paragraph: what you actually did, honestly",'
            echo '  "evidence": ["paths you wrote or changed"],'
            echo '  "learned": [{"kind":"finding"|"dead-end"|"decision","title":"…","body":"…"}],'
            echo '  "propose": [{"title":"…","body":"…","priority":2,'
            echo '               "class":"a", "gate":["node plant/test/x.selftest.mjs"],'
            echo '               "createsGate":true }],   // see PROPOSING below'
            echo '  "asks":    [{"title":"…","body":"…","do":"…","watch":"…","soThat":"…"}]'
            echo '}'
            echo
            echo "=== PROPOSING FOLLOW-UP WORK ==="
            echo "A proposal with no CLASS and no GATE cannot be promoted by anyone — it"
            echo "fails the Definition of Ready at R2 and a reviewer will reject it, however"
            echo "good the idea is. That is not hypothetical: every follow-up proposed before"
            echo "this paragraph existed was rejected for exactly that reason, including one"
            echo "that correctly identified the most valuable next thing in the project."
            echo
            echo "So say how it would be CHECKED:"
            echo "  \"class\":\"a\" + \"gate\":[...]        the check already exists — name it"
            echo "  …plus \"createsGate\":true          the check does NOT exist and the work"
            echo "                                     includes building it. Held to MORE:"
            echo "                                     the file must appear, pass, and break"
            echo "                                     nothing that passed before."
            echo "  \"class\":\"d\" and no gate          genuinely exploratory; the output is a"
            echo "                                     finding. NOT dispatchable, by design."
            echo
            echo "A requirement that does not say how you would know it was met is a wish."
            echo "If you cannot name the check, say so in the body — that admission is worth"
            echo "more than a confident ticket nobody can grade."
            echo
            echo "=== DECIDE. DO NOT ASK. ==="
            echo "There is no human on the other end of this turn and there will not be one"
            echo "before it ends. Nobody will answer a question, approve an approach, or"
            echo "unblock you. Review happens later, over your decision log, at a coarser"
            echo "grain than this turn."
            echo
            echo "So when you hit a judgement call — a name, a shape, a trade-off, an"
            echo "ambiguity in the ticket — MAKE THE CALL, record it, and carry on:"
            echo
            echo '  {"kind":"decision","title":"what you chose",'
            echo '   "body":"why, what you rejected, and what would reverse it"}'
            echo
            echo "A decision you recorded is a good turn. A turn that stopped to ask is a"
            echo "wasted one."
            echo
            echo "=== …BUT YOU MAY ASK, BECAUSE ASKING IS NOT WAITING ==="
            echo "There is one class of question no decision of yours can settle: is this"
            echo "FAIR, does it FEEL good, is it the game we want. You cannot test taste"
            echo "and neither can the gate. Guessing is how a loop gets very good at what"
            echo "it can measure and blind to everything else."
            echo
            echo "So put it in \"asks\". Your turn STILL ENDS NOW — the ask blocks nothing,"
            echo "creates no dependency, and you will never see the answer. A later turn"
            echo "reads it as memory. At most 3, and one good one beats three."
            echo
            echo '  {"title":"…","body":"why it is not decidable from here",'
            echo '   "do":"what the human should DO, concrete enough to act on cold",'
            echo '   "watch":"what to pay attention to",'
            echo '   "soThat":"what you will do with EACH answer"}'
            echo
            echo "soThat is the test. If you cannot say what each answer would change,"
            echo "the ask changes nothing and you are spending a person's evening on it."
            echo "Do not file it. Decide instead."
            echo
            echo "Use outcome \"blocked\" ONLY for a genuine technical dependency: a gate that"
            echo "does not exist, a file that is not there, a credential that is absent."
            echo "Never for a judgement you could have made yourself."
            echo
            echo "Rules that are enforced, not requested:"
            echo " - \"done\" REQUIRES evidence. A claim with nothing attached is rejected."
            echo " - Anything you propose is created as a PROPOSAL. You cannot schedule your own work."
            echo " - Write ONLY inside the paths your ticket names, plus your outbox file."
            echo "   A diff outside them fails the containment gate and the whole turn is discarded."
            echo " - If you hit something that does not work, record it as a dead-end. That is"
            echo "   worth as much as finishing — it is what stops turn 30 repeating turn 4."
            echo " - Do not overclaim. If something is approximate or untested, say so in the"
            echo "   summary. The judge reads the artifact, not your description of it."
          } > /tmp/brief.txt
          echo "brief bytes: $(wc -c < /tmp/brief.txt)"

      # THE CONTAINMENT GATE'S PRECONDITION. The gate below attributes every
      # dirty path to the agent, so that verdict is only true if the tree was
      # clean when the agent started. loop-plan learned this the expensive way:
      # its seed step wrote to the ledger, the gate blamed the planner, and a
      # turn's worth of good proposals was deleted on a GREEN run. Nothing in
      # this workflow writes before here today — this keeps it that way.
      - name: The tree is clean before the agent touches it
        if: steps.order.outputs.found == 'true'
        run: |
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::The workflow dirtied the tree before the agent ran."
            echo "::error::The containment gate would attribute this to the agent."
            printf '%s\n' "$DIRTY"
            exit 1
          fi

      - name: Install Claude Code
        if: steps.order.outputs.found == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # A timeout is "stop adding", not "throw it away" — continue-on-error so
      # the gates below still judge whatever landed on disk. The factory learned
      # this the expensive way: eighteen minutes of real work discarded unseen
      # because every later step was guarded by success().
      - name: Run the agent
        id: agent
        if: steps.order.outputs.found == 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # BEAD is read below to check for an outbox. `set -u` is on, so an
          # unset variable here would abort the step — which would look exactly
          # like the agent crashing.
          BEAD: ${{ steps.order.outputs.bead }}
        run: |
          set +e
          set -uo pipefail
          STARTED=$(date +%s)
          claude -p < /tmp/brief.txt \
            --model claude-opus-5 \
            --max-turns 60 \
            --max-budget-usd 5 \
            --permission-mode acceptEdits \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
            --disallowedTools "Bash" "WebFetch" "WebSearch" "Task" "NotebookEdit" \
            --output-format stream-json --verbose | tee /tmp/agent.jsonl
          AGENT_RC=${PIPESTATUS[0]}
          echo "agent_exit=${AGENT_RC}" >> "$GITHUB_OUTPUT"

          # DID THE AGENT ACTUALLY RUN? An empty transcript means it did not,
          # and that must never again look like a turn.
          #
          # continue-on-error is right — a timeout should keep whatever landed on
          # disk — but it also swallows "the process never started". When the
          # brief overflowed the environment, exec failed, this step went green
          # in ZERO SECONDS, and the workflow carried on to record turn 34 and
          # turn 35 as real turns that produced nothing. Budget spent, gauge
          # advanced, nothing red.
          #
          # A turn with an empty transcript is not a failed turn, it is a turn
          # that did not happen, and the two must not be recorded the same way.
          if [ ! -s /tmp/agent.jsonl ]; then
            echo "::error::THE AGENT PRODUCED NO OUTPUT — it did not run."
            echo "::error::Brief was $(wc -c < /tmp/brief.txt 2>/dev/null || echo '?') bytes."
            echo "::error::This is not a failed turn, it is a turn that never started."
            echo "ran=false" >> "$GITHUB_OUTPUT"
          else
            echo "ran=true" >> "$GITHUB_OUTPUT"
          fi

          # WAS THE MODEL REFUSED, OR WAS THE WORK WRONG? These must not be
          # recorded the same way, and until now they were.
          #
          # When the account's usage limit is reached the CLI exits non-zero in
          # about two seconds having emitted an error and nothing else. That is
          # INFRASTRUCTURE, not a verdict on the ticket: turns 47-50 were four
          # such refusals inside two minutes, on two perfectly good beads, and
          # they were written into runs.jsonl as four consecutive gate failures.
          #
          # The consequence was a DEADLOCK, not just noise. repeatedGateFailures
          # halted the loop — correctly, on the evidence it had — and that halt
          # reads the tail of runs.jsonl, which cannot change while the loop is
          # halted. A quota outage lasting an hour therefore stopped the loop
          # permanently, and it stayed stopped for four and a half hours until a
          # human looked.
          #
          # The signature is unambiguous and does not depend on CLI internals: a
          # non-zero exit, in under a minute, having written no outbox. A real
          # turn that fails takes minutes and leaves something behind.
          ELAPSED=$(( $(date +%s) - STARTED ))
          echo "agent ran for ${ELAPSED}s, exit ${AGENT_RC}"
          if [ "$AGENT_RC" != "0" ] && [ "$ELAPSED" -lt 60 ] \
             && [ ! -f ".github/loop/outbox/${BEAD}.json" ]; then
            echo "::warning::MODEL UNAVAILABLE — exit ${AGENT_RC} after ${ELAPSED}s with no outbox."
            echo "::warning::Recording this as infrastructure, NOT as a gate failure, so it cannot"
            echo "::warning::trip the quality brake and deadlock the loop. The heartbeat will retry."
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Gate: containment ──────────────────────────────────────────────────
      # An agent writing outside its directory is a bug, not a trust question
      # (CLOSED-LOOP.md §4 puts this in the "stays on" column, and it stays on
      # precisely because the requester is now us).
      - name: Containment gate
        id: gate
        if: steps.order.outputs.found == 'true'
        run: |
          # plant/, NOT foam/ and NOT loop/. foam is hand-authored and the loop
          # never touches it; loop/ is the monitoring surface and its data file
          # is generated. The agent's whole world is its own tree plus its outbox.
          ALLOWED='^(\.github/loop/(outbox|work)/|plant/)'
          OUT=$(git status --porcelain | awk '{print $NF}' | grep -Ev "$ALLOWED" || true)
          if [ -n "$OUT" ]; then
            echo "::error::The agent wrote outside its allowed paths:"
            printf '%s\n' "$OUT"
            git checkout -- . && git clean -fd
            echo "gate=failed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "gate=passed" >> "$GITHUB_OUTPUT"

      # ── Gate: THE TICKET'S OWN ACCEPTANCE TEST ─────────────────────────────
      # R2 says a class-A requirement names the machine check that decides
      # `done`. This is where that check actually runs — HERE, in the workflow,
      # not inside the turn.
      #
      # The first live turn found the hole itself and filed a finding: an agent
      # granted only Read/Write/Edit/Glob/Grep cannot execute `node …` or
      # `cmp …`, so a ticket whose gate is a shell command was structurally
      # unverifiable by the only party in a position to satisfy it. It marked
      # the bead `done` on an honest belief that it had copied the files
      # correctly, and nothing checked. That is exactly the "done means the
      # agent said so" failure the whole design exists to prevent.
      #
      # Gates come only from human-authored beads: loop-apply-outbox.mjs never
      # copies `gate` onto an agent's proposal, and proposals cannot self-promote.
      - name: Run the ticket's gate
        id: ticketgate
        if: steps.gate.outputs.gate == 'passed'
        run: |
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            import {parseLedger} from './scripts/lib/beads.mjs';
            const {beads}=parseLedger(readFileSync('.github/loop/beads.jsonl','utf8'));
            const b=beads.find(x=>x.id===process.env.BEAD);
            for (const g of (b?.gate ?? [])) console.log(g);
          " > /tmp/gate.txt
          if [ ! -s /tmp/gate.txt ]; then
            echo "::warning::This ticket names no machine gate — 'done' rests on the agent's word."
            echo "ticketgate=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FAILED=0
          while IFS= read -r CMD; do
            [ -z "$CMD" ] && continue
            echo "── gate: $CMD"
            if bash -c "$CMD"; then echo "   ✓ passed"; else echo "   ✗ FAILED"; FAILED=1; fi
          done < /tmp/gate.txt

          # ── A GATE-CREATING TURN IS HELD TO MORE, NOT LESS ──────────────────
          # This is the only kind of bead the fleet may take without a gate that
          # already exists, so it is the one place the loop can expand its own
          # verification surface — and the one place a turn could quietly grade
          # itself against nothing. Two extra demands:
          #
          #   · the gate it promised must EXIST now. Promotion refused this bead
          #     if the file was already there, so its presence is proof the turn
          #     actually built it rather than pointing at something old.
          #   · the WHOLE suite must still pass. A new capability that breaks an
          #     old one is not a new capability.
          #
          # What this still cannot check is whether the new gate ASSERTS
          # anything. A test with no assertions passes exactly as green as a
          # good one. That residue is why promotion prints a warning and why the
          # review seat should read this diff before any other.
          if node -e "
            const {readFileSync}=require('fs');
            const b=readFileSync('.github/loop/beads.jsonl','utf8').split('\n').filter(Boolean)
              .map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean)
              .filter(x=>x.id===process.env.BEAD).pop();
            process.exit((b?.tags??[]).includes('creates-gate')?0:1);
          "; then
            echo "── gate-creating turn: the promised gate must now exist"
            while IFS= read -r CMD; do
              for TOK in $CMD; do
                case "$TOK" in
                  -*) ;;
                  *.mjs|*.js|*.sh)
                    if [ -f "$TOK" ]; then echo "   ✓ $TOK exists"
                    else echo "   ✗ $TOK was promised and does not exist"; FAILED=1; fi ;;
                esac
              done
            done < /tmp/gate.txt
            echo "── and the whole suite must still pass"
            for t in plant/test/*.selftest.mjs; do
              if node "$t" >/dev/null 2>&1; then echo "   ✓ $t"; else echo "   ✗ $t REGRESSED"; FAILED=1; fi
            done
          fi

          if [ "$FAILED" = "1" ]; then
            echo "::error::the ticket's gate failed — the turn did not do what it claimed"
            echo "ticketgate=failed" >> "$GITHUB_OUTPUT"
          else
            echo "ticketgate=passed" >> "$GITHUB_OUTPUT"
          fi
        env:
          BEAD: ${{ steps.order.outputs.bead }}

      # ── Gate: the outbox is valid ──────────────────────────────────────────
      - name: Validate the outbox
        id: outbox
        if: steps.gate.outputs.gate == 'passed'
        env:
          BEAD: ${{ steps.order.outputs.bead }}
        run: |
          FILE=".github/loop/outbox/$BEAD.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::The agent left no outbox at $FILE — the turn cannot be recorded."
            echo "valid=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if node scripts/loop-apply-outbox.mjs --check "$FILE"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      # A failed ticket gate means the claim was wrong, so the ledger must not
      # record `done`. The turn still produced a verdict request, so the judge
      # sees it and the curve keeps an honest failure point.
      - name: Apply the outbox to the ledger
        if: steps.outbox.outputs.valid == 'true' && steps.ticketgate.outputs.ticketgate != 'failed'
        env:
          LOOP_RUN: ${{ steps.order.outputs.turn }}
          LOOP_ACTOR: agent
        run: |
          node scripts/loop-apply-outbox.mjs ".github/loop/outbox/${{ steps.order.outputs.bead }}.json"
          node scripts/gen-loop-data.mjs --write

      # ── The push that wakes loop-judge ─────────────────────────────────────
      # A verdict request is written even when the turn FAILED. A failed turn is
      # a data point on the curve — the whole question is whether more turns
      # help, and silently dropping the bad ones is how you measure a curve that
      # only goes up.
      # A turn that never started gets NO verdict and NO commit, and this step
      # goes red so the chain stops here.
      #
      # Stopping is the point. The turn was already metered at dispatch — the
      # meter belongs at the point of spend and loop-tick writes turns.jsonl
      # when it issues the order, so that cost is sunk either way. What must not
      # happen is the chain carrying on: an exec failure is systemic, the next
      # turn will hit it too, and a self-healing retry here would burn runners
      # in a circle for as long as nobody is watching. CLOSED-LOOP.md §6.2 — a
      # loop that cannot stop IS the failure mode.
      #
      # So: red, loud, and halted, with the cause named in the log. A human
      # restarts it by touching .github/loop/wake once the cause is fixed.
      - name: Refuse to record a turn that never ran
        if: steps.order.outputs.found == 'true' && steps.agent.outputs.ran == 'false'
        run: |
          echo "::error::Turn ${{ steps.order.outputs.turn }} on ${{ steps.order.outputs.bead }} is DISCARDED, not recorded."
          echo "::error::The agent never started — no verdict, no commit, and the chain stops here."
          echo "::error::This is systemic, not a bad ticket: the next turn would fail identically."
          echo "::error::Fix the cause, then touch .github/loop/wake to restart the chain."
          exit 1

      - name: Request a verdict
        if: steps.order.outputs.found == 'true' && steps.agent.outputs.ran != 'false'
        env:
          GH_TOKEN: ${{ secrets.OS_AGENT_GITHUB_TOKEN }}
          TURN: ${{ steps.order.outputs.turn }}
          BEAD: ${{ steps.order.outputs.bead }}
          GATE: ${{ steps.ticketgate.outputs.ticketgate == 'failed' && 'failed' || steps.gate.outputs.gate }}
          OUTBOX_VALID: ${{ steps.outbox.outputs.valid }}
          INFRA: ${{ steps.agent.outputs.infra }}
          AGENT_EXIT: ${{ steps.agent.outputs.agent_exit }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::OS_AGENT_GITHUB_TOKEN is not set — the push would not wake loop-judge."
            exit 1
          fi
          mkdir -p .github/loop/verdicts
          node -e '
            const fs = require("fs");
            fs.writeFileSync(`.github/loop/verdicts/${process.env.TURN}.json`, JSON.stringify({
              turn: Number(process.env.TURN),
              bead: process.env.BEAD,
              gate: process.env.GATE,
              outboxValid: process.env.OUTBOX_VALID === "true",
              agentExit: process.env.AGENT_EXIT ?? null,
    // The model was refused, not the work. loop-tick excludes these from the
    // gate-failure streak so a quota outage cannot deadlock the loop.
    infra: process.env.INFRA === "true",
              at: new Date().toISOString(),
            }, null, 2) + "\n");
          '
          git config user.name  "loop-worker"
          git config user.email "loop@users.noreply.github.com"
          # STAGE THE LOOP'S DECLARED WRITE PATHS, derived from config — never a
          # hardcoded list. This line used to read `git add .github/loop/ loop/`
          # and it silently DISCARDED THE AGENT'S ACTUAL WORK: the first live
          # turn wrote plant/solids.mjs and plant/test/solids.selftest.mjs, they
          # passed the containment gate, and they were never staged, never
          # committed, and lost with the ephemeral runner. Gate passed, outbox
          # valid, exit 0, verdict requested — green all the way down, and the
          # one thing the loop exists to produce was thrown away.
          #
          # Deriving from `writes` means adding a path to the loop's remit can
          # never again forget to add it here.
          # THE ORDER IS CONSUMED, WHATEVER THE OUTCOME. This turn took it; the
          # turn is over; it is no longer in flight.
          #
          # Only the SUCCESS path cleaned up before — loop-apply-outbox.mjs:380
          # deletes the order after applying the outbox, and that step is skipped
          # when there is no valid outbox. So every failed turn left its order on
          # disk, and an order on disk is counted by the tick as committed spend
          # holding a concurrency slot.
          #
          # That is a self-perpetuating stall, not a slow leak. Two failed turns
          # fill maxConcurrentWork, the tick halts at `at concurrency`, and the
          # stale-order reaper that would clear it lives INSIDE the tick — which
          # only runs on a push. Nothing pushes, so nothing ticks, so nothing
          # reaps. Observed: the chain stopped dead behind lp-dca4a5 and
          # lp-f25c2f after both their turns failed to start.
          #
          # The reaper stays as the backstop for a runner that dies mid-turn and
          # never reaches this line at all.
          if [ -f "${{ steps.order.outputs.order }}" ]; then
            rm -f "${{ steps.order.outputs.order }}"
            echo "consumed work order ${{ steps.order.outputs.order }}"
          fi

          STAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.github/loop/config.json','utf8')).writes.map(w=>w.replace(/\/\*\*$/,'')).join(' '))")
          echo "staging: $STAGE"
          git add -- $STAGE

          # REGENERATE WHAT THE AGENT'S WRITES DERIVE INTO, and stage that too.
          #
          # The agent is contained to plant/ — correctly — but plant/CLAUDE.md
          # is an INPUT to a generator that writes outside plant/: build-spec
          # embeds every surface's instruction file into spec/data.js. So a
          # turn that legitimately documents its own work leaves spec/data.js
          # stale, preflight asserts every generated file is current, and the
          # branch goes red for a turn that did nothing wrong. That is what the
          # 13:00 preflight failure was, alongside the tick's graph.json.
          #
          # `--fix --quick` rather than a named list: the containment gate
          # already decided what the AGENT may write, and this runs after it.
          # Naming generators here would be a second list to keep in sync with
          # preflight's, and the failure mode of that list falling behind is
          # exactly the one being fixed.
          node scripts/preflight.mjs --fix --quick >/dev/null 2>&1 || true
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "loop: turn $TURN on $BEAD — awaiting verdict"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            # REDO, DO NOT RESOLVE (LOOP-SPRINTS.md). loop/data/graph.json is
            # DERIVED, so two writers regenerate it from different ledger states
            # and it conflicts on essentially every concurrent push. A bare
            # `pull --rebase` halts there, and then all four retries fail
            # identically — the backoff just makes the loss slower.
            #
            # This is what stalled the five-hour run twice: a seat did real
            # work, applied it, and lost the push to a conflict in a file that
            # is not a source of truth. Regenerating IS the resolution; merging
            # a generated file is never right.
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                node scripts/gen-loop-data.mjs --write || true
                git add -A
                GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              else
                git rebase --abort 2>/dev/null || true
              fi
            fi
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "push failed, retry $attempt"; sleep $((2 ** attempt))
          done
          echo "::error::could not push the turn"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Loop work — turn ${{ steps.order.outputs.turn }}"
            echo ""
            echo "- bead: \`${{ steps.order.outputs.bead }}\`"
            echo "- containment gate: \`${{ steps.gate.outputs.gate || 'skipped' }}\`"
            echo "- outbox valid: \`${{ steps.outbox.outputs.valid || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
