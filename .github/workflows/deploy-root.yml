name: Deploy Root (landing)
# verify run 2: production branch set to main — confirm apex + mino.mobi update

# Explicit deploy for the root Pages project (the landing page + the static
# subsites it bundles + functions/ Pages Functions). Replaces the implicit
# Cloudflare git-integration auto-deploy from main.
#
# Root is a Cloudflare PAGES project (project: agent01) run as DIRECT UPLOAD:
# the Action owns production. `wrangler pages deploy --branch=main` publishes to
# the production slot (apex + the mino.mobi custom domain) and ships functions/
# as Pages Functions. --branch must equal the project's production branch (main).
#
# REQUIREMENT: agent01 must be a Direct Upload project (git integration
# DISCONNECTED). While it's git-connected, CLI deploys land as previews
# (<branch>.agent01.pages.dev) and never seize the custom domain — that was the
# "builds didn't deploy" symptom. Production branch stays `main`.
#
# WHAT GETS PUBLISHED: not the repo — a staged copy of it, built below with the
# .assetsignore exclusions applied by hand. `wrangler pages deploy` does NOT
# honour .assetsignore (that is a Workers Static Assets mechanism, and this is a
# Pages project), which is how 35 agent-built lab pages came to be live on the
# apex. Stage, assert, then deploy.
#
# As static subsites encapsulate into their own surfaces (math, canvas, …),
# remove their dirs from the paths list below so root stops shipping them.

on:
  push:
    branches: ['claude/root-directory-audit-0tk7r7']
    paths:
      - 'index.html'
      - 'styles.css'
      - 'functions/**'
      - 'scripts/generate-search-catalog.mjs'
      # office: the fractal "office of offices" site map served at mino.mobi/office/
      - 'office/**'
      - 'scripts/build-office.mjs'
      # spec: the site-wide technical spec sheet served at mino.mobi/spec/
      - 'spec/**'
      - 'scripts/build-spec.mjs'
      # stats: self-analytics over the git history, served at mino.mobi/stats/
      - 'stats/**'
      - 'scripts/build-git-stats.mjs'
      # catalogue.json is the source of truth for the landing catalogue; var P,
      # search, office, mappa and orrery are all projections of it, so a change
      # here must reach the apex.
      - 'catalogue.json'
      - 'scripts/gen-landing-catalogue.mjs'
      - 'scripts/catalogue-coverage.mjs'
      - 'git-graph.json'
      # the shared reading layer every generator above goes through
      - 'scripts/lib/**'
      # the exclusion list the staging step reads — a change here changes what
      # is published, so it must trigger a redeploy
      - '.assetsignore'
      # geometry-pack page under active development on this branch — keep the
      # canonical mino.mobi/meander/ in sync with edits (also ships via
      # deploy-math to math.mino.mobi). Carve back out once it stabilizes.
      - 'meander/**'
      - 'temperley-lieb/**'
      - 'aztec/**'
      - 'markov/**'
      - 'descent/**'
      - 'traffic/**'
      - 'ising/**'
      - 'packages/audio-react/**'
      - 'packages/music/**'
      # static subsites still bundled under root (carve out as they encapsulate):
      - 'cluster/**'
      - 'density/**'
      - 'echo/**'
      - 'judge/**'
      - 'novelty/**'
      - 'seek/**'
      - 'ternary/**'
      - 'music/**'
      - 'sweat/**'
      - 'noise/**'
      - 'flows/**'
      - 'phylo/**'
      - 'wiki/**'
      # orrery: theme-first surface-map prototype served at mino.mobi/orrery/
      # (reviewable alongside the live homepage; promote into index.html once approved)
      - 'orrery/**'
      - 'scripts/build-orrery.mjs'
      # mappa: the world engine (engine.js + viewer.js + projection.js + sites.js)
      - 'mappa/**'
      - 'scripts/build-mappa.mjs'
      # polis: procedural city-history — mappa's follow-on (substrate → city growth theory)
      - 'polis/**'
      # crucible: the "overgenerate, then judge" page (bundled static subsite)
      - 'crucible/**'
      # hoop-history: the /hoop intellectual-history page (timeline + endpoint census)
      - 'hoop-history/**'
      - '.github/workflows/deploy-root.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Cloudflare Pages project name (overrides ROOT_PAGES_PROJECT var / agent01 default)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve Pages project name
        id: proj
        run: |
          PROJECT="${{ github.event.inputs.project }}"
          [ -z "$PROJECT" ] && PROJECT="${{ vars.ROOT_PAGES_PROJECT }}"
          [ -z "$PROJECT" ] && PROJECT="agent01"
          echo "name=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Deploying Pages project: $PROJECT"

      # Build the tree we actually publish, rather than uploading the repo and
      # hoping an ignore file is honoured.
      #
      # IT WAS NOT. `wrangler pages deploy .` does not apply .assetsignore —
      # that file is a Workers Static Assets mechanism, and root is a Pages
      # project. On 2026-08-15, 35 of 91 lab tenant pages were live on the apex
      # (mino.mobi/lab/www/tzclock/ served 3,118 bytes of real lab content, not
      # the landing fallback). The comment below this step had warned about
      # exactly this; nothing had acted on it because the post-deploy assertion
      # was the only thing checking, and it runs after the upload.
      #
      # So: stage, exclude, assert, THEN deploy. Excludes are read from
      # .assetsignore so there is one list, not two that drift.
      # tar, not rsync: tar is present everywhere, including the agent sandboxes
      # where this logic gets developed and tested before it is trusted here.
      - name: Stage the publishable tree
        run: |
          set -euo pipefail
          rm -rf .deploy-stage && mkdir -p .deploy-stage
          EXCLUDES=(--exclude=./.git --exclude=./.deploy-stage)
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(printf '%s' "$line" | tr -d '[:space:]')"
            [ -z "$line" ] && continue
            EXCLUDES+=(--exclude="./${line%/}")
            echo "excluding ./${line%/}"
          done < .assetsignore
          tar -cf - "${EXCLUDES[@]}" . | tar -xf - -C .deploy-stage
          echo "staged $(find .deploy-stage -type f | wc -l) files"

      # Fail BEFORE the upload, not after it — deterministic, no network needed.
      # Checked BOTH ways on purpose: an absence-only assertion passes happily on
      # an empty directory, which would publish nothing and read as success.
      - name: Assert the staged tree is complete and excludes what it must
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(printf '%s' "$line" | tr -d '[:space:]')"
            [ -z "$line" ] && continue
            if [ -e ".deploy-stage/${line%/}" ]; then
              echo "::error::${line} survived staging and would be published to the apex"
              fail=1
            else
              echo "✓ excluded: ${line}"
            fi
          done < .assetsignore

          # Landmarks: the landing page, a Pages Function, and one file from each
          # generated site map. If staging silently produced a partial tree, this
          # is what catches it.
          for must in index.html catalogue.json functions/search.js spec/data.js \
                      office/surfaces.json stats/index.html stats/data.json; do
            if [ -s ".deploy-stage/$must" ]; then
              echo "✓ present: $must"
            else
              echo "::error::$must is missing or empty in the staged tree"
              fail=1
            fi
          done

          n=$(find .deploy-stage -type f | wc -l)
          if [ "$n" -lt 5000 ]; then
            echo "::error::staged only $n files — the repo has thousands; staging is broken"
            fail=1
          fi
          echo "staged $n files"
          [ "$fail" = 0 ] || exit 1

      - name: Deploy to Cloudflare Pages (production branch)
        # --commit-message is forced to an ASCII string (the SHA). Wrangler would
        # otherwise forward the git HEAD message to the Pages deployments API, which
        # rejects multibyte chars (em-dashes etc.) with a misleading
        # "Invalid commit message, it must be a valid UTF-8 string [8000111]".
        run: npx wrangler pages deploy .deploy-stage --project-name="${{ steps.proj.outputs.name }}" --branch=main --commit-dirty=true --commit-hash="${{ github.sha }}" --commit-message="root deploy ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Agent-built lab tenants must never reach the apex. mino.mobi is inside
      # Domain=.mino.mobi (the shared SSO cookie) and inside the auth worker's
      # wildcard origin allowlist, so a lab page served here could call
      # auth.mino.mobi/pds/* with a signed-in visitor's session and no consent
      # screen. docs/LAB-FACTORY.md sections 2-3.
      #
      # This MUST compare content, never status codes: Pages answers unknown
      # paths with the apex landing page at HTTP 200, so a status check passes
      # whether the exclusion works or not. Root's own index.html is ~200 KB and
      # says "personal tooling"; a leaked lab page is ~4 KB and says
      # "the site factory".
      - name: Assert lab/ is excluded from the apex bundle
        run: |
          set -uo pipefail
          fail=0
          # Every lab page, not a fixed list — a site added later is exactly the
          # one nobody would remember to add here. The needle is each page's own
          # <title> read off disk, so this stays correct as the pages change and
          # cannot pass by matching a string that has since been edited away.
          for f in lab/www/index.html lab/www/*/index.html; do
            [ -f "$f" ] || continue
            needle=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$f" | head -1)
            [ -n "$needle" ] || { echo "::warning::$f has no <title> — cannot assert"; continue; }
            path=${f#lab/www/}; path=${path%index.html}
            body=$(curl -sS --max-time 20 "https://mino.mobi/lab/www/$path" || echo '')
            if printf '%s' "$body" | grep -qF "$needle"; then
              echo "::error::mino.mobi/lab/www/$path is serving lab content — .assetsignore is NOT excluding lab/"
              fail=1
            else
              echo "✓ mino.mobi/lab/www/$path does not serve lab content"
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "::error::A lab page is live on the apex. The staging step above should have"
            echo "::error::made this impossible — check that .assetsignore still lists lab/ and"
            echo "::error::that the stage assertion ran. Do not paper over it here."
            exit 1
          fi
