name: Deploy imp (Imp, measured)

on:
  push:
    branches: ['claude/friends-project-planning-cags5l']
    paths:
      - 'imp/**'
      - '.github/workflows/deploy-imp.yml'
      - 'scripts/route-dns.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install wrangler
      # imp.mino.mobi is a plain route (no custom-domain slot), and a route makes no DNS:
      # without a proxied record the host is dead however green the deploy.
      - name: Ensure DNS for plain routes
        run: node ../scripts/route-dns.mjs wrangler.jsonc --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      - name: Deploy worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A green deploy is not proof, least of all on a route: the check is the HOST answering.
      # Strict — a route surface whose host does not serve is a failed deploy.
      - name: Verify imp.mino.mobi serves (route)
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS https://imp.mino.mobi/ | grep -q "independent evaluation"; then
              echo "✓ imp.mino.mobi is live"; exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 8
          done
          echo "✗ imp.mino.mobi did not serve within ~60s"; exit 1
      # The A/B pairs host: must serve /ab/ with the lab CSP, and imp.mino.mobi/ab/ must send
      # people there rather than run tenant code on the sign-in's site.
      - name: Verify imp.minomobi.com serves /ab/ (route) and imp.mino.mobi does not
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS https://imp.minomobi.com/ab/ | grep -q "Blind pairs"; then ok=1; break; fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 8
          done
          [ -n "${ok:-}" ] || { echo "✗ imp.minomobi.com/ab/ did not serve within ~60s"; exit 1; }
          curl -sSI https://imp.minomobi.com/ab/ | grep -qi "^content-security-policy: default-src 'none'" \
            || { echo "✗ /ab/ is served without the lab CSP"; exit 1; }
          loc=$(curl -sSI https://imp.mino.mobi/ab/ | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          [ "$loc" = "https://imp.minomobi.com/ab/" ] || { echo "✗ imp.mino.mobi/ab/ does not redirect off-site (got '$loc')"; exit 1; }
          echo "✓ imp.minomobi.com/ab/ serves with the lab CSP; imp.mino.mobi/ab/ redirects there"
      # The ballot: the page serves, and the API answers (signed out) through the auth binding.
      - name: Verify the ballot (imp.mino.mobi/vote/ and /api/ballot/me)
        run: |
          curl -fsS https://imp.mino.mobi/vote/ | grep -q "Blind Ballot" || { echo "✗ /vote/ does not serve"; exit 1; }
          me=$(curl -fsS https://imp.mino.mobi/api/ballot/me) || { echo "✗ /api/ballot/me failed"; exit 1; }
          echo "$me" | grep -q '"signedIn":false' || { echo "✗ unexpected /api/ballot/me: $me"; exit 1; }
          r=$(curl -fsS "https://imp.mino.mobi/api/ballot/results?run=ab-01")
          echo "$r" | grep -q '"run":"ab-01"' || { echo "✗ /api/ballot/results: $r"; exit 1; }
          echo "✓ ballot page and API answer"
