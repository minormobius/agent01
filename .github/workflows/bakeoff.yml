name: Bake-off (harness × model)

# Run one brief through every (harness, model) cell in bakeoff/cells.json, score
# each entry against the same rubric, and collect the results into a comparison.
#
# WHY ACTIONS AND NOT THE CONTAINER. The os-api container is one instance per
# DID, so cells there run one at a time and depend on the Cloudflare Containers
# entitlement being live. Here every cell is its own runner: they run in
# parallel, from an identical clean checkout, with no shared state that one cell
# could leak into another's. That isolation is what makes the comparison mean
# anything. The container remains the interactive surface for the same cells —
# `agent --harness=opencode ds4-flash` — and os/api/container/agent.sh is the
# same abstraction.
#
# MANUAL ONLY. This spends real tokens on every configured provider, so it never
# fires on push. Nothing here deploys: entries are artifacts and a results
# branch, and staging them to os.mino.mobi/arena/ is a separate human step
# (`node bakeoff/report.mjs <run> --publish` on the os branch).
#
# Cells whose provider key is missing from repo secrets are SKIPPED with a
# notice, not failed — see bakeoff/run-cell.sh.

on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'Brief to run (directory under bakeoff/briefs/)'
        required: false
        default: 'inpac-gravity'
      run_id:
        description: 'Label for this run (used as the results directory name)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Establish the control BEFORE spending a token. If the shipped code no longer
  # fails the rubric, the rubric is broken and the whole run is meaningless —
  # better to find that out in 20 seconds than after six agents have finished.
  baseline:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.id.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: id
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then RUN_ID="$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}"; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run id: $RUN_ID"

      - name: Score the shipped code (the control)
        run: node bakeoff/briefs/${{ inputs.brief || 'inpac-gravity' }}/baseline.mjs

  cell:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode]
        model: [kimi3, ds4-flash, ds4-pro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install harness
        run: |
          set -euo pipefail
          case "${{ matrix.harness }}" in
            claude)   npm install -g @anthropic-ai/claude-code ;;
            opencode) npm install -g opencode-ai ;;
          esac

      - name: Configure git identity
        run: |
          git config user.name "mino bakeoff"
          git config user.email "bakeoff@mino.mobi"

      - name: Run cell
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BAKEOFF_OUT: ${{ github.workspace }}/cellout/${{ matrix.harness }}__${{ matrix.model }}
        run: bakeoff/run-cell.sh "${{ matrix.harness }}" "${{ matrix.model }}" "${{ inputs.brief || 'inpac-gravity' }}"

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          OUT="${{ github.workspace }}/cellout/${{ matrix.harness }}__${{ matrix.model }}"
          if [ -f "$OUT/cell.json" ]; then
            node -e '
              const r = require(process.argv[1]);
              const lines = [`### ${r.harness} × ${r.model}`, ""];
              if (r.status !== "ran") { lines.push(`Skipped: ${r.reason}`); }
              else {
                lines.push(`**${r.score}/${r.maxScore}** · agent exit ${r.agentExit} · ${r.seconds}s`, "");
                for (const [k, v] of Object.entries(r.checks || {})) {
                  lines.push(`- ${v.passed ? "✓" : "✗"} \x60${k}\x60 — ${v.detail || ""}`);
                }
                if (r.error) lines.push("", `> ${r.error}`);
              }
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            ' "$OUT/cell.json"
          else
            echo "### ${{ matrix.harness }} × ${{ matrix.model }}: no cell.json produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-${{ matrix.harness }}-${{ matrix.model }}
          path: ${{ github.workspace }}/cellout/${{ matrix.harness }}__${{ matrix.model }}
          retention-days: 14
          if-no-files-found: warn

  collect:
    needs: [baseline, cell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/cells
          pattern: cell-*
          merge-multiple: false

      - name: Build the comparison
        run: |
          set -euo pipefail
          RUN_ID="${{ needs.baseline.outputs.run_id }}"
          # download-artifact nests each artifact under its own name; run-cell
          # already wrote one cell.json per directory, which is all report.mjs
          # needs, so the artifact directory IS the --from directory.
          node bakeoff/report.mjs "$RUN_ID" --from "${{ github.workspace }}/cells"
          {
            echo "## Bake-off \`$RUN_ID\`"
            echo
            cat "bakeoff/results/$RUN_ID/report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push results to a results branch
        run: |
          set -euo pipefail
          RUN_ID="${{ needs.baseline.outputs.run_id }}"
          git config user.name "mino bakeoff"
          git config user.email "bakeoff@mino.mobi"
          BRANCH="bakeoff/$RUN_ID"
          git checkout -b "$BRANCH"
          git add bakeoff/results
          if git diff --cached --quiet; then
            echo "no results to commit"
            exit 0
          fi
          git commit -m "bakeoff: results for $RUN_ID"
          # No deploy workflow matches bakeoff/**, so this publishes nothing.
          # Staging entries to the arena is a deliberate step on the os branch.
          for i in 1 2 3 4; do
            if git push -u origin "$BRANCH"; then exit 0; fi
            echo "push failed, retrying in $((2 ** i))s"
            sleep $((2 ** i))
          done
          echo "::error::could not push $BRANCH after 4 attempts"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bakeoff-report
          path: bakeoff/results
          retention-days: 90
