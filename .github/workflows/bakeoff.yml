name: Bake-off (harness × model)

# Run one brief through every (harness, model) cell in bakeoff/cells.json, score
# each entry against the same rubric, and collect the results into a comparison.
#
# WHY ACTIONS AND NOT THE CONTAINER. The os-api container is one instance per
# DID, so cells there run one at a time and depend on the Cloudflare Containers
# entitlement being live. Here every cell is its own runner: they run in
# parallel, from an identical clean checkout, with no shared state that one cell
# could leak into another's. That isolation is what makes the comparison mean
# anything. The container remains the interactive surface for the same cells —
# `agent --harness=opencode ds4-flash` — and os/api/container/agent.sh is the
# same abstraction.
#
# MANUAL ONLY. This spends real tokens on every configured provider, so it never
# fires on push. Nothing here deploys: entries are artifacts and a results
# branch, and staging them to os.mino.mobi/arena/ is a separate human step
# (`node bakeoff/report.mjs <run> --publish` on the os branch).
#
# Cells whose provider key is missing from repo secrets are SKIPPED with a
# notice, not failed — see bakeoff/run-cell.sh.

on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'Brief to run (directory under bakeoff/briefs/)'
        required: false
        default: 'inpac-race'
      run_id:
        description: 'Label for this run (used as the results directory name)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Establish the control BEFORE spending a token. If the shipped code no longer
  # fails the rubric, the rubric is broken and the whole run is meaningless —
  # better to find that out in 20 seconds than after six agents have finished.
  baseline:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.id.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: id
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then RUN_ID="$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}"; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run id: $RUN_ID"

      # Which provider keys does this repo actually have? Reports PRESENCE ONLY,
      # never a value or a prefix. Runs before a single token is spent, because
      # "the run finished and every DeepSeek cell skipped" is an expensive way
      # to discover a secret is named something else.
      - name: Which provider keys are visible?
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_KEY: ${{ secrets.MOONSHOT_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          set -uo pipefail
          echo "### Provider keys visible to this run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          FOUND_DS=0; FOUND_MS=0
          for n in DEEPSEEK_API_KEY DEEPSEEK_KEY DS_API_KEY DEEPSEEK; do
            if [ -n "${!n:-}" ]; then echo "- \`$n\` — **set**" >> "$GITHUB_STEP_SUMMARY"; FOUND_DS=1;
            else echo "- \`$n\` — not set" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          for n in MOONSHOT_API_KEY MOONSHOT_KEY KIMI_API_KEY; do
            if [ -n "${!n:-}" ]; then echo "- \`$n\` — **set**" >> "$GITHUB_STEP_SUMMARY"; FOUND_MS=1;
            else echo "- \`$n\` — not set" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          [ "$FOUND_DS" = 1 ] || echo "::warning::no DeepSeek key under any accepted name — the 6 ds4-* runs will skip. Add a repository SECRET (not a variable) named DEEPSEEK_API_KEY."
          [ "$FOUND_MS" = 1 ] || echo "::warning::no Moonshot key under any accepted name — the 4 kimi3 runs will skip."
          echo "deepseek key present: $FOUND_DS · moonshot key present: $FOUND_MS"

      - name: Sanity-check the rig against the shipped game (the control)
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          npx playwright install --with-deps chromium
          # The shipped game must FAIL this brief's gate. If it passes, the rig
          # has stopped measuring and every entry below would be scored against
          # nothing. Cheaper to find out here than after twelve agent runs.
          node bakeoff/briefs/${{ inputs.brief || 'inpac-race' }}/score.mjs clock/inpac --json > /tmp/control.json || true
          node -e '
            const r = require("/tmp/control.json");
            const failed = Object.entries(r.gate.checks).filter(([, c]) => !c.passed).map(([k]) => k);
            console.log(`control gate: ${r.gate.passed ? "PASS" : "FAIL"} (failing: ${failed.join(", ") || "none"})`);
            console.log(`control primitives: ${r.skeleton.passed}/${r.skeleton.of}`);
            if (r.gate.passed) {
              console.error("::error::the shipped game PASSES this brief\u0027s gate — the rubric is not measuring the task");
              process.exit(1);
            }
          '

  cell:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode]
        model: [kimi3, ds4-flash, ds4-pro]
        # Taste has high run-to-run variance: the spread WITHIN one model can
        # exceed the gap between models, so a single draw cannot tell you which
        # you are looking at. Two independent runs per cell = 12 jobs.
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install harness
        run: |
          set -euo pipefail
          case "${{ matrix.harness }}" in
            claude)   npm install -g @anthropic-ai/claude-code ;;
            opencode) npm install -g opencode-ai ;;
          esac

      - name: Install browser (the gate boots each entry for real)
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          npx playwright install --with-deps chromium

      - name: Configure git identity
        run: |
          git config user.name "mino bakeoff"
          git config user.email "bakeoff@mino.mobi"

      - name: Run cell
        env:
          # ACCEPT NAME VARIANTS. The workflow reads one env name, but a key can
          # reasonably have been stored under any of these. Resolving here means
          # a near-miss on the secret name costs a rename, not a whole run.
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.MOONSHOT_KEY || secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DS_API_KEY || secrets.DEEPSEEK }}
          BAKEOFF_OUT: ${{ github.workspace }}/cellout/${{ matrix.harness }}__${{ matrix.model }}__s${{ matrix.sample }}
        run: bakeoff/run-cell.sh "${{ matrix.harness }}" "${{ matrix.model }}" "${{ inputs.brief || 'inpac-race' }}" "${{ matrix.sample }}"

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          OUT="${{ github.workspace }}/cellout/${{ matrix.harness }}__${{ matrix.model }}__s${{ matrix.sample }}"
          if [ -f "$OUT/cell.json" ]; then
            node -e '
              const r = require(process.argv[1]);
              const lines = [`### ${r.harness} × ${r.model} · run ${r.sample}`, ""];
              if (r.status !== "ran") { lines.push(`Skipped: ${r.reason}`); }
              else if (r.gate) {
                lines.push(`gate **${r.gate.passed ? "PASS" : "FAIL"}** · primitives ${r.skeleton?.passed}/${r.skeleton?.of} · agent exit ${r.agentExit} · ${r.seconds}s`, "");
                for (const [k, v] of Object.entries(r.gate.checks || {})) {
                  lines.push(`- ${v.passed ? "✓" : "✗"} \x60${k}\x60 — ${v.detail || ""}`);
                }
                for (const [k, v] of Object.entries(r.skeleton?.checks || {})) {
                  lines.push(`- ${v.passed ? "✓" : "✗"} \x60${k}\x60 — ${v.detail || ""}`);
                }
                if (r.error) lines.push("", `> ${r.error}`);
              } else {
                lines.push(`**${r.score}/${r.maxScore}** · agent exit ${r.agentExit} · ${r.seconds}s`);
              }
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            ' "$OUT/cell.json"
          else
            echo "### ${{ matrix.harness }} × ${{ matrix.model }}: no cell.json produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-${{ matrix.harness }}-${{ matrix.model }}-s${{ matrix.sample }}
          path: ${{ github.workspace }}/cellout/${{ matrix.harness }}__${{ matrix.model }}__s${{ matrix.sample }}
          retention-days: 14
          if-no-files-found: warn

  collect:
    needs: [baseline, cell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/cells
          pattern: cell-*
          merge-multiple: false

      - name: Judge panel (anonymised second opinion)
        continue-on-error: true
        env:
          # ACCEPT NAME VARIANTS. The workflow reads one env name, but a key can
          # reasonably have been stored under any of these. Resolving here means
          # a near-miss on the secret name costs a rename, not a whole run.
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.MOONSHOT_KEY || secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DS_API_KEY || secrets.DEEPSEEK }}
        run: |
          set -euo pipefail
          # Advisory only: the human ranks the entries. If the panel fails or a
          # provider is down, the comparison is still complete and useful, so
          # this must never take the run down with it.
          node bakeoff/judge.mjs --from "${{ github.workspace }}/cells" --out "${{ github.workspace }}/cells" || \
            echo "::warning::judge panel did not complete — report will omit it"

      - name: Build the comparison
        run: |
          set -euo pipefail
          RUN_ID="${{ needs.baseline.outputs.run_id }}"
          # download-artifact nests each artifact under its own name; run-cell
          # already wrote one cell.json per directory, which is all report.mjs
          # needs, so the artifact directory IS the --from directory.
          node bakeoff/report.mjs "$RUN_ID" --from "${{ github.workspace }}/cells"
          {
            echo "## Bake-off \`$RUN_ID\`"
            echo
            cat "bakeoff/results/$RUN_ID/report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push results to a results branch
        run: |
          set -euo pipefail
          RUN_ID="${{ needs.baseline.outputs.run_id }}"
          git config user.name "mino bakeoff"
          git config user.email "bakeoff@mino.mobi"
          BRANCH="bakeoff/$RUN_ID"
          git checkout -b "$BRANCH"
          git add bakeoff/results
          if git diff --cached --quiet; then
            echo "no results to commit"
            exit 0
          fi
          git commit -m "bakeoff: results for $RUN_ID"
          # No deploy workflow matches bakeoff/**, so this publishes nothing.
          # Staging entries to the arena is a deliberate step on the os branch.
          for i in 1 2 3 4; do
            if git push -u origin "$BRANCH"; then exit 0; fi
            echo "push failed, retrying in $((2 ** i))s"
            sleep $((2 ** i))
          done
          echo "::error::could not push $BRANCH after 4 attempts"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bakeoff-report
          path: bakeoff/results
          retention-days: 90
