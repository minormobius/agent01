name: Deploy cad (feature-tree CAD engine)

on:
  push:
    branches: ['claude/browser-cad-ideation-ollmd3']
    paths:
      - 'packages/cad/**'
      - '.github/workflows/deploy-cad.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # cad.wasm is committed (engine/build.sh produces it) because the deploy
      # is a plain static push and there is no Rust toolchain in this job. The
      # ABI is hand-written, so the one thing worth checking before shipping is
      # that the committed artefact and the JS that talks to it still agree.
      - name: Selftest the committed wasm
        working-directory: packages/cad
        run: node cad.selftest.mjs

      - name: Install wrangler
        run: npm install wrangler

      - name: Deploy worker + assets
        working-directory: packages/cad
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://cad.mino.mobi/ | grep -qi 'feature-tree CAD engine'; then
              echo "✓ cad is live"
              curl -fsSI https://cad.mino.mobi/cad.wasm | grep -i 'content-type' || true
              exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 5
          done
          echo "⚠️ cad.mino.mobi didn't answer. This is a NEW hostname, so on the"
          echo "   first deploy check the log above for 'cad.mino.mobi (custom domain)'."
          echo "   Green alone is not proof (docs/DEPLOYS.md §4)."
