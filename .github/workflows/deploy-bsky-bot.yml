name: Deploy bsky-bot (the lab factory's outer loop)

# The bot that turns a Bluesky mention into a build. Headless worker, cron-driven,
# no custom domain. See docs/LAB-FACTORY.md sections 10 and 7 (phase 3).
#
# SELF-PROVISIONING, deploy-os-api.yml pattern: every run deploys and then syncs
# secrets from GitHub, so a fresh clone plus the GH secrets is a working bot.
#
# HUMAN PREREQS the workflow cannot do (one-time):
#   - create the Bluesky account and give it the minomobi.com handle
#     (ordering matters — see lab/www/CLAUDE.md)
#   - mint the Bluesky app password for the service account
#   - mint a fine-grained PAT with contents:write on this repo only
#   - set WHITELIST in wrangler.toml — it is FAIL-CLOSED and empty ships a bot
#     that ignores everyone, which is the correct default
#
# BOT_ENABLED stays "false" until the routing has been watched in a real thread.
# With it off the bot still reads, routes, claims and replies — it just cannot
# dispatch, so it cannot spend.

on:
  push:
    branches: ['claude/minomobi-landing-page-vg37b8']
    paths:
      - 'workers/bsky-bot/**'
      - '.github/workflows/deploy-bsky-bot.yml'
  workflow_dispatch:

concurrency:
  group: deploy-bsky-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/bsky-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # The router is the whole point of this worker; a type error here is a
      # mention silently dropped at 3am. Cheap to check, so check.
      - name: Typecheck
        run: npx tsc --noEmit

      # Prove wrangler resolved THIS config before anything reaches production.
      # A dry-run costs seconds and fails on the runner rather than in the
      # account. See the Deploy step for what this is guarding against.
      - name: Verify the config wrangler resolves
        run: |
          set -euo pipefail
          OUT=$(npx wrangler deploy -c wrangler.toml --dry-run --outdir /tmp/dry 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q 'env.REGISTRY' || {
            echo "::error::resolved config has no REGISTRY binding — wrangler loaded the wrong wrangler config"
            exit 1; }

      # -c is LOAD-BEARING, not decoration. Without it wrangler 4.114 does not
      # read workers/bsky-bot/wrangler.toml at all — it loads the ROOT
      # wrangler.jsonc. Reproduced locally, and confirmed by putting deliberately
      # invalid TOML in the local file: no parse error, it simply used the root
      # config. Both of this workflow's runs died on "Asset too large", because
      # the root config serves assets from the repo root and this worker's own
      # node_modules carries a 122 MiB workerd binary.
      #
      # That error is the lucky outcome. Without the oversized file the run goes
      # GREEN while deploying the ROOT worker — the golden rule's failure mode
      # arriving from a direction the golden rule doesn't mention: not a wrong
      # `name` in the right config, but the right name in the wrong config.
      # deploy-os-api, -audio, -feed, -fred-proxy and -duffel-proxy all pass -c
      # for this reason. This one didn't inherit it.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.toml

      - name: Sync secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLUESKY_BOT_HANDLE: ${{ secrets.BLUESKY_BOT_HANDLE }}
          BLUESKY_BOT_APP_PASSWORD: ${{ secrets.BLUESKY_BOT_APP_PASSWORD }}
          LAB_DISPATCH_TOKEN: ${{ secrets.LAB_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          # -c here too: without it these land on whichever worker wrangler
          # resolves, which is not this one.
          put() {
            if [ -n "${2:-}" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1" -c wrangler.toml && echo "✓ $1 synced"
            else
              echo "::warning::GH secret for $1 is unset — the bot cannot ${3}"
            fi
          }
          put BLUESKY_HANDLE       "${BLUESKY_BOT_HANDLE:-}"       "log in"
          put BLUESKY_APP_PASSWORD "${BLUESKY_BOT_APP_PASSWORD:-}" "log in"
          put GITHUB_TOKEN         "${LAB_DISPATCH_TOKEN:-}"       "commit build requests"

      - name: Report the interlock state
        run: |
          ENABLED=$(grep -E '^BOT_ENABLED' wrangler.toml | head -1)
          LIST=$(grep -E '^WHITELIST' wrangler.toml | head -1)
          {
            echo "### bsky-bot deployed"
            echo
            echo "- \`$ENABLED\` — anything but \`\"true\"\` is observe-and-reply, no dispatch"
            echo "- \`$LIST\` — empty is fail-closed: the bot ignores everyone"
          } >> "$GITHUB_STEP_SUMMARY"
