name: Secrets doctor

# Which provider keys can this repo's workflows actually see?
#
# WHY THIS EXISTS AS ITS OWN WORKFLOW. The expensive workflows (bake-off,
# deploy-os-api) are dispatch-only or deploy real infrastructure, and this
# session cannot dispatch anything — the GitHub App token gets
# `403 Resource not accessible by integration` on workflow_dispatch. A push,
# though, does fire a workflow. So the diagnostic lives here, triggered by a
# push that touches only this file: it spends no tokens, deploys nothing,
# builds nothing, and finishes in seconds.
#
# IT NEVER PRINTS A SECRET. Not the value, not a prefix, not a length — length
# alone distinguishes key formats and narrows a brute force. Only "set" or
# "not set", which is the entire question being asked.
#
# The name variants below are what the bake-off and deploy workflows accept, so
# a "set" here means those workflows will find it too.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/secrets-doctor.yml'

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Report which provider keys resolve
        env:
          # DeepSeek — ds4-flash + ds4-pro
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          # Moonshot — kimi3
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_KEY: ${{ secrets.MOONSHOT_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          # Supporting secrets the platform already relies on
          OS_AGENT_GITHUB_TOKEN: ${{ secrets.OS_AGENT_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail

          report () {  # report <provider-label> <accepted names...>
            local label="$1"; shift
            local found=""
            {
              echo ""
              echo "**$label**"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            for n in "$@"; do
              if [ -n "${!n:-}" ]; then
                echo "- \`$n\` — ✅ **set**" >> "$GITHUB_STEP_SUMMARY"
                echo "  $n: SET"
                [ -z "$found" ] && found="$n"
              else
                echo "- \`$n\` — not set" >> "$GITHUB_STEP_SUMMARY"
                echo "  $n: not set"
              fi
            done
            if [ -n "$found" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "→ resolves from \`$found\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            printf '%s' "$found"
          }

          echo "## Provider keys visible to GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Presence only — no values, prefixes or lengths are printed." >> "$GITHUB_STEP_SUMMARY"

          echo "DeepSeek (ds4-flash, ds4-pro):"
          DS=$(report "DeepSeek — \`ds4-flash\`, \`ds4-pro\` (6 of 12 bake-off runs)" \
                 DEEPSEEK_API_KEY DEEPSEEK_KEY DS_API_KEY DEEPSEEK DEEPSEEK_TOKEN)

          echo "Moonshot (kimi3):"
          MS=$(report "Moonshot — \`kimi3\` (4 of 12 bake-off runs)" \
                 MOONSHOT_API_KEY MOONSHOT_KEY KIMI_API_KEY)

          echo "Supporting:"
          report "Supporting" OS_AGENT_GITHUB_TOKEN CLOUDFLARE_API_TOKEN > /dev/null

          {
            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$DS" ]; then
            {
              echo "### ❌ No DeepSeek key under any accepted name"
              echo ""
              echo "The six \`ds4-*\` bake-off runs will skip. Two things that look exactly like this:"
              echo ""
              echo "1. **It's a variable, not a secret.** Settings → Secrets and variables → Actions has two tabs."
              echo "   \`secrets.X\` cannot read the **Variables** tab — it comes back empty with no error."
              echo "2. **It's scoped to an Environment.** Environment secrets are invisible to jobs that don't"
              echo "   declare \`environment:\`, and none of these workflows do."
              echo ""
              echo "Fix: add a **repository secret** named \`DEEPSEEK_API_KEY\` (Secrets tab, \"New repository secret\")."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No DeepSeek key found under any accepted name — the 6 ds4-* bake-off runs would skip"
          else
            echo "### ✅ DeepSeek key found (\`$DS\`) — the \`ds4-*\` runs will execute" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$MS" ]; then
            echo "### ❌ No Moonshot key — the 4 \`kimi3\` runs will skip" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No Moonshot key found under any accepted name"
          else
            echo "### ✅ Moonshot key found (\`$MS\`) — the \`kimi3\` runs will execute" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo ""
          echo "deepseek=${DS:-none} moonshot=${MS:-none}"
