name: Deploy jev (Jev delves the foam dungeon)

on:
  push:
    branches: ['claude/jev-demo-website-pw3us1']
    paths:
      - 'jev/**'
      - '.github/workflows/deploy-jev.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jev
    # Mapped to env at the job level because step-level `if:` cannot read the
    # `secrets` context — only `env`. GitHub still masks the value in logs.
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Both selftests run offline against the bundled fixtures — no API key,
      # no network. They gate the deploy on purpose: the question shapes are
      # the contract with TypeSafe, and the worker test is what proves the
      # secret cannot come back out of the proxy.
      - name: Delve selftest (question shapes, gate, a full run)
        run: node test/delve.selftest.mjs
      - name: Worker selftest (the proxy never leaks the key)
        run: node test/worker.selftest.mjs

      - name: Install wrangler
        run: npm install wrangler

      # Capture the deploy output so the verify step can check the URL that
      # was ACTUALLY served, rather than a hostname we assumed.
      - name: Deploy worker + assets
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if grep -q 'custom domain' deploy.log; then
            url="https://jev.mino.mobi"
            echo "bound the custom domain"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Serving at: $url"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Push the TypeSafe key as a worker secret. Skipped (not failed) when the
      # repo secret is unset — the site still deploys and says, on the page,
      # that it is running the offline stand-in rather than pretending.
      - name: Sync the TypeSafe API key
        if: ${{ env.TYPESAFE_API_KEY != '' }}
        run: printf '%s' "$TYPESAFE_API_KEY" | npx wrangler secret put TYPESAFE_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report whether the key is configured
        if: ${{ env.TYPESAFE_API_KEY == '' }}
        run: |
          echo "::notice::TYPESAFE_API_KEY is not set on this repo, so jev.mino.mobi will run its offline stand-in."
          echo "Set it in Settings -> Secrets -> Actions, or run: wrangler secret put TYPESAFE_API_KEY"

      - name: Verify the site is live
        continue-on-error: true
        run: |
          url="${{ steps.deploy.outputs.url }}"
          if [ -z "$url" ]; then
            echo "⚠️ the deploy printed no URL — check the log above"; exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$url/" | grep -qi 'foam dungeon'; then
              echo "✓ live at $url"
              echo "  /api/health: $(curl -fsS "$url/api/health" || echo unreachable)"
              exit 0
            fi
            echo "  attempt $attempt: not yet, sleeping…"; sleep 5
          done
          echo "⚠️ $url didn't respond within ~25s. A first deploy (or a newly bound custom domain) can take a few minutes to propagate."

      # jev.mino.mobi is NOT bound: the mino.mobi zone is at Cloudflare's hard
      # limit of 100 Workers custom domains. See the long note in
      # jev/wrangler.jsonc for what to do about it.
      - name: Note the custom-domain situation
        run: |
          echo "::notice::jev ships to workers.dev because zone mino.mobi is at the 100 custom-domain limit. Free a slot, then restore the routes[] block in jev/wrangler.jsonc."
