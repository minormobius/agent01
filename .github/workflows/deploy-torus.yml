name: Deploy torus (toroidal games)

# torus.mino.mobi — the toroidal game family carved out of the deprecated `clock`
# surface. ADDITIVE: stages the 7 game dirs from clock/ into torus/dist at build
# time (sources NOT moved); the gallery (g.mino.mobi) and clock still serve them.

on:
  push:
    branches: ['claude/fractal-torus-webgpu-97gxv4']
    paths:
      - 'clock/corn/**'
      - 'clock/emsim/**'
      - 'clock/inpac/**'
      - 'clock/knotpac/**'
      - 'clock/pac/**'
      - 'clock/torpac/**'
      - 'clock/toruschess/**'
      - 'torus/**'
      - '.github/workflows/deploy-torus.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage toroidal games into dist/
        working-directory: torus
        run: |
          rm -rf dist && mkdir -p dist
          cp index.html dist/
          for d in corn emsim inpac knotpac pac torpac toruschess; do
            mkdir -p "dist/$d"
            cp -r "../clock/$d/." "dist/$d/"
          done
          # Sites that live in torus/ itself rather than being staged from clock/.
          for d in fortress; do
            mkdir -p "dist/$d"
            cp -r "./$d/." "dist/$d/"
          done
          # Workers Static Assets replaces the whole manifest rather than
          # merging, so a missing dir here silently unpublishes a live site.
          for d in corn emsim inpac knotpac pac torpac toruschess fortress; do
            test -f "dist/$d/index.html" || { echo "MISSING dist/$d/index.html"; exit 1; }
          done
          ls -la dist/

      - name: Deploy to Cloudflare
        working-directory: torus
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
