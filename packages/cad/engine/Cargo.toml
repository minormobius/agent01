[package]
name = "cad-engine"
version = "0.1.0"
edition = "2021"
description = "Parametric feature-tree CAD engine for cad.mino.mobi. Tree in, geometry out. Rust end to end."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cad"
path = "src/bin/cad.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
truck-modeling = "0.6"
truck-meshalgo = { version = "0.4", default-features = false, features = ["analyzers", "filters", "tessellation"] }
truck-stepio = { version = "0.3", default-features = false }
truck-shapeops = "0.4"
truck-topology = "0.6"
truck-polymesh = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
default = []
# STEP *reading* (ruststep parser) — native only; the WASM build stays without it.
stepin = ["truck-stepio/in"]
