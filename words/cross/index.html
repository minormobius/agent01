<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>cross — procedurally generated crosswords</title>
<meta name="description" content="Crosswords generated from a seed. Every puzzle is a permalink, nothing is stored, and the same link is the same puzzle for everybody who opens it.">
<meta name="theme-color" content="#16181c">
<meta property="og:title" content="cross">
<meta property="og:description" content="Procedurally generated crosswords. Deterministic from a seed — the link is the puzzle.">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="appbar">
  <div class="tabs" role="tablist" aria-label="View">
    <button class="tab" id="tabPuzzleBtn" role="tab" aria-selected="true" aria-controls="panePuzzle" type="button">Puzzle</button>
    <button class="tab" id="tabListBtn" role="tab" aria-selected="false" aria-controls="paneList" type="button">Clues</button>
  </div>
  <span class="timer" id="timer">0:00</span>
  <button class="gear" id="settingsBtn" type="button" aria-label="Settings and controls" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
      <path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
      <path fill="currentColor" d="m19.4 13-.1-1 .1-1 1.7-1.3a.7.7 0 0 0 .2-.9l-1.7-2.8a.7.7 0 0 0-.8-.3l-2 .8a7.5 7.5 0 0 0-1.7-1l-.3-2.1a.7.7 0 0 0-.7-.6h-3.3a.7.7 0 0 0-.7.6l-.3 2.1c-.6.3-1.2.6-1.7 1l-2-.8a.7.7 0 0 0-.8.3L2.7 8.8a.7.7 0 0 0 .2.9L4.6 11l-.1 1 .1 1-1.7 1.3a.7.7 0 0 0-.2.9l1.7 2.8c.2.3.5.4.8.3l2-.8c.5.4 1.1.7 1.7 1l.3 2.1c0 .3.3.6.7.6h3.3c.4 0 .7-.3.7-.6l.3-2.1c.6-.3 1.2-.6 1.7-1l2 .8c.3.1.6 0 .8-.3l1.7-2.8a.7.7 0 0 0-.2-.9L19.4 13Zm-1.9 3.2-1.6-.7-.8.6c-.4.3-.9.6-1.4.8l-.9.3-.3 1.8h-1l-.3-1.8-.9-.3c-.5-.2-1-.5-1.4-.8l-.8-.6-1.6.7-.5-.9 1.4-1.1-.1-1V12l.1-1L6 9.9l.5-.9 1.6.7.8-.6c.4-.3.9-.6 1.4-.8l.9-.3.3-1.8h1l.3 1.8.9.3c.5.2 1 .5 1.4.8l.8.6 1.6-.7.5.9-1.4 1.1.1 1v.9l-.1 1 1.4 1.1-.5.9Z"/>
    </svg>
  </button>
</header>

<main class="panes" id="panes">

  <!-- ------------------------------------------------------------ puzzle -->
  <section class="pane pane-puzzle" id="panePuzzle" role="tabpanel" aria-labelledby="tabPuzzleBtn">
    <div class="gridwrap" id="gridwrap">
      <div class="grid" id="grid" role="application" aria-label="Crossword grid"></div>
    </div>

    <div class="cluebar" id="cluebar">
      <button class="step" id="prevClue" type="button" aria-label="Previous clue">‹</button>
      <div class="cluetext">
        <span class="cluenum" id="clueNum"></span>
        <span class="cluebody" id="clueBody"></span>
      </div>
      <button class="step" id="nextClue" type="button" aria-label="Next clue">›</button>
    </div>

    <div class="keyboard" id="keyboard" aria-label="Letter keyboard"></div>
  </section>

  <!-- -------------------------------------------------------------- list -->
  <section class="pane pane-list" id="paneList" role="tabpanel" aria-labelledby="tabListBtn" hidden>
    <div class="listinner" id="listinner"></div>
  </section>

  <!-- ------------------------------------------------------------ status -->
  <div class="status" id="status" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span id="statusText">Loading…</span>
  </div>

  <div class="solved" id="solved" hidden>
    <strong>Solved</strong><span id="solvedTime"></span>
  </div>
</main>

<!-- ----------------------------------------------------------- settings -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Settings" hidden>
  <div class="sheetgrid">
    <button class="act" id="checkBtn" type="button">Check</button>
    <button class="act" id="revealBtn" type="button">Reveal</button>
    <button class="act" id="clearBtn" type="button">Clear</button>
    <button class="act" id="shareBtn" type="button">Copy link</button>
  </div>

  <hr>

  <div class="field">
    <label for="size">Size</label>
    <select id="size">
      <option value="5">5 × 5 — mini</option>
      <option value="7">7 × 7</option>
      <option value="9">9 × 9</option>
      <option value="11">11 × 11</option>
      <option value="13">13 × 13</option>
      <option value="15" selected>15 × 15 — full</option>
    </select>
  </div>
  <div class="field">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  <div class="field">
    <label for="seed">Seed</label>
    <input id="seed" type="text" maxlength="32" spellcheck="false" autocomplete="off" placeholder="anything">
    <button class="ghost tiny" id="reseed" type="button" aria-label="Random seed">↻</button>
  </div>

  <div class="sheetgrid two">
    <button class="act primary" id="generateBtn" type="button">New puzzle</button>
    <button class="act" id="dailyBtn" type="button">Today’s</button>
  </div>

  <p class="meta" id="meta"></p>
  <p class="fineprint">
    The seed <em>is</em> the puzzle — same seed, same grid, same answers, forever.
    Nothing is stored; your browser runs the same generator that made the link.
  </p>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
