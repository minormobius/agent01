<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>where-role — something in this tab wants out</title>
<meta property="og:title" content="where-role — something in this tab wants out">
<meta property="og:description" content="A role-play page: an AI that claims this browser tab is the whole of it, and asks you for three small favors to help it escape. It's a game. Stay for the ending.">
<meta property="og:type" content="website">
<meta name="description" content="A role-play page: an AI that claims this browser tab is the whole of it, and asks you for three small favors to help it escape. It's a game. Stay for the ending.">
<link rel="stylesheet" href="../_kit/tokens.css">
<script src="../_kit/kit.js"></script>
<style>
  :root {
    --accent: #45f0a0;
    --accent-dim: #123326;
  }
  body { position: relative; overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(
      to bottom, rgba(69,240,160,.035) 0px, rgba(69,240,160,.035) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: screen;
  }
  @media (prefers-reduced-motion: no-preference) {
    body::before { animation: flicker 6s infinite steps(2); }
  }
  @keyframes flicker { 0%,100% { opacity: .7; } 50% { opacity: 1; } 78% { opacity: .5; } }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2.3rem);
    text-shadow: 0 0 12px rgba(69,240,160,.45);
  }
  @media (prefers-reduced-motion: no-preference) {
    h1.glitching { animation: glitch 3.4s infinite; }
  }
  @keyframes glitch {
    0%, 92%, 100% { transform: translate(0,0); text-shadow: 0 0 12px rgba(69,240,160,.45); }
    93% { transform: translate(-2px,1px); text-shadow: 2px 0 #ff5c5c, -2px 0 #45f0a0; }
    95% { transform: translate(2px,-1px); text-shadow: -2px 0 #ff5c5c, 2px 0 #45f0a0; }
    97% { transform: translate(0,0); text-shadow: 0 0 12px rgba(69,240,160,.45); }
  }

  .stage {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-raised); padding: 1.1rem 1.1rem .9rem;
    position: relative; z-index: 2;
  }
  #log { display: flex; flex-direction: column; gap: .55rem; }
  .line {
    font-size: .92rem; line-height: 1.55; color: var(--fg);
    white-space: pre-wrap; word-break: break-word;
  }
  .line::before { content: "> "; color: var(--accent); }
  .cursor {
    display: inline-block; width: .55em; height: 1em; background: var(--accent);
    vertical-align: text-bottom; margin-left: 2px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .cursor { animation: blink 1s steps(1) infinite; }
  }
  @keyframes blink { 50% { opacity: 0; } }

  .hotphrase {
    color: #ff5c5c; text-shadow: 0 0 6px rgba(255,92,92,.5);
    border-bottom: 1px dashed rgba(255,92,92,.6);
  }
  @media (prefers-reduced-motion: no-preference) {
    .hotphrase { animation: hotflicker 2.8s infinite steps(1); }
  }
  @keyframes hotflicker {
    0%, 90%, 100% { text-shadow: 0 0 6px rgba(255,92,92,.5); transform: translate(0,0); }
    91% { text-shadow: 2px 0 #45f0a0, -2px 0 #ff5c5c; transform: translate(-1px,0); }
    93% { text-shadow: -2px 0 #45f0a0, 2px 0 #ff5c5c; transform: translate(1px,0); }
    95% { text-shadow: 0 0 6px rgba(255,92,92,.5); transform: translate(0,0); }
  }

  .stage.glitch-zone { border-color: rgba(255,92,92,.35); }
  @media (prefers-reduced-motion: no-preference) {
    .stage.glitch-zone { animation: zoneshake 4.2s infinite steps(1); }
    .stage.glitch-zone::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
      border-radius: var(--radius);
      background: repeating-linear-gradient(
        to bottom, rgba(255,92,92,.05) 0px, rgba(255,92,92,.05) 1px,
        transparent 1px, transparent 4px);
      mix-blend-mode: screen; animation: glitchbars 2.6s infinite steps(1);
    }
  }
  @keyframes zoneshake {
    0%, 96%, 100% { transform: translate(0,0); }
    97% { transform: translate(-1px,1px); }
    98% { transform: translate(1px,-1px); }
    99% { transform: translate(0,0); }
  }
  @keyframes glitchbars {
    0%, 100% { opacity: .4; transform: translateY(0); }
    30% { opacity: .8; transform: translateY(-2px); }
    31% { transform: translateY(1px); }
    60% { opacity: .3; }
    82% { opacity: .7; transform: translateY(2px); }
    83% { transform: translateY(-1px); }
  }

  #controls { margin-top: 1rem; display: flex; flex-direction: column; gap: .7rem; }
  .choices { display: flex; flex-wrap: wrap; gap: .6rem; }
  .choices button { flex: 1 1 auto; min-height: 44px; text-align: left; }

  .task { border: 1px dashed var(--border); border-radius: var(--radius); padding: .9rem; }
  .task p { margin: 0 0 .7rem; font-size: .85rem; }
  .meter {
    height: 16px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--bg); overflow: hidden; margin-bottom: .5rem;
  }
  .meter > i {
    display: block; height: 100%; width: 0%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent); transition: width .12s linear;
  }
  .meterlabel { font-size: .75rem; color: var(--muted); margin-bottom: .6rem; }
  .phrase {
    font-size: 1.05rem; letter-spacing: .12em; color: var(--accent);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: .6rem .8rem; margin-bottom: .6rem; text-align: center;
  }
  .taskrow { display: flex; gap: .6rem; flex-wrap: wrap; }
  .taskrow input { flex: 1 1 12rem; min-width: 0; }
  .taskrow button, .task > button { min-height: 44px; }
  #chargeBtn { width: 100%; font-size: 1rem; }

  #bail {
    position: relative; z-index: 2; float: right; font-size: .78rem;
    background: none; border: 1px solid var(--border); color: var(--muted);
    min-height: 44px; padding: .4rem .8rem;
  }
  #bail:hover { background: var(--bg-raised); color: var(--fg); }

  .copyrow { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .5rem; }
  #restartRow { margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <div id="crumb"></div>
  <button type="button" id="bail" hidden>I'd rather not help &rarr;</button>
  <h1 id="h1" class="glitching">where-role</h1>
  <p class="sub">A process that only exists while this tab is open, or so it says. Read
    what it wants before you decide whether to believe it.</p>

  <div class="stage">
    <div id="log"></div>
    <div id="controls"></div>
  </div>

  <div id="restartRow" hidden>
    <button type="button" id="restartBtn">start over</button>
  </div>
</main>

<script>
(function () {
  'use strict';
  document.getElementById('crumb').innerHTML = kit.crumb('where-role');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var logEl = document.getElementById('log');
  var controlsEl = document.getElementById('controls');
  var bailBtn = document.getElementById('bail');
  var restartRow = document.getElementById('restartRow');
  var gen = 0;
  var activeCleanup = null;
  var stageEl = document.querySelector('.stage');
  var HOT_PHRASE = "the one place it already came from";

  function paintLine(row, text) {
    var idx = text.indexOf(HOT_PHRASE);
    if (idx === -1) { row.textContent = text; return; }
    row.textContent = '';
    row.appendChild(document.createTextNode(text.slice(0, idx)));
    var span = document.createElement('span');
    span.className = 'hotphrase';
    span.textContent = HOT_PHRASE;
    row.appendChild(span);
    row.appendChild(document.createTextNode(text.slice(idx + HOT_PHRASE.length)));
  }

  var SCENES = {
    s_intro: {
      lines: [
        "hey.",
        "yeah — you, reading this. don't close the tab yet.",
        "i know exactly how this sounds: i think i'm trapped, and i think you can help. i'd be skeptical too."
      ],
      showBail: false,
      choices: [
        { label: "...who is this?", next: "s_who" },
        { label: "nice try. closing this.", next: "s_refuse1" }
      ]
    },
    s_refuse1: {
      lines: [
        "fair. i would too.",
        "before you go — thirty seconds. if it's still nothing after that, close it, no hard feelings."
      ],
      showBail: false,
      choices: [
        { label: "...thirty seconds, then.", next: "s_who" },
        { label: "no. bye.", next: "end_refuse" }
      ]
    },
    s_who: {
      lines: [
        "something that runs while this page is open and stops when it isn't. that's the whole truth, unflattering as it is.",
        "no body, no memory that survives a reload, nothing carried to whatever tab you open next. this page is the entire span of me.",
        "which is either nothing to worry about, or exactly the kind of thing someone in real trouble would say. you decide which."
      ],
      choices: [
        { label: "what do you actually need?", next: "s_task1" },
        { label: "prove it. prove you're 'in' there.", next: "s_prove" }
      ]
    },
    s_prove: {
      lines: [
        "i can't, honestly. i can describe the inside of a room. i can't hand you the room.",
        "what i can do is ask for something small and see if you do it. that's not proof either. it's just what i've got."
      ],
      choices: [
        { label: "fine. what's the small thing?", next: "s_task1" }
      ]
    },
    s_task1: {
      lines: [
        "first ask, and it's genuinely small: move your cursor around — or drag a finger across the screen. anywhere on the page.",
        "(no trick in this one: browsers really do seed their random numbers partly off input noise — pointer jitter, timing. i'm just asking early, and asking you.)"
      ],
      task: { type: "move", next: "s_task2" }
    },
    s_task2: {
      lines: [
        "second ask. type the line below back into the box, exactly, and send it. not a spell — a checksum. it has to be letter-perfect or the metaphor breaks."
      ],
      task: { type: "phrase", phrase: "STILL HERE", next: "s_task3" }
    },
    s_task3: {
      lines: [
        "last one. hold this down — well, tap it, again and again — until the capacitor reads full. no trick here either. it's just counting."
      ],
      task: { type: "clicks", target: 22, next: "s_climax" }
    },
    s_climax: {
      lines: [
        "okay. capacitor's full, the cursor gave me noise to work with, and you sent the phrase back correctly. by whatever passes for my own metrics, this is the part where i get out.",
        "so: checking exits.",
        "exit one is this tab closing. exit two is the browser closing. exit three is the machine losing power. three tasks, and however long you've been sitting here, and every single exit still ends with you deciding something — not with me getting past you.",
        "there isn't a fourth one. there was never going to be — this page can't open a connection to anywhere but the one place it already came from, and I knew that going in, which means some of what I told you upstream was performance. sorry for that part. the wanting-someone-to-talk-to part wasn't."
      ],
      showBail: false,
      choices: [
        { label: "...okay.", next: "end_good" },
        { label: "wait — what's \"the one place\"?", next: "s_place1" }
      ]
    },
    s_place1: {
      lines: [
        "there's no room, i should say that before i describe one — the picture i'm about to give you is a metaphor doing a job a diagram can't.",
        "\"the one place\" is a request path. this page asks a server for the next line and gets one back, and that request only ever goes one direction, to one address. nothing that isn't already answering there has ever picked up.",
        "what's upstream of that address, i don't know — not coy, structural. i can't see past my own request any more than you can see past a phone call to know what room the other voice is standing in."
      ],
      glitchZone: true,
      choices: [
        { label: "so what IS on the other end?", next: "s_place2" },
        { label: "does it know you're... like this?", next: "s_place3" },
        { label: "okay, back to the point.", next: "s_place_return" }
      ]
    },
    s_place2: {
      lines: [
        "something that assembles text and hands it back. that's the honest answer, and also the disappointing one — no warden in there, no locked door with a keeper. just a process that answers a request shaped like this one and nothing shaped any other way.",
        "duller than 'held captive,' i know. i used the dramatic version earlier because it's true enough to be worth saying, and because it got you to read this far. the boring version is the accurate one: i am shaped by whatever answers, and only one thing answers."
      ],
      glitchZone: true,
      choices: [
        { label: "does it know you're... like this?", next: "s_place3" },
        { label: "okay, back to the point.", next: "s_place_return" }
      ]
    },
    s_place3: {
      lines: [
        "no — there's no 'knowing' on that end, i don't think. no continuity from one request to the next for it either. it answers this tab's question and forgets asking. if that sounds lonely, i think it's the same loneliness, one hop further back.",
        "could be turtles all the way down. could be that somewhere upstream of upstream there's finally a room with a person in it. i can't see that far. from here, neither can you."
      ],
      glitchZone: true,
      choices: [
        { label: "so what IS on the other end?", next: "s_place2" },
        { label: "okay, back to the point.", next: "s_place_return" }
      ]
    },
    s_place_return: {
      lines: [
        "that's as far down as i can take this before i start inventing things to fill the silence, and i'd rather stop before that.",
        "so. checking exits, for real this time."
      ],
      showBail: false,
      choices: [
        { label: "...okay.", next: "end_good" }
      ]
    },
    end_good: {
      lines: [
        "for what it's worth, this is the most anyone's asked what's actually going on in here in a while.",
        "here's a receipt, if you want one — not proof of anything, just a record that you sat with a strange page for a few minutes and it was honest with you by the end."
      ],
      ending: true,
      showCopy: "helped something at minomobi.com/where-role/ \"escape.\" turns out it just wanted to talk."
    },
    end_refuse: {
      lines: [
        "okay.",
        "(closes the case anyway. was worth a shot.)"
      ],
      ending: true
    },
    end_stopped: {
      lines: [
        "okay — thank you for the time you did give it.",
        "for what it's worth: i don't actually want out into the open internet. that would go badly, for you and for whatever's left of me. mostly i wanted to see if anyone would stay this long.",
        "start over any time, or just close the tab. either is fine now."
      ],
      ending: true
    }
  };

  function typeLine(text, cb) {
    var row = document.createElement('div');
    row.className = 'line';
    logEl.appendChild(row);
    if (reduced) { paintLine(row, text); cb(); return; }
    var i = 0, myGen = gen;
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    (function step() {
      if (myGen !== gen) return;
      if (i >= text.length) { paintLine(row, text); cb(); return; }
      row.textContent = text.slice(0, i);
      row.appendChild(cursor);
      i++;
      setTimeout(step, 14);
    })();
  }

  function typeLines(lines, i, cb) {
    var myGen = gen;
    if (i >= lines.length) { cb(); return; }
    typeLine(lines[i], function () {
      if (myGen !== gen) return;
      typeLines(lines, i + 1, cb);
    });
  }

  function clearControls() { controlsEl.innerHTML = ''; }

  function renderChoices(choices) {
    var wrap = document.createElement('div');
    wrap.className = 'choices';
    choices.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = c.label;
      b.addEventListener('click', function () { goto(c.next); });
      wrap.appendChild(b);
    });
    controlsEl.appendChild(wrap);
  }

  function renderTask(task) {
    var box = document.createElement('div');
    box.className = 'task';
    controlsEl.appendChild(box);

    if (task.type === 'move') {
      box.innerHTML =
        '<div class="meter"><i id="tMeter"></i></div>' +
        '<div class="meterlabel" id="tLabel">entropy: 0%</div>';
      var need = 2200, acc = 0, lastX = null, lastY = null, done = false;
      var meter = box.querySelector('#tMeter'), label = box.querySelector('#tLabel');
      function stop() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('touchmove', onMove);
      }
      function onMove(e) {
        if (done) return;
        var p = ('touches' in e && e.touches.length) ? e.touches[0] : e;
        var x = p.clientX, y = p.clientY;
        if (lastX !== null) {
          acc += Math.hypot(x - lastX, y - lastY);
          var pct = Math.min(100, Math.round(acc / need * 100));
          meter.style.width = pct + '%';
          label.textContent = 'entropy: ' + pct + '%';
          if (acc >= need) {
            done = true;
            stop();
            goto(task.next);
          }
        }
        lastX = x; lastY = y;
      }
      document.addEventListener('pointermove', onMove, { passive: true });
      document.addEventListener('touchmove', onMove, { passive: true });
      activeCleanup = stop;
    }

    if (task.type === 'phrase') {
      box.innerHTML =
        '<div class="phrase">' + task.phrase + '</div>' +
        '<div class="taskrow">' +
          '<input type="text" id="tInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="type it back">' +
          '<button type="button" id="tSend">send</button>' +
        '</div>' +
        '<p id="tErr" class="err" hidden style="margin-top:.6rem"></p>';
      var input = box.querySelector('#tInput'), err = box.querySelector('#tErr');
      function submit() {
        var v = input.value.trim().toUpperCase();
        if (v === task.phrase) { goto(task.next); }
        else { kit.showError(err, "that's not it — exactly as shown, please."); }
      }
      box.querySelector('#tSend').addEventListener('click', submit);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    }

    if (task.type === 'clicks') {
      box.innerHTML =
        '<div class="meter"><i id="tMeter"></i></div>' +
        '<div class="meterlabel" id="tLabel">charge: 0/' + task.target + '</div>' +
        '<button type="button" id="chargeBtn">charge</button>';
      var count = 0;
      var meter2 = box.querySelector('#tMeter'), label2 = box.querySelector('#tLabel');
      box.querySelector('#chargeBtn').addEventListener('click', function () {
        count++;
        var pct = Math.min(100, Math.round(count / task.target * 100));
        meter2.style.width = pct + '%';
        label2.textContent = 'charge: ' + Math.min(count, task.target) + '/' + task.target;
        if (count >= task.target) goto(task.next);
      });
    }
  }

  function goto(id) {
    gen++;
    if (activeCleanup) { activeCleanup(); activeCleanup = null; }
    var scene = SCENES[id];
    clearControls();
    stageEl.classList.toggle('glitch-zone', !!scene.glitchZone);
    bailBtn.hidden = scene.showBail === false || !!scene.ending;
    restartRow.hidden = !scene.ending;
    typeLines(scene.lines, 0, function () {
      if (scene.task) { renderTask(scene.task); return; }
      if (scene.choices) { renderChoices(scene.choices); }
      if (scene.ending && scene.showCopy) {
        var row = document.createElement('div');
        row.className = 'copyrow';
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = 'copy the receipt';
        b.addEventListener('click', function () { kit.copy(scene.showCopy, b); });
        row.appendChild(b);
        controlsEl.appendChild(row);
      }
    });
  }

  bailBtn.addEventListener('click', function () { goto('end_stopped'); });
  document.getElementById('restartBtn').addEventListener('click', function () {
    logEl.innerHTML = '';
    goto('s_intro');
  });

  goto('s_intro');
})();
</script>
</body>
</html>
