<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pipedream — a screensaver made of scrolling text</title>
<meta property="og:title" content="pipedream — a screensaver made of scrolling text">
<meta property="og:description" content="If screensavers were invented after microblogging: real 3D pipes grow through the screen with your own text — or one Bluesky account's recent posts — as letters running along the sides of the tube. Adjustable speed, honours reduced motion.">
<link rel="stylesheet" href="../_kit/tokens.css">
<script src="../_kit/kit.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { padding: 0; }
  main { max-width: none; margin: 0; }
  #pipes {
    position: fixed; inset: 0; display: block;
    background: var(--bg);
    touch-action: none;
  }
  .crumb-wrap { position: fixed; top: 0; left: 0; z-index: 5; padding: .6rem .8rem; }
  .crumb-wrap .crumb { margin: 0; background: rgba(14,14,17,.6); border-radius: var(--radius); padding: .3rem .6rem; }

  .hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
         background: rgba(14,14,17,.88); border-top: 1px solid var(--border);
         backdrop-filter: blur(6px); max-height: 78vh; overflow-y: auto; }
  .hud-toggle { display: block; width: 100%; min-height: 44px; text-align: left;
                border: none; border-bottom: 1px solid var(--border); border-radius: 0;
                background: transparent; color: var(--accent); font: inherit; font-size: .85rem;
                padding: 0 1rem; }
  .hud-toggle:hover { background: var(--accent-dim); color: var(--accent); }
  .hud-panel { padding: .75rem 1rem 1rem; }
  .hud-panel.hidden { display: none; }
  .hud-row { display: flex; align-items: center; gap: .6rem; font-size: .8rem;
             color: var(--muted); margin-bottom: .7rem; flex-wrap: wrap; }
  .hud-row.block { flex-direction: column; align-items: stretch; }
  .hud-row input[type=range] { flex: 1 1 8rem; min-height: 28px; }
  .hud-row select { min-height: 44px; }
  .hud-row input[type=text], .hud-row textarea { font-size: 16px; min-height: 44px; }
  .hud-row textarea { min-height: 3.4rem; resize: vertical; }
  .hint { color: var(--muted); font-size: .72rem; }
  #speedVal { color: var(--accent); min-width: 3.2em; }
  .hud-status { font-size: .78rem; color: var(--ok); min-height: 1.2em; }
  .hud-status.err { color: var(--error); }
</style>
</head>
<body>
<div class="crumb-wrap"></div>
<canvas id="pipes" aria-hidden="true"></canvas>

<div class="hud">
  <button id="hudToggle" class="hud-toggle" aria-expanded="true" aria-controls="hudPanel">pipedream — controls ▾</button>
  <div id="hudPanel" class="hud-panel">
    <label class="hud-row">
      speed
      <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1">
      <span id="speedVal">1.0×</span>
    </label>
    <label class="hud-row">
      motion
      <select id="motion">
        <option value="auto">auto (follow system)</option>
        <option value="on">always on</option>
        <option value="off">always off (freeze)</option>
      </select>
    </label>
    <label class="hud-row block">
      your text <span class="hint">— imprinted on the pipes, letter by letter. Leave blank for random text.</span>
      <textarea id="customText" rows="2" placeholder="type anything…"></textarea>
    </label>
    <label class="hud-row block">
      or a Bluesky handle <span class="hint">— pulls their recent visible posts instead. This clears the box above.</span>
      <input type="text" id="handleBox" placeholder="someone.bsky.social">
    </label>
    <div id="sourceStatus" class="hud-status">letters: random text</div>
  </div>
</div>

<script type="module">
import * as THREE from '../_kit/three.module.min.js';

(function () {
  document.querySelector('.crumb-wrap').innerHTML = kit.crumb('pipedream');

  var canvas = document.getElementById('pipes');
  var DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

  // ---- text pool: the letters the pipes carry ------------------------------
  var WORDS = ['pipe','screen','saver','glass','signal','drift','static','loop',
    'amber','circuit','hollow','echo','pane','current','tangent','quiet','orbit',
    'flicker','warm','copper','vapor','runoff','lattice','murmur','glow','undertow',
    'ledger','margin','spindle','cistern','plume','ballast','ration','tinder',
    'vellum','cobalt','filament','arcade','beacon','undated','embers','transit',
    'sluice','coolant','idle','dream','feed','scroll','thread','render','render',
    'wander','bandwidth','afterimage','standby','dormant','pixel'];

  function randomPool() {
    var out = [];
    for (var i = 0; i < 500; i++) out.push(WORDS[Math.floor(Math.random() * WORDS.length)]);
    return out.join(' ');
  }

  var pool = randomPool(), poolPos = 0;
  function setPool(str) {
    var clean = (str || '').replace(/\s+/g, ' ').trim();
    pool = clean || randomPool();
    poolPos = 0;
  }
  function nextChar() {
    if (!pool) return '';
    var c = pool[poolPos % pool.length];
    poolPos++;
    return c.toUpperCase();
  }

  // ---- three.js scene ----------------------------------------------------
  var scene = new THREE.Scene();
  var bgHex = (getComputedStyle(document.documentElement).getPropertyValue('--bg') || '#0e0e11').trim();
  scene.background = new THREE.Color(bgHex);

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(DPR);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a20, 1.0));
  var sun = new THREE.DirectionalLight(0xffffff, 0.95);
  sun.position.set(5, 8, 6);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0x6688ff, 0.35);
  fill.position.set(-6, -3, -4);
  scene.add(fill);

  var pipesGroup = new THREE.Group();
  scene.add(pipesGroup);

  // ---- grid + pipes: a real 3D pipedream, six directions ------------------
  var CELL = 1.1;
  var cols = 10, rows = 8, depth = 8;
  var center = new THREE.Vector3((cols - 1) / 2 * CELL, (rows - 1) / 2 * CELL, (depth - 1) / 2 * CELL);
  var totalCells = cols * rows * depth;
  var fillLimit = totalCells * 0.5;
  var drawnCount = 0;
  var RADIUS = CELL * 0.24;
  var UP = new THREE.Vector3(0, 1, 0);

  var segGeo = new THREE.CylinderGeometry(RADIUS, RADIUS, CELL, 10, 1, true);
  var jointGeo = new THREE.SphereGeometry(RADIUS * 1.05, 10, 8);
  var decalGeo = new THREE.PlaneGeometry(CELL * 0.6, CELL * 0.6);

  var letterTexCache = {};
  function letterTexture(ch) {
    if (letterTexCache[ch]) return letterTexCache[ch];
    var c = document.createElement('canvas');
    c.width = c.height = 96;
    var g = c.getContext('2d');
    g.font = 'bold 64px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(0,0,0,.55)';
    g.fillText(ch, 49, 51);
    g.fillStyle = '#fff';
    g.fillText(ch, 48, 48);
    var tex = new THREE.CanvasTexture(c);
    if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
    letterTexCache[ch] = tex;
    return tex;
  }

  function gridToWorld(gx, gy, gz) {
    return new THREE.Vector3(gx * CELL, gy * CELL, gz * CELL).sub(center);
  }

  function sideVectorFor(dir) {
    var ref = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : UP;
    return new THREE.Vector3().crossVectors(dir, ref).normalize();
  }

  var DIRS = [{x:1,y:0,z:0},{x:-1,y:0,z:0},{x:0,y:1,z:0},{x:0,y:-1,z:0},{x:0,y:0,z:1},{x:0,y:0,z:-1}];
  var pipes = [];

  function spawn() {
    return {
      gx: Math.floor(Math.random() * cols),
      gy: Math.floor(Math.random() * rows),
      gz: Math.floor(Math.random() * depth),
      dir: null,
      cells: 0,
      maxLen: Math.round(14 + Math.random() * (cols + rows + depth) / 1.4),
      color: new THREE.Color().setHSL(Math.random(), 0.55, 0.5)
    };
  }

  function validDir(p, d) {
    var nx = p.gx + d.x, ny = p.gy + d.y, nz = p.gz + d.z;
    return nx >= 0 && nx < cols && ny >= 0 && ny < rows && nz >= 0 && nz < depth;
  }

  function pickDir(p) {
    var opts = DIRS.filter(function (d) {
      if (!validDir(p, d)) return false;
      if (p.dir && d.x === -p.dir.x && d.y === -p.dir.y && d.z === -p.dir.z) return false;
      return true;
    });
    if (!opts.length) return null;
    if (p.dir && Math.random() < 0.72) {
      for (var i = 0; i < opts.length; i++) {
        if (opts[i].x === p.dir.x && opts[i].y === p.dir.y && opts[i].z === p.dir.z) return opts[i];
      }
    }
    return opts[Math.floor(Math.random() * opts.length)];
  }

  function makeSegmentMesh(p1, p2, color) {
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: .55, metalness: .15 });
    var mesh = new THREE.Mesh(segGeo, mat);
    mesh.position.copy(p1).add(p2).multiplyScalar(.5);
    var dir = new THREE.Vector3().subVectors(p2, p1).normalize();
    mesh.quaternion.setFromUnitVectors(UP, dir);
    return mesh;
  }

  // letters mounted on the tube's own surface, running along its length —
  // not stamped once at the growing tip and left behind.
  function makeLetterDecal(point, dir, ch) {
    if (!ch || ch === ' ') return null;
    var mat = new THREE.MeshBasicMaterial({ map: letterTexture(ch), transparent: true, side: THREE.DoubleSide, depthWrite: false });
    var mesh = new THREE.Mesh(decalGeo, mat);
    var side = sideVectorFor(dir);
    mesh.position.copy(point).addScaledVector(side, RADIUS * 1.15);
    var zAxis = side;
    var xAxis = new THREE.Vector3().crossVectors(dir, zAxis).normalize();
    var yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();
    mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
    return mesh;
  }

  function growPipe(p, idx) {
    var d = pickDir(p);
    if (!d || p.cells >= p.maxLen) { pipes[idx] = spawn(); return; }
    var prev = gridToWorld(p.gx, p.gy, p.gz);
    p.gx += d.x; p.gy += d.y; p.gz += d.z;
    p.dir = d;
    p.cells++;
    var cur = gridToWorld(p.gx, p.gy, p.gz);
    var dirVec = new THREE.Vector3(d.x, d.y, d.z);

    pipesGroup.add(makeSegmentMesh(prev, cur, p.color));
    var joint = new THREE.Mesh(jointGeo, new THREE.MeshStandardMaterial({ color: p.color, roughness: .5, metalness: .15 }));
    joint.position.copy(cur);
    pipesGroup.add(joint);

    var decal = makeLetterDecal(cur, dirVec, nextChar());
    if (decal) pipesGroup.add(decal);

    drawnCount++;
  }

  function fullReset() {
    for (var i = pipesGroup.children.length - 1; i >= 0; i--) {
      var obj = pipesGroup.children[i];
      pipesGroup.remove(obj);
      if (obj.material) obj.material.dispose();
    }
    drawnCount = 0;
    for (var j = 0; j < pipes.length; j++) pipes[j] = spawn();
  }

  var pipeCount = Math.max(4, Math.min(9, Math.round(totalCells / 70)));
  for (var i0 = 0; i0 < pipeCount; i0++) pipes.push(spawn());

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }

  // ---- motion / speed --------------------------------------------------------
  var speedMul = 1, motionMode = 'auto';
  function motionAllowed() {
    if (motionMode === 'on') return true;
    if (motionMode === 'off') return false;
    return !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  var orbitRadius = Math.max(cols, rows, depth) * CELL * 1.55;
  var orbitHeight = rows * CELL * 0.55;
  var orbitAngle = 0.6;
  var ORBIT_RATE = 0.00018;

  var TICK_MS = 90, acc = 0, lastT = null;
  function frame(t) {
    if (lastT === null) lastT = t;
    var dt = Math.min(100, t - lastT);
    lastT = t;
    if (motionAllowed()) {
      orbitAngle += dt * ORBIT_RATE * speedMul;
      acc += dt * speedMul;
      while (acc >= TICK_MS) {
        acc -= TICK_MS;
        for (var i = 0; i < pipes.length; i++) growPipe(pipes[i], i);
        if (drawnCount > fillLimit) fullReset();
      }
    }
    camera.position.set(orbitRadius * Math.sin(orbitAngle), orbitHeight, orbitRadius * Math.cos(orbitAngle));
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---- HUD wiring --------------------------------------------------------
  var hudToggle = document.getElementById('hudToggle');
  var hudPanel = document.getElementById('hudPanel');
  hudToggle.addEventListener('click', function () {
    var open = hudPanel.classList.toggle('hidden');
    hudToggle.setAttribute('aria-expanded', open ? 'false' : 'true');
    hudToggle.textContent = 'pipedream — controls ' + (open ? '▸' : '▾');
  });

  var speedInput = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');
  speedInput.addEventListener('input', function () {
    speedMul = parseFloat(speedInput.value) || 1;
    speedVal.textContent = speedMul.toFixed(2).replace(/0$/, '') + '×';
  });

  document.getElementById('motion').addEventListener('change', function (e) {
    motionMode = e.target.value;
  });

  var status = document.getElementById('sourceStatus');
  function setStatus(msg, isErr) {
    status.textContent = msg;
    status.className = 'hud-status' + (isErr ? ' err' : '');
  }

  var customText = document.getElementById('customText');
  customText.addEventListener('input', function () {
    var v = customText.value;
    if (v.trim()) {
      setPool(v);
      setStatus('letters: your text');
    } else {
      setPool('');
      setStatus('letters: random text');
    }
  });

  var handleBox = document.getElementById('handleBox');
  kit.handleInput(handleBox, {
    onPick: function (handle) {
      customText.value = '';
      setStatus('loading @' + handle + '’s posts…');
      kit.bskyGet('app.bsky.feed.getAuthorFeed', { actor: handle, limit: 30 })
        .then(function (data) {
          var items = kit.visible(data.feed || []);
          var texts = items
            .map(function (it) { return it.post && it.post.record && it.post.record.text; })
            .filter(Boolean);
          if (!texts.length) {
            setPool('');
            setStatus('@' + handle + ' has no visible recent posts — using random text', true);
            return;
          }
          setPool(texts.join('  ·  '));
          setStatus('letters: @' + handle + '’s recent posts');
        })
        .catch(function (e) {
          setPool('');
          setStatus('could not load @' + handle + ': ' + e.message + ' — using random text', true);
        });
    }
  });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
