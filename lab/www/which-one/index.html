<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>which one? — a Bluesky head-to-head</title>
<meta property="og:title" content="which one? — a Bluesky head-to-head">
<meta property="og:description" content="Type two Bluesky handles. Public stats settle who's &quot;better&quot;, for absolutely no good reason.">
<meta name="description" content="Type two Bluesky handles. Public stats settle who's better, for absolutely no good reason.">
<link rel="stylesheet" href="../_kit/tokens.css">
<script src="../_kit/kit.js"></script>
<style>
  h1 { font-size: 2.1rem; }
  .sub { line-height: 1.5; }

  form { display: grid; gap: .9rem; margin-bottom: 1.5rem; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: .7rem; align-items: end; }
  .pair .vs { color: var(--muted); font-size: .8rem; padding-bottom: .9rem; text-align: center; }
  .field label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: .35rem; }
  button[type=submit] { width: 100%; min-height: 3rem; font-size: 1rem; }

  @media (max-width: 480px) {
    .pair { grid-template-columns: 1fr; }
    .pair .vs { padding: 0; }
  }

  #result { margin-top: 2rem; }
  #result.hidden { display: none; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
  @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1rem; background: var(--bg-raised); text-align: center;
    min-width: 0;
  }
  .card.winner { border-color: var(--accent); }
  .card img.av {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    background: var(--border); display: block; margin: 0 auto .6rem;
  }
  .card .noav {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto .6rem;
    background: var(--accent-dim); color: var(--accent); font-size: 1.6rem;
    display: flex; align-items: center; justify-content: center;
  }
  .card .dn { color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
  .card .h { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
  .card .crown { color: var(--accent); font-size: .75rem; margin-top: .4rem; min-height: 1.1em; }

  table.tally { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
  table.tally th, table.tally td {
    padding: .6rem .5rem; border-bottom: 1px solid var(--border);
    font-size: .82rem; text-align: center; color: var(--muted);
  }
  table.tally th:first-child, table.tally td:first-child { text-align: left; }
  table.tally td.win { color: var(--accent); font-weight: 600; }
  table.tally th { color: var(--fg); font-weight: 600; font-size: .75rem; }

  .verdict {
    border: 1px solid var(--accent); border-radius: var(--radius);
    background: var(--accent-dim); color: var(--accent);
    padding: 1rem; text-align: center; font-size: 1.05rem; margin-bottom: 1rem;
  }
  .caveat { font-size: .75rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <div id="crumb"></div>
  <h1>which one?</h1>
  <p class="sub">
    Type two Bluesky handles. Four public stats — followers, posts, follower
    ratio, and how long they've been around — decide who "wins". It is not
    science. It is real numbers from real profiles, arranged to settle an
    argument nobody can actually settle.
  </p>

  <form id="duel">
    <div class="pair">
      <div class="field">
        <label for="handleA">first handle</label>
        <input id="handleA" type="text" placeholder="alice.bsky.social" required>
      </div>
      <div class="vs">vs</div>
      <div class="field">
        <label for="handleB">second handle</label>
        <input id="handleB" type="text" placeholder="bob.bsky.social" required>
      </div>
    </div>
    <button type="submit" id="go">settle it</button>
  </form>

  <div id="err" class="err" hidden></div>

  <div id="result" class="hidden" aria-live="polite"></div>
</main>

<script>
(function () {
  document.getElementById('crumb').innerHTML = kit.crumb('which one');

  var handleA = document.getElementById('handleA');
  var handleB = document.getElementById('handleB');
  kit.handleInput(handleA);
  kit.handleInput(handleB);

  var form = document.getElementById('duel');
  var goBtn = document.getElementById('go');
  var errEl = document.getElementById('err');
  var resultEl = document.getElementById('result');

  function clean(v) { return v.trim().replace(/^@/, ''); }

  function imgSrc(avatar) {
    if (!avatar) return null;
    var i = avatar.indexOf('cdn.bsky.app/');
    if (i === -1) return null;
    return '/_img/' + avatar.slice(i + 'cdn.bsky.app/'.length);
  }

  function initials(profile) {
    var s = profile.displayName || profile.handle || '?';
    return s.trim().slice(0, 1).toUpperCase();
  }

  function cardHtml(profile, isWinner) {
    var src = imgSrc(profile.avatar);
    var av = src
      ? '<img class="av" src="' + src + '" alt="" loading="lazy">'
      : '<div class="noav">' + initials(profile) + '</div>';
    return '<div class="card' + (isWinner ? ' winner' : '') + '">' +
      av +
      '<div class="dn">' + escapeHtml(profile.displayName || profile.handle) + '</div>' +
      '<div class="h">@' + escapeHtml(profile.handle) + '</div>' +
      '<div class="crown">' + (isWinner ? 'ahead' : '') + '</div>' +
      '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function daysSince(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return null;
    return (Date.now() - t) / 86400000;
  }

  function fmtNum(n) { return n.toLocaleString(); }

  function fmtAge(days) {
    if (days == null) return 'unknown';
    if (days < 1) return 'less than a day';
    if (days < 60) return Math.round(days) + ' days';
    return Math.round(days / 365.25 * 10) / 10 + ' years';
  }

  function ratio(p) {
    if (!p.followsCount) return p.followersCount > 0 ? Infinity : 0;
    return p.followersCount / p.followsCount;
  }
  function fmtRatio(r) { return r === Infinity ? '∞' : (Math.round(r * 100) / 100).toLocaleString(); }

  function buildCategories(a, b) {
    var ageA = daysSince(a.createdAt), ageB = daysSince(b.createdAt);
    return [
      { label: 'followers', a: a.followersCount, b: b.followersCount, fmt: fmtNum },
      { label: 'posts', a: a.postsCount, b: b.postsCount, fmt: fmtNum },
      { label: 'followers per follow', a: ratio(a), b: ratio(b), fmt: fmtRatio },
      { label: 'on bluesky since', a: ageA, b: ageB, fmt: fmtAge, note: 'longer = more' },
    ];
  }

  function render(a, b) {
    var cats = buildCategories(a, b);
    var winsA = 0, winsB = 0;
    var rows = cats.map(function (c) {
      var av = (c.a == null) ? -Infinity : c.a;
      var bv = (c.b == null) ? -Infinity : c.b;
      var winA = av > bv, winB = bv > av;
      if (winA) winsA++;
      if (winB) winsB++;
      return '<tr><th scope="row">' + escapeHtml(c.label) + '</th>' +
        '<td class="' + (winA ? 'win' : '') + '">' + c.fmt(c.a) + '</td>' +
        '<td class="' + (winB ? 'win' : '') + '">' + c.fmt(c.b) + '</td></tr>';
    }).join('');

    var overallA = winsA > winsB, overallB = winsB > winsA;
    var verdict;
    if (winsA === winsB) {
      verdict = 'a dead heat — ' + winsA + ' categories apiece. Truly, both of you.';
    } else {
      var winnerHandle = overallA ? a.handle : b.handle;
      verdict = '@' + escapeHtml(winnerHandle) + ' takes it, ' +
        Math.max(winsA, winsB) + ' categories to ' + Math.min(winsA, winsB) + '.';
    }

    resultEl.innerHTML =
      '<div class="cards">' + cardHtml(a, overallA) + cardHtml(b, overallB) + '</div>' +
      '<div class="verdict">' + verdict + '</div>' +
      '<table class="tally"><thead><tr><th scope="col">category</th>' +
      '<th scope="col">@' + escapeHtml(a.handle) + '</th>' +
      '<th scope="col">@' + escapeHtml(b.handle) + '</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<p class="caveat">Pulled live from Bluesky’s public profile stats just now. ' +
      'Followers and posts change by the minute — refresh the duel and the outcome might not.</p>';
    resultEl.classList.remove('hidden');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    kit.clear(errEl);
    resultEl.classList.add('hidden');

    var ha = clean(handleA.value), hb = clean(handleB.value);
    if (!ha || !hb) { kit.showError(errEl, 'both handles are required.'); return; }
    if (ha.toLowerCase() === hb.toLowerCase()) {
      kit.showError(errEl, 'that’s the same account twice — try two different handles.');
      return;
    }

    goBtn.disabled = true;
    var was = goBtn.textContent;
    goBtn.textContent = 'asking bluesky…';

    Promise.all([
      kit.bskyGet('app.bsky.actor.getProfile', { actor: ha }),
      kit.bskyGet('app.bsky.actor.getProfile', { actor: hb }),
    ]).then(function (r) {
      render(r[0], r[1]);
    }).catch(function (e) {
      kit.showError(errEl, 'could not settle it: ' + e.message +
        '. Check both handles are spelled right and exist on Bluesky.');
    }).finally(function () {
      goBtn.disabled = false;
      goBtn.textContent = was;
    });
  });
})();
</script>
</body>
</html>
