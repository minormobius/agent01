<body>
<div class="aside">
  <div class="k">riemann · learn</div>
  <p>Seventeen slides. Each is a live widget; the notes sit over it. Pull the sheet up for the lecture, tap <b>next</b> or use ← → keys.</p>
  <ol id="toc"></ol>
  <p><a href="../">← the reference page</a></p>
</div>
<div class="device" id="device">
  <div class="bars" id="bars"></div>
  <div class="hdr"><a href="../">← riemann</a><span class="ch" id="ch"></span><button class="th" id="theme"></button></div>
  <div class="stage" id="stage"></div>
  <div class="toast" id="toast">done ✓</div>
  <div class="sheet" id="sheet">
    <div class="handle" id="handle"><i></i></div>
    <div class="sbody" id="sbody"></div>
    <div class="nav"><button id="prev">←</button><span class="pos" id="pos"></span><button class="next" id="next">next →</button></div>
  </div>
</div>

<script type="module">
import * as R from '../riemann.js';
import { ZEROS } from '../zeros.js';
import { css, frame, path, axes, cursor, tip, theme, noSelect } from './kit.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const pow10 = (e) => '10' + String(e).split('').map((c) => SUP[+c] ?? c).join('');

// ----------------------------------------------------------- state ---
const KEY = 'riemann-learn-v1';
let S = { i: 0, done: {}, pred: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s.i === 'number') S = { ...S, ...s }; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

// ----------------------------------------------------------- data, lazily ---
let _pi = null;     // prefix prime counts to 10⁶
const piTable = () => {
  if (_pi) return _pi;
  const N = 1e6, comp = new Uint8Array(N + 1), c = new Uint32Array(N + 1);
  let k = 0;
  for (let i = 2; i <= N; i++) { if (!comp[i]) { k++; for (let j = i * i; j <= N; j += i) comp[j] = 1; } c[i] = k; }
  return (_pi = c);
};

function knob(id, label, min, max, step, val) {
  return `<div class="knob"><label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o"></output></div>`;
}
const W = (html) => `<div class="w">${html}</div>`;

// ----------------------------------------------------------- slides ---
// Each slide: ch (chapter), t (title), cap (one-line caption), do (an action),
// pred (a prediction to commit to before the reveal), notes (the lecture), mount(el, ctx).
const SLIDES = [
{
  ch: 'primes', t: 'Count the primes',
  cap: 'π(x) counts the primes up to x. It is a staircase: one step at every prime, and no formula for where the next step is.',
  pred: { q: 'How many primes are there below 100?', opts: ['15', '25', '40'], a: 1, why: '25: 2, 3, 5, 7, 11, … 97. A quarter of the numbers, and the fraction keeps falling.' },
  do: 'Drag x all the way to 1000.',
  notes: `<h3>Why start here</h3><p>Every question in this deck is about this staircase. The primes look random step by step but are very regular in bulk. The Riemann hypothesis is a precise statement of <i>how</i> regular.</p><h3>What to notice</h3><p>The steps get sparser as you go right. At 100 the staircase has climbed 25, at 1000 it has climbed 168. Doubling x doesn't double π(x).</p>`,
  mount(el, ctx) {
    el.innerHTML = W(`<div class="ctl">${knob('kx', 'x', 10, 1000, 1, 100)}</div><div class="read"><div><b id="r1"></b><span>π(x)</span></div><div><b id="r2"></b><span>fraction prime</span></div></div><div class="plot"><svg id="p"></svg></div>`);
    const pi = piTable();
    const draw = () => {
      const x = +$('kx').value; $('kxo').textContent = x;
      const f = frame($('p'), { x: [0, x], y: [0, pi[x] * 1.08 + 1] });
      let d = `M${f.X(0)},${f.Y(0)}`;
      for (let n = 2; n <= x; n++) if (pi[n] !== pi[n - 1]) d += `L${f.X(n)},${f.Y(pi[n - 1])}L${f.X(n)},${f.Y(pi[n])}`;
      d += `L${f.X(x)},${f.Y(pi[x])}`;
      $('p').setAttribute('viewBox', `0 0 ${f.W} ${f.H}`);
      $('p').innerHTML = axes(f, [[0, 0], [x / 2, Math.round(x / 2)], [x, x]], [[0, 0], [pi[x], pi[x]]], 'x', 'π(x)') + `<path d="${d}" fill="none" stroke="${css('--accent')}" stroke-width="1.6"/>`;
      const P1 = []; for (let n = 0; n <= x; n++) P1.push([n, pi[n] || 0]);
      cursor($('p'), f, [{ name: 'π(x)', color: css('--accent'), pts: P1 }], { xfmt: (v) => `x = ${v}`, yfmt: (v) => `${v} primes` });
      $('r1').textContent = pi[x]; $('r2').textContent = (pi[x] / x).toFixed(3);
      if (x >= 1000) ctx.done();
    };
    $('kx').oninput = draw; draw(); return { resize: draw };
  },
},
{
  ch: 'primes', t: 'They thin out like 1/log x',
  cap: 'Gauss, at 15, guessed that near x about one number in log x is prime. Add that up and you get li(x), the logarithmic integral.',
  do: 'Slide x to 10⁶ and read the ratio π(x)/li(x).',
  notes: `<h3>The guess</h3><p class="eq">li(x) = ∫₂ˣ dt / log t</p><p>Near 10, log x ≈ 2.3 and about 1 in 2.3 numbers is prime. Near 10¹⁰, log x ≈ 23 and about 1 in 23 is. The simpler x / log x has the same leading behaviour but is visibly worse.</p><h3>The prime number theorem</h3><p>π(x)/li(x) → 1. Hadamard and de la Vallée Poussin proved it in 1896, a century after Gauss's guess. Their proof went through complex numbers, through ζ, which is where the rest of this deck goes.</p><p>The axes here are logarithmic in x: each tick is ten times the last.</p>`,
  mount(el, ctx) {
    el.innerHTML = W(`<div class="ctl">${knob('kx', 'x', 2, 6, 0.01, 3)}</div><div class="read"><div><b id="r1"></b><span>π(x)</span></div><div><b id="r2"></b><span>li(x)</span></div><div><b id="r3"></b><span>π / li</span></div></div><div class="plot"><svg id="p"></svg></div>`);
    const pi = piTable();
    const draw = () => {
      const e = +$('kx').value, x = Math.round(10 ** e);
      $('kxo').textContent = x >= 1e5 ? pow10(e.toFixed(1)).replace('.', '·') : fmt(x);
      const f = frame($('p'), { x: [10, x], y: [1, R.li(x) * 1.2], logx: true, logy: true });
      const pts = [], L = [], G = [];
      for (let i = 0; i <= 200; i++) { const v = Math.round(10 ** (1 + (e - 1) * i / 200)); if (pts.length && pts.at(-1)[0] === v) continue; pts.push([v, Math.max(1, pi[v])]); L.push([v, R.li(v)]); G.push([v, v / Math.log(v)]); }
      const xt = []; for (let k = 1; k <= Math.floor(e); k++) xt.push([10 ** k, pow10(k)]);
      $('p').setAttribute('viewBox', `0 0 ${f.W} ${f.H}`);
      $('p').innerHTML = axes(f, xt, [[1, 1], [R.li(x), fmt(R.li(x))]], 'x', '') +
        `<path d="${path(G, f.X, f.Y)}" fill="none" stroke="${css('--faint')}" stroke-dasharray="3 3"/>` +
        `<path d="${path(L, f.X, f.Y)}" fill="none" stroke="${css('--claim')}" stroke-width="1.5"/>` +
        `<path d="${path(pts, f.X, f.Y)}" fill="none" stroke="${css('--accent')}" stroke-width="2"/>` +
        `<text x="${f.pad.l + 6}" y="${f.pad.t + 10}" font-size="9" style="fill:${css('--accent')}">π(x)</text><text x="${f.pad.l + 6}" y="${f.pad.t + 22}" font-size="9" style="fill:${css('--claim')}">li(x)</text><text x="${f.pad.l + 6}" y="${f.pad.t + 34}" font-size="9">x / log x (dashed)</text>`;
      cursor($('p'), f, [{ name: 'π(x)', color: css('--accent'), pts }, { name: 'li(x)', color: css('--claim'), pts: L }, { name: 'x/log x', color: css('--muted'), pts: G }], { xfmt: (v) => `x = ${fmt(v)}`, yfmt: (v) => fmt(v) });
      $('r1').textContent = fmt(pi[x]); $('r2').textContent = fmt(R.li(x)); $('r3').textContent = (pi[x] / R.li(x)).toFixed(4);
      if (x >= 999000) ctx.done();
    };
    $('kx').oninput = draw; draw(); return { resize: draw };
  },
},
{
  ch: 'primes', t: 'How wrong is the guess?',
  cap: 'The error π(x) − li(x) wanders. The Riemann hypothesis is the claim that it never wanders further than about √x · log x.',
  pred: { q: 'In this whole range li(x) overestimates π(x). Is that true for every x?', opts: ['Yes, always', 'No, it flips infinitely often', 'Only flips once'], a: 1, why: 'Littlewood (1914): the sign flips infinitely often. The first flip is somewhere below about 10³¹⁶, and nobody has seen it.' },
  do: 'Slide x to 10⁶ and compare the blue error with the envelope.',
  notes: `<h3>The envelope</h3><p>If RH is true, then for every x ≥ 2657</p><p class="eq">|π(x) − li(x)| &lt; √x · log x / 8π</p><p>That constant is Schoenfeld's (1976), and von Koch (1901) showed that an error of that shape is <i>equivalent</i> to RH. So you can state RH without any complex numbers: it is a bound on how badly a staircase can drift from a smooth curve.</p><h3>Skewes</h3><p>Littlewood proved the error changes sign infinitely often without finding one sign change. Skewes then bounded the first one by 10^10^10^34, one of the largest numbers ever used in a proof. It is now known to be below about 1.4 × 10³¹⁶.</p>`,
  mount(el, ctx) {

        `<line x1="${f.pad.l}" x2="${f.W - f.pad.r}" y1="${f.Y(0)}" y2="${f.Y(0)}" stroke="${css('--rule')}"/>` +

{
  ch: 'ζ', t: 'Euler\'s product',
  cap: 'Sum 1/n² over all whole numbers, or multiply 1/(1 − 1/p²) over all primes: you get the same number, π²/6. The primes are hiding inside ζ.',
  pred: { q: 'Which gets close to π²/6 faster as N grows?', opts: ['the sum over n ≤ N', 'the product over primes p ≤ N', 'they match exactly'], a: 1, why: 'The product. Its error is about 1/(N log N), the sum\'s about 1/N, because the product skips composites, which the primes below N already account for.' },
  do: 'Slide N to 200 and compare the two errors.',
  notes: `<h3>The identity</h3><p class="eq">Σ<sub>n≥1</sub> 1/nˢ = ∏<sub>p</sub> 1/(1 − p⁻ˢ)</p><p>Expand each factor as a geometric series 1 + p⁻ˢ + p⁻²ˢ + … and multiply them all out. Every n appears exactly once, because every n factors into primes in exactly one way. Euler found this in 1737, and it is the whole reason ζ knows about primes.</p><h3>Why s = 2</h3><p>At s = 2 both sides converge, and Euler had already shown the sum is π²/6 (the Basel problem). At s = 1 both blow up, which gives Euler's proof that there are infinitely many primes.</p>`,
  mount(el, ctx) {
    el.innerHTML = W(`<div class="ctl">${knob('kn', 'N', 2, 200, 1, 10)}</div><div class="read"><div><b id="r1"></b><span>sum error</span></div><div><b id="r2"></b><span>product error</span></div><div><b id="r3">1.644934</b><span>π²/6</span></div></div><div class="plot"><svg id="p"></svg></div>`);
    const Z2 = Math.PI ** 2 / 6, primes = R.sieve(200);
    const draw = () => {
      const N = +$('kn').value; $('kno').textContent = N;

      for (let n = 1; n <= N; n++) { s += 1 / (n * n); if (primes[pi] === n) { p *= 1 / (1 - 1 / (n * n)); pi++; } S1.push([n, s]); S2.push([n, p]); }
      const f = frame($('p'), { x: [1, N], y: [1, 1.7] });
      $('p').setAttribute('viewBox', `0 0 ${f.W} ${f.H}`);
      $('p').innerHTML = axes(f, [[1, 1], [N, N]], [[1, '1.0'], [Z2, 'π²/6'], [1.7, '1.7']], 'N', '') +
        `<line x1="${f.pad.l}" x2="${f.W - f.pad.r}" y1="${f.Y(Z2)}" y2="${f.Y(Z2)}" stroke="${css('--good')}" stroke-dasharray="4 3"/>` +
        `<path d="${path(S1, f.X, f.Y)}" fill="none" stroke="${css('--faint')}" stroke-width="1.6"/>` +
        `<path d="${path(S2, f.X, f.Y)}" fill="none" stroke="${css('--accent')}" stroke-width="2"/>` +
        `<text x="${f.W - 12}" y="${f.Y(S1.at(-1)[1]) + 14}" font-size="9" text-anchor="end">sum</text><text x="${f.W - 12}" y="${f.Y(S2.at(-1)[1]) - 6}" font-size="9" text-anchor="end" style="fill:${css('--accent')}">product</text>`;
      cursor($('p'), f, [{ name: 'product', color: css('--accent'), pts: S2 }, { name: 'sum', color: css('--muted'), pts: S1 }], { xfmt: (v) => `N = ${v}`, yfmt: (v) => `${v.toFixed(6)} (off by ${(Z2 - v).toExponential(1)})` });

{
  ch: 'ζ', t: 'Into the complex plane',
  cap: 'Riemann extended ζ(s) to complex s, shown here up to height 35. Orange curves are where Re ζ = 0, blue where Im ζ = 0. A zero is where an orange and a blue curve cross.',
  do: 'Tap a crossing to read off where the zero is.',
  notes: `<h3>Reading the map</h3><p>Horizontal is Re s, vertical is Im s = t. ζ(s) is a complex number, so it vanishes only where its real part <i>and</i> its imaginary part are both zero: where an orange curve (Re ζ = 0) crosses a blue one (Im ζ = 0). The shading is |ζ|, darker where it is small. The dashed line is Re s = ½.</p><h3>What you should find</h3><p>Every crossing sits on the dashed line. The first is at ½ + 14.1347…i. In this window there are five, and they line up perfectly. Away from the line, orange and blue curves run side by side without ever meeting.</p><h3>Why this region</h3><p>For Re s &gt; 1 the Euler product converges and has no zeros. For Re s &lt; 0, the functional equation ζ(s) = 2ˢπˢ⁻¹ sin(πs/2) Γ(1−s) ζ(1−s) mirrors everything, and the only zeros are the trivial ones at −2, −4, …. Everything interesting lives in the critical strip 0 ≤ Re s ≤ 1.</p><p>Computed in your browser by Euler–Maclaurin summation, about 20,000 evaluations of ζ.</p>`,
  mount(el, ctx) {
    el.innerHTML = W(`<div class="read"><div><b id="r1">tap the map</b><span id="r2">s and |ζ(s)|</span></div></div><div class="plot"><canvas id="c"></canvas><svg id="o" style="position:absolute;inset:0;pointer-events:none"></svg></div>`);
    const s0 = -1, s1 = 2, t0 = 0, t1 = 35;
    let mark = null;
    const draw = () => {
      const c = $('c'), r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
      const cw = Math.max(80, Math.round(r.width / 1.5)), chh = Math.max(80, Math.round(r.height / 1.5));
      c.width = cw; c.height = chh; c.style.imageRendering = 'pixelated';
      const ctx2 = c.getContext('2d'), img = ctx2.createImageData(cw, chh);
      const dark = theme.isDark();
      const hex = (v) => { const h = css(v).replace('#', ''); return [0, 2, 4].map((k) => parseInt(h.slice(k, k + 2), 16)); };
      const cRe = hex('--claim'), cIm = hex('--accent');
      const re = new Float64Array(cw * chh), im = new Float64Array(cw * chh), ab = new Float64Array(cw * chh);
      for (let j = 0; j < chh; j++) for (let i = 0; i < cw; i++) {
        const z = R.zeta([s0 + (s1 - s0) * (i + 0.5) / cw, t1 - (t1 - t0) * (j + 0.5) / chh]), k = j * cw + i;
        re[k] = z[0]; im[k] = z[1]; ab[k] = Math.log10(Math.max(1e-6, Math.hypot(z[0], z[1])));
      }
      const flip = (a, k) => { const i = k % cw, j = (k / cw) | 0; return (i + 1 < cw && a[k] * a[k + 1] < 0) || (j + 1 < chh && a[k] * a[k + cw] < 0); };
      for (let k = 0; k < cw * chh; k++) {
        const l = Math.max(0, Math.min(1, (ab[k] + 1.5) / 2.5));            // 0 near a zero … 1 near the pole
        let px = dark ? [14 + 40 * l, 14 + 40 * l, 14 + 44 * l] : [255 - 70 * (1 - l), 255 - 66 * (1 - l), 255 - 50 * (1 - l)];
        if (flip(re, k)) px = cRe; else if (flip(im, k)) px = cIm;
        const o = 4 * k; img.data[o] = px[0]; img.data[o + 1] = px[1]; img.data[o + 2] = px[2]; img.data[o + 3] = 255;
      }
      ctx2.putImageData(img, 0, 0);
      grid = { cw, chh, w: r.width, h: r.height };
      overlay();
    };
    let grid = null;
    const X = (s) => (s - s0) / (s1 - s0) * grid.w, Y = (t) => (t1 - t) / (t1 - t0) * grid.h;
    const overlay = () => {
      const o = $('o'), W = grid.w, H = grid.h; o.setAttribute('viewBox', `0 0 ${W} ${H}`);
      let g = `<line x1="${X(0.5)}" x2="${X(0.5)}" y1="0" y2="${H}" stroke="${css('--fg')}" stroke-dasharray="3 4" opacity="0.5"/>`;
      for (const s of [0, 1]) g += `<line x1="${X(s)}" x2="${X(s)}" y1="0" y2="${H}" stroke="${css('--fg')}" opacity="0.25"/>`;
      for (const [s, l] of [[-1, '−1'], [0, '0'], [0.5, '½'], [1, '1'], [2, '2']]) g += `<text x="${X(s) + 3}" y="${H - 4}" font-size="9">${l}</text>`;
      for (const t of [10, 20, 30]) g += `<text x="3" y="${Y(t) + 3}" font-size="9">${t}i</text>`;
      g += `<text x="${X(1) + 4}" y="${H - 16}" font-size="9">pole</text><g class="cur"></g>`;
      o.innerHTML = g;
      if (!mark) return;
      const s = cellS(mark), z = R.zeta(s), gx = X(s[0]), gy = Y(s[1]), cg = o.querySelector('g.cur');
      cg.innerHTML = `<line x1="${gx}" x2="${gx}" y1="0" y2="${H}" stroke="${css('--fg')}" stroke-opacity="0.4" stroke-dasharray="2 3"/><line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="${css('--fg')}" stroke-opacity="0.4" stroke-dasharray="2 3"/><circle cx="${gx}" cy="${gy}" r="6" fill="none" stroke="${css('--fg')}" stroke-width="2"/>`;
      tip(cg, gx, gy, [{ text: `s = ${s[0].toFixed(3)} + ${s[1].toFixed(3)}i` }, { text: `Re ζ = ${z[0].toFixed(4)}`, color: css('--claim') }, { text: `Im ζ = ${z[1].toFixed(4)}`, color: css('--accent') }, { text: `|ζ| = ${Math.hypot(z[0], z[1]).toFixed(4)}` }], W, H);
      const near = ZEROS.find((g) => Math.abs(g - s[1]) < 0.9 && Math.abs(s[0] - 0.5) < 0.12);
      $('r1').textContent = `${s[0].toFixed(2)} + ${s[1].toFixed(2)}i`;
      $('r2').textContent = `|ζ| = ${Math.hypot(z[0], z[1]).toFixed(3)}` + (near ? ` · near the zero ½ + ${near.toFixed(4)}i` : '');
      if (near) ctx.done();
    };
    // the data points are the grid cells: the cursor snaps to a cell centre, and arrow keys walk cells (shift: 10)
    const cellS = ([i, j]) => [s0 + (s1 - s0) * (i + 0.5) / grid.cw, t1 - (t1 - t0) * (j + 0.5) / grid.chh];
    const c = $('c');
    c.tabIndex = 0; c.style.touchAction = 'none'; noSelect(c); noSelect($('o'));
    const at = (e) => { const b = c.getBoundingClientRect(); mark = [Math.max(0, Math.min(grid.cw - 1, Math.floor((e.clientX - b.left) / b.width * grid.cw))), Math.max(0, Math.min(grid.chh - 1, Math.floor((e.clientY - b.top) / b.height * grid.chh)))]; overlay(); };
    c.onpointerdown = (e) => { c.setPointerCapture?.(e.pointerId); at(e); };
    c.onpointermove = (e) => { if (e.pointerType === 'mouse' || e.buttons) at(e); };
    c.onkeydown = (e) => {
      const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!d) return; e.preventDefault(); e.stopPropagation();
      const k = e.shiftKey ? 10 : 1; mark = mark || [Math.floor(grid.cw / 2), Math.floor(grid.chh / 2)];
      mark = [Math.max(0, Math.min(grid.cw - 1, mark[0] + d[0] * k)), Math.max(0, Math.min(grid.chh - 1, mark[1] + d[1] * k))]; overlay();
    };
    draw(); return { resize: draw };
  },
},
{

      $('p').setAttribute('viewBox', `0 0 ${f.W} ${f.H}`); $('p').innerHTML = g;
      cursor($('p'), f, [{ name: 'a_p/2√p', color: css('--accent'), pts }], { snap: 'xy', head: (q) => `p = ${q[0]}` });
      $('r1').textContent = pts.length; $('r2').textContent = pts.filter((q) => Math.abs(q[1]) > 1).length;
      $('st').classList.toggle('on', showST);
      if (pts.length >= 1000) ctx.done();
    };
    $('add').onclick = () => { add(200); draw(); };
    $('st').onclick = () => { showST = !showST; draw(); };
    add(200); draw(); return { resize: draw };
  },
},
{
  ch: 'where it\'s true', t: 'Stepanov\'s trick: multiplicity',
  cap: 'To show a curve has few points, build a polynomial that vanishes at every point to high order. A polynomial of degree D can only vanish k times to order m if k·m ≤ D.',
  do: 'Raise the multiplicity and watch the degree it costs.',
  notes: `<h3>The idea (1969)</h3><p>Stepanov wanted to bound the number of points k on a curve over 𝔽_q. He built an auxiliary polynomial with two properties: it vanishes to order m at every point of the curve, and its degree D is not much larger than about √q · m. Then k · m ≤ D gives k ≲ q + O(√q), which is the Riemann hypothesis for the curve, by elementary algebra. Bombieri extended it to every curve in 1973.</p><h3>The obstacle over ℤ</h3><p>The trick needs "vanishing to order m", which means derivatives. Over 𝔽_q you can differentiate polynomials. Over the integers there is no good notion of differentiating a number, so the method seemed stuck there for fifty years.</p><h3>The 2026 claim</h3><p>The November 2026 note says it found a substitute: chains of <i>theta lifts</i> between automorphic forms, each lift buying one order of multiplicity, about √X lifts for primes up to X. That is its claim, not something this deck can check.</p>`,
  mount(el, ctx) {
    el.innerHTML = W(`<div class="ctl">${knob('km', 'order m', 1, 6, 1, 1)}${knob('kk', 'points k', 2, 6, 1, 4)}</div><div class="read"><div><b id="r1"></b><span>degree needed = k · m</span></div></div><div class="plot"><svg id="p"></svg></div>`);
    const draw = () => {
      const m = +$('km').value, k = +$('kk').value; $('kmo').textContent = m; $('kko').textContent = k;
      const roots = Array.from({ length: k }, (_, i) => -1 + 2 * (i + 0.5) / k);
      const P = (x) => roots.reduce((a, r) => a * (x - r) ** m, 1);
      const pts = []; let mx = 0; for (let i = 0; i <= 500; i++) { const x = -1.05 + 2.1 * i / 500, v = P(x); pts.push([x, v]); mx = Math.max(mx, Math.abs(v)); }
      const sc = pts.map(([x, v]) => [x, Math.sign(v) * Math.pow(Math.abs(v) / mx, 1 / (k * m) * 2)]);
      const f = frame($('p'), { x: [-1.05, 1.05], y: [-1.1, 1.1] });
      let g = `<line x1="${f.pad.l}" x2="${f.W - f.pad.r}" y1="${f.Y(0)}" y2="${f.Y(0)}" stroke="${css('--rule')}"/>`;
      g += `<path d="${path(sc, f.X, f.Y)}" fill="none" stroke="${css('--accent')}" stroke-width="2"/>`;
      for (const r of roots) g += `<circle cx="${f.X(r)}" cy="${f.Y(0)}" r="${3 + m}" fill="none" stroke="${css('--claim')}" stroke-width="2"/>`;
      g += `<text x="${f.pad.l}" y="${f.pad.t + 10}" font-size="9">P(x) = ∏ (x − aᵢ)^${m}, shape only</text>`;
      $('p').setAttribute('viewBox', `0 0 ${f.W} ${f.H}`); $('p').innerHTML = g;
      cursor($('p'), f, [{ name: 'P (shape)', color: css('--accent'), pts: sc }, { name: 'root', color: css('--claim'), pts: roots.map((r) => [r, 0, `order ${m}`]) }], { xfmt: (v) => `x = ${v.toFixed(3)}`, yfmt: (v) => v.toFixed(3) });
      $('r1').textContent = k * m;
      if (m >= 4) ctx.done();
    };
    $('km').oninput = draw; $('kk').oninput = draw; draw(); return { resize: draw };
  },
},
{
  ch: '2026', t: 'The claim, and what\'s in the box',
  cap: 'On 20 November 2026 a mathematician announced a proof of RH and GRH found with Claude, published only as a Lean project. Here is what a static read of it shows.',
  do: 'Pull the sheet up and read what would settle it.',
  notes: `<h3>What was announced</h3><p>A four-page note (alpo.ge/remark.pdf) and a Lean project in fourteen parts. No paper: the author says a full write-up ran past 250,000 pages, and that "Claude far outpaced me near the finish line".</p><h3>What a text read shows</h3><p>The headline theorem is <code>riemannHypothesis : RiemannHypothesis</code>, and <code>RiemannHypothesis</code> is Mathlib's own definition. So the statement is right, which is the commonest place formal "proofs" go wrong. There is no new <code>axiom</code>, no <code>sorry</code>, and no <code>native_decide</code>.</p><h3>What would settle it</h3><p>Build it with the pinned Lean and Mathlib, run <code>#print axioms</code>, which should list only propext, Classical.choice and Quot.sound, and replay the result with an independent checker. That is days of machine time. It has not been reported, and this site did not do it. Until then: <b>unverified</b>.</p><p>Then comes the part no kernel does: understanding why it's true.</p>`,
  mount(el, ctx) {
    el.innerHTML = W(`<div class="tiles" id="tl"><div class="tile"><div class="v">…</div><div class="l">loading the audit</div></div></div><ul class="chk" id="ck"></ul>`);
    fetch('../audit.json').then((r) => r.json()).then((A) => {
      const z = (k) => A.patterns.find((p) => p.pattern === k)?.files === 0;
      $('tl').innerHTML = `<div class="tile"><div class="v">${(A.lines / 1e6).toFixed(1)}M</div><div class="l">lines of Lean</div></div><div class="tile"><div class="v">${A.files.toLocaleString('en-US')}</div><div class="l">files</div></div>`;
      $('ck').innerHTML = `<li class="y">Proves Mathlib's <code>RiemannHypothesis</code></li><li class="${z('axiom') ? 'y' : 'n'}">no new axioms</li><li class="${z('sorry') ? 'y' : 'n'}">no sorry</li><li class="${z('native_decide') ? 'y' : 'n'}">no native_decide</li><li class="n">built and kernel-checked</li><li class="n">#print axioms</li><li class="n">independent replay</li><li class="n">human-readable proof</li>`;
    }).catch(() => { $('tl').innerHTML = '<div class="tile">audit.json did not load</div>'; });
    return { onFull: () => ctx.done() };
  },
},
{
  ch: 'recall', t: 'Five questions, from memory',
  cap: 'Retrieval is where learning sticks. Answer without scrolling back; each answer links to its slide.',
  do: 'Answer all five.',
  notes: `<h3>Why a quiz</h3><p>Pulling something out of memory strengthens it far more than reading it again: that is the testing effect. The predictions on earlier slides did a version of this before the reveal. This does it after.</p><p>Your answers and progress are kept only in this browser.</p>`,
  mount(el, ctx) {
    const Q = [
      { q: 'How many zeros of ζ have 0 < t ≤ 100?', o: ['10', '29', '649'], a: 1, s: 8 },
      { q: 'RH is equivalent to an error in counting primes of about…', o: ['x / log x', '√x · log x', 'log x'], a: 1, s: 2 },
      { q: 'For y² = x³ + ax + b mod p, the count is always within … of p + 1.', o: ['√p', '2√p', 'p / 2'], a: 1, s: 13 },
      { q: 'Gaps between consecutive zeros look like…', o: ['random (Poisson)', 'random-matrix eigenvalues', 'all equal'], a: 1, s: 9 },
      { q: 'What has been checked about the November 2026 Lean proof?', o: ['It was built and verified', 'Its statement is Mathlib\'s RH and it has no sorry or axioms, but nobody has reported a build', 'Nothing'], a: 1, s: 15 },
    ];
    const ans = S.quiz || (S.quiz = {});
    const render = () => {
      el.innerHTML = W(`<div class="ctl quiz" style="overflow-y:auto;flex:1 1 0;font-family:var(--serif);font-size:0.85rem;color:var(--fg)">` + Q.map((q, i) => `<div class="q pred" style="border-color:var(--rule);background:var(--bg)"><div>${esc(q.q)}</div><div class="opts">${q.o.map((o, j) => `<button data-q="${i}" data-o="${j}" class="${ans[i] === undefined ? '' : j === q.a ? 'right' : j === ans[i] ? 'wrong' : ''}">${esc(o)}</button>`).join('')}</div>${ans[i] !== undefined ? `<div class="why"><a href="#${q.s + 1}" style="color:var(--accent)">revisit slide ${q.s + 1} →</a></div>` : ''}</div>`).join('') +
        `<p style="font-family:var(--mono);font-size:0.7rem">${Object.keys(ans).length}/5 answered · ${Object.entries(ans).filter(([i, v]) => Q[i].a === v).length} right</p></div>`);
      el.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => { ans[+b.dataset.q] = +b.dataset.o; save(); render(); if (Object.keys(ans).length === 5) ctx.done(); });
    };
    render(); return {};
  },
},
];

// ----------------------------------------------------------- the deck ---
const stage = $('stage'), sheet = $('sheet'), sbody = $('sbody');
let live = null, full = false;
$('bars').innerHTML = SLIDES.map((_, i) => `<i data-i="${i}"></i>`).join('');
$('bars').querySelectorAll('i').forEach((b) => b.onclick = () => go(+b.dataset.i));
$('toc').innerHTML = SLIDES.map((s, i) => `<li data-i="${i}">${esc(s.t)}</li>`).join('');
$('toc').querySelectorAll('li').forEach((li) => li.onclick = () => go(+li.dataset.i));

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1300); }

function setPeek() {
  if (full) return;
  // peek height = the sheet's content, capped
  sheet.style.height = 'auto';
  const h = Math.min(sheet.scrollHeight, $('device').clientHeight * 0.46);
  sheet.style.height = h + 'px';
  document.documentElement.style.setProperty('--peek', h + 'px');
}
function setFull(on) {
  full = on;
  sheet.classList.toggle('full', on);
  stage.classList.toggle('dim', on);
  if (on) { sheet.style.height = ($('device').clientHeight * 0.88) + 'px'; live?.onFull?.(); }
  else { sbody.scrollTop = 0; requestAnimationFrame(setPeek); }
  const m = sbody.querySelector('.more'); if (m) m.textContent = on ? '▾ close the notes' : '▴ lecture notes';
}

function renderSheet(i) {
  const s = SLIDES[i];
  const done = !!S.done[i];
  let h = `<h2>${esc(s.t)}</h2><p class="cap">${esc(s.cap)}</p>`;
  if (s.pred) {
    const p = S.pred[i];
    h += `<div class="pred"><div class="k">predict first</div>${esc(s.pred.q)}<div class="opts">${s.pred.opts.map((o, j) => `<button data-p="${j}" class="${p === undefined ? '' : j === s.pred.a ? 'right' : j === p ? 'wrong' : ''}">${esc(o)}</button>`).join('')}</div>${p !== undefined ? `<div class="why">${p === s.pred.a ? '✓ ' : ''}${esc(s.pred.why)}</div>` : ''}</div>`;
  }
  h += `<div class="do ${done ? 'done' : ''}"><span class="ic">${done ? '✓' : '→'}</span><span>${esc(s.do)}</span></div>`;
  h += `<button class="more">${full ? '▾ close the notes' : '▴ lecture notes'}</button><div class="notes">${s.notes}</div>`;
  sbody.innerHTML = h;
  sbody.querySelector('.more').onclick = () => setFull(!full);
  sbody.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { if (S.pred[i] !== undefined) return; S.pred[i] = +b.dataset.p; save(); renderSheet(i); requestAnimationFrame(setPeek); });
}

function go(i) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  live?.destroy?.();
  S.i = i; save();
  if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  if (full) setFull(false);
  renderSheet(i);
  $('ch').textContent = `${SLIDES[i].ch}`;
  $('pos').textContent = `${i + 1} / ${SLIDES.length}`;
  $('prev').disabled = i === 0;
  $('next').textContent = i === SLIDES.length - 1 ? 'back to start' : 'next →';
  $('bars').querySelectorAll('i').forEach((b, j) => { b.className = j < i ? 'past' : j === i ? 'cur' : ''; });
  $('toc').querySelectorAll('li').forEach((li, j) => { li.classList.toggle('cur', j === i); li.classList.toggle('done', !!S.done[j]); });
  setPeek();
  stage.innerHTML = '';
  const ctx = { done: () => { if (S.done[i]) return; S.done[i] = true; save(); toast('done ✓'); const d = sbody.querySelector('.do'); if (d) { d.classList.add('done'); d.querySelector('.ic').textContent = '✓'; } $('toc').querySelectorAll('li')[i]?.classList.add('done'); } };
  requestAnimationFrame(() => { live = SLIDES[i].mount(stage, ctx) || {}; });
}

$('prev').onclick = () => go(S.i - 1);
$('next').onclick = () => go(S.i === SLIDES.length - 1 ? 0 : S.i + 1);
addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(S.i + 1); if (e.key === 'ArrowLeft') go(S.i - 1); if (e.key === 'Escape' && full) setFull(false); });
addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== S.i) go(n - 1); });

// drag the sheet: up opens the notes, down closes; a horizontal swipe on the handle or caption turns the page
{
  let y0 = null, x0 = null, h0 = 0, moved = false;
  const start = (e) => { const p = e.touches ? e.touches[0] : e; y0 = p.clientY; x0 = p.clientX; h0 = sheet.getBoundingClientRect().height; moved = false; sheet.style.transition = 'none'; };
  const move = (e) => {
    if (y0 === null) return; const p = e.touches ? e.touches[0] : e;
    const dy = p.clientY - y0, dx = p.clientX - x0;
    if (Math.abs(dy) > 6 && Math.abs(dy) > Math.abs(dx)) { moved = true; sheet.style.height = Math.max(80, Math.min($('device').clientHeight * 0.9, h0 - dy)) + 'px'; }
  };
  const end = (e) => {
    if (y0 === null) return; const p = e.changedTouches ? e.changedTouches[0] : e;
    const dy = p.clientY - y0, dx = p.clientX - x0; sheet.style.transition = '';
    if (!moved && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(S.i + (dx < 0 ? 1 : -1));
    else if (moved) setFull(dy < -40 ? true : dy > 40 ? false : full);
    else setFull(!full);
    y0 = null;
  };
  for (const el of [$('handle')]) { el.addEventListener('touchstart', start, { passive: true }); el.addEventListener('touchmove', move, { passive: true }); el.addEventListener('touchend', end); el.addEventListener('mousedown', start); }
  addEventListener('mousemove', move); addEventListener('mouseup', (e) => { if (y0 !== null) end(e); });
  // horizontal swipe anywhere on the caption area turns the page (not on the widget, which needs its own gestures)
  let sx = null, sy = null;
  sbody.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  sbody.addEventListener('touchend', (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy) && !full) go(S.i + (dx < 0 ? 1 : -1)); sx = null; });
}

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (full) sheet.style.height = ($('device').clientHeight * 0.88) + 'px'; else setPeek(); live?.resize?.(); }, 120); });
theme.mount($('theme'));
theme.onChange(() => live?.resize?.());
const start = parseInt(location.hash.slice(1), 10);
go(start ? start - 1 : S.i);
</script>
</body>
</html>
