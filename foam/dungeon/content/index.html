<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04060a" />
<title>foam — content forge</title>
<meta name="description" content="Tune a foam dungeon's furnishing: sliders for loot, traps, obstacles, enemies, toughness, and the danger direction — live on the map, exportable, crawlable." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,3 28,10 28,22 16,29 4,22 4,10' fill='none' stroke='%23ffce78' stroke-width='2.5'/%3E%3Cpath d='M10 16 h12 M16 10 v12' stroke='%237fd8d0' stroke-width='2'/%3E%3C/svg%3E" />
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.min.js" } }</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #04060a; color: #cfe8e4; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }

  #title { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 10px; pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 2; }
  #title b { color: #cffff8; letter-spacing: .04em; }
  #title .dim { color: #5f7a80; font-size: 11px; }
  #title a { color: #7fd8d0; pointer-events: auto; }

  #c3 { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #planc { max-width: calc(100vw - 300px); max-height: 94vh; border: 1px solid #1c2b31; border-radius: 10px; background: #04060a; }
  #viewseg { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 10px; display: flex; gap: 8px; z-index: 3; }
  .chip { background: rgba(127,216,208,.08); border: 1px solid #1c2b31; border-radius: 8px; color: #9fc9c4; padding: 6px 12px; font: 12px ui-monospace, monospace; cursor: pointer; user-select: none; }
  .chip.on { border-color: #7fd8d0; color: #cffff8; background: rgba(127,216,208,.16); }

  #panel { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; width: 258px;
    background: rgba(6,10,14,.88); border: 1px solid #1c2b31; border-radius: 12px; padding: 12px 16px;
    backdrop-filter: blur(4px); max-height: calc(100vh - 20px); overflow-y: auto; }
  #panel h2 { margin: 0 0 4px; font-size: 12px; color: #7fd8d0; letter-spacing: .08em; font-weight: 600; }
  #panel h2 span { float: right; color: #48606a; font-weight: 400; letter-spacing: 0; }
  #sheetChev { display: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 0; }
  .row label { color: #9fc9c4; font-size: 12px; flex: 0 0 72px; }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: #7fd8d0; }
  .row .val { color: #ffce78; min-width: 34px; text-align: right; flex-shrink: 0; font-size: 12px; }
  .grad .val { color: #8fd3ff; }
  .btn { width: 100%; margin-top: 8px; padding: 9px; font: 12px ui-monospace, monospace; background: rgba(127,216,208,.14); color: #cffff8; border: 1px solid #7fd8d0; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: rgba(127,216,208,.24); }
  .btn.ghost { background: none; border-color: #1c2b31; color: #9fc9c4; }
  .btn.amber { border-color: #ffce78; color: #ffe9c0; background: rgba(255,206,120,.12); }
  #tally { margin-top: 10px; font-size: 11px; color: #5f7a80; line-height: 1.7; }
  #tally b { color: #9fc9c4; }
  #tally .warn { color: #ff9e6e; }
  hr { border: none; border-top: 1px solid #14252b; margin: 10px 0; }

  #busy { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4,6,10,.6); z-index: 20; }
  #busy.on { display: flex; }
  #busy div { background: #070c12; border: 1px solid #1c2b31; border-radius: 10px; padding: 12px 22px; color: #7fd8d0; }

  @media (max-width: 720px) {
    #title .dim { display: none; }
    #planc { max-width: 96vw; max-height: 56vh; }
    #wrap { align-items: flex-start; padding-top: 52px; }
    #panel { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 40vh;
      overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: 14px 14px 0 0;
      border-bottom: none; padding: 0 16px calc(12px + env(safe-area-inset-bottom));
      transition: transform .22s ease; }
    #panel.collapsed { transform: translateY(calc(100% - 46px)); overflow: hidden; }
    #sheetHead { position: sticky; top: 0; margin: 0 -16px 8px; padding: 14px 16px 10px;
      background: rgba(6,10,14,.97); cursor: pointer; user-select: none; z-index: 1; }
    #sheetChev { display: inline-block; float: right; color: #7fd8d0; transition: transform .22s ease; }
    #panel.collapsed #sheetChev { transform: rotate(180deg); }
    .row input[type=range] { height: 26px; }
    .btn { padding: 11px; font-size: 13px; }
    #viewseg { bottom: calc(52px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="title">
  <b>foam · content forge</b> <span class="dim">— same map, your furnishing</span><br>
  <span class="dim"><a href="../" id="genlink">← generator</a> · the map never changes here</span>
</div>

<canvas id="c3"></canvas>
<div id="wrap" style="display:none"><canvas id="planc"></canvas></div>
<div id="viewseg">
  <span class="chip on" id="view3d">3d</span>
  <span class="chip" id="viewPlan">⊞ plan</span>
</div>

<div id="panel">
  <h2 id="sheetHead">CONTENT<span id="rollLabel">roll 1</span><span id="sheetChev">⌄</span></h2>
  <div class="row"><label>loot</label><input id="s_loot" type="range" min="0" max="2" step="0.1" value="1"><span class="val" id="v_loot">1.0</span></div>
  <div class="row"><label>traps</label><input id="s_traps" type="range" min="0" max="2" step="0.1" value="1"><span class="val" id="v_traps">1.0</span></div>
  <div class="row"><label>obstacles</label><input id="s_obstacles" type="range" min="0" max="2" step="0.1" value="1"><span class="val" id="v_obstacles">1.0</span></div>
  <div class="row"><label>enemies</label><input id="s_enemies" type="range" min="0" max="2" step="0.1" value="1"><span class="val" id="v_enemies">1.0</span></div>
  <div class="row"><label>toughness</label><input id="s_toughness" type="range" min="0" max="2" step="0.1" value="1"><span class="val" id="v_toughness">1.0</span></div>
  <div class="row grad"><label>direction</label><input id="s_gradient" type="range" min="-1" max="1" step="0.1" value="1"><span class="val" id="v_gradient">deep</span></div>
  <button class="btn ghost" id="reroll">⚄ reroll content</button>
  <button class="btn ghost" id="reset">reset dials</button>
  <hr>
  <button class="btn amber" id="crawlBtn">⚔ crawl this furnishing</button>
  <button class="btn ghost" id="expBtn">⤓ content .json</button>
  <div id="tally"></div>
</div>

<div id="busy"><div>weaving the foam…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '../../vendor/OrbitControls.js';
import { generateDungeon, DUNGEON_VERSION, SIZES, TILE_SHAPES } from '../../dungeon.mjs';
import { dungeonToJSON } from '../../dungeon-export.mjs';
import { rollContent, contentBlocked, DEFAULT_TUNING, tuningToParam, tuningFromParam, ENEMY_TYPES } from '../../dungeon-content.mjs';
import { crawlReport } from '../../dungeon-crawl.mjs';
import { drawPlan, PATH_COLORS } from '../../dungeon-plan.mjs';

const $ = (id) => document.getElementById(id);
const params = { seed: 1, n: 3, shape: 'grid', scale: 0.35, size: 'm', roll: 1 };
let tuning = { ...DEFAULT_TUNING };
{
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('seed')) params.seed = Math.max(1, parseInt(h.get('seed'), 10) || 1);
  if (h.get('n')) params.n = Math.min(6, Math.max(1, parseInt(h.get('n'), 10) || 3));
  if (TILE_SHAPES.includes(h.get('shape'))) params.shape = h.get('shape');
  if (h.get('scale')) params.scale = Math.min(1, Math.max(0.08, parseFloat(h.get('scale')) || 0.35));
  if (SIZES[h.get('size')]) params.size = h.get('size');
  if (h.get('roll')) params.roll = Math.max(1, parseInt(h.get('roll'), 10) || 1);
  params.twin = h.get('twin') === '1';
  tuning = tuningFromParam(h.get('tune'));
}

let dungeon = null, J = null, content = null;

function hash() {
  const tune = tuningToParam(tuning);
  return '#seed=' + params.seed + '&n=' + params.n + '&shape=' + params.shape +
    '&scale=' + params.scale + '&size=' + params.size + '&roll=' + params.roll +
    (params.twin ? '&twin=1' : '') +
    (tune ? '&tune=' + tune : '') + '&v=' + DUNGEON_VERSION;
}
function writeHash() {
  history.replaceState(null, '', hash());
  $('genlink').href = '../' + hash();
}

function retune() {
  content = rollContent(J, { roll: params.roll, tuning });
  if (view === 'plan') draw(); else build3d();
  tally(); writeHash();
  $('rollLabel').textContent = 'roll ' + params.roll;
}

// ------------------------------------------------------------- 3D view -----
// the schematic collapses when a tangled map stacks rooms in plan — the 3D
// CAD view is the primary; the plan is a chip away
const css = (c) => new THREE.Color(c);
const renderer = new THREE.WebGLRenderer({ canvas: $('c3'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = css('#04060a');
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 800);
const controls = new OrbitControls(camera, $('c3'));
controls.enableDamping = true; controls.dampingFactor = 0.08;
function resize3d() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize3d); resize3d();
let group = null, spinners = [], framed = false;
let view = '3d';
function pyramid(size, h, color, down, wire = false) {
  const g = new THREE.ConeGeometry(size, h, 4);
  const m = wire
    ? new THREE.LineSegments(new THREE.WireframeGeometry(g), new THREE.LineBasicMaterial({ color: css(color) }))
    : new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: css(color) }));
  if (down) m.rotation.z = Math.PI;
  return m;
}
function hexCorner(x, z, R, kk) {
  const a = Math.PI / 180 * (60 * kk - 30);
  return [x + R * Math.cos(a), z + R * Math.sin(a)];
}
function build3d() {
  if (group) { group.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); }); scene.remove(group); }
  group = new THREE.Group(); spinners = [];
  const s = dungeon.tileSize;
  const fxOf = new Map(content.effects.map((e) => [e.room + ':' + e.tile, e]));
  let dMax = 1;
  for (const r of dungeon.rooms) dMax = Math.max(dMax, r.depth);
  // tiles, content in the fills
  const pos = [], col = [];
  for (const r of dungeon.rooms) {
    const t01 = r.depth / dMax;
    const base = r.secret ? [0.16, 0.19, 0.30] : [0.36 - 0.26 * t01, 0.62 - 0.42 * t01, 0.60 - 0.34 * t01];
    for (const t of r.tiles) {
      let c = base;
      const e = fxOf.get(r.id + ':' + t.key);
      if (e?.type === 'obstacle') c = [0.24, 0.30, 0.33];
      else if (e?.type === 'trap') c = [0.38, 0.14, 0.11];
      else if (t.kind === 'door') c = [1.0, 0.81, 0.47];
      else if (t.kind === 'entrance') c = [0.72, 1.0, 0.62];
      else if (t.kind === 'trapdoor') c = [0.04, 0.09, 0.11];
      else if (t.kind === 'hatch') c = [0.17, 0.38, 0.36];
      else if (t.kind === 'goal') { const pc = css(PATH_COLORS[(r.endpointIndex ?? 0) % PATH_COLORS.length]); c = [pc.r, pc.g, pc.b]; }
      let corners;
      if (t.poly) {
        corners = t.poly.map(([px, pz]) => [t.x + (px - t.x) * 0.94, t.z + (pz - t.z) * 0.94]);
      } else if (dungeon.tileShape === 'hex') {
        const R = (s / Math.sqrt(3)) * 0.94;
        corners = [0, 1, 2, 3, 4, 5].map((kk) => hexCorner(t.x, t.z, R, kk));
      } else {
        const hh = s * 0.46;
        corners = [[t.x - hh, t.z - hh], [t.x + hh, t.z - hh], [t.x + hh, t.z + hh], [t.x - hh, t.z + hh]];
      }
      for (let i = 1; i + 1 < corners.length; i++) {
        for (const [cx, cz] of [corners[0], corners[i], corners[i + 1]]) {
          pos.push(cx, t.y + 0.045, cz); col.push(c[0], c[1], c[2]);
        }
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  group.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.92, side: THREE.DoubleSide })));
  // room wireframes
  {
    const wp = [], seen = new Set();
    for (const r of dungeon.rooms) {
      for (const fi of dungeon.pocket.cells[r.cell].faces) {
        if (seen.has(fi)) continue; seen.add(fi);
        const v = dungeon.pocket.faces[fi].verts;
        for (let i = 0; i < v.length; i++) {
          const a = v[i], b = v[(i + 1) % v.length];
          wp.push(a[0], a[1], a[2], b[0], b[1], b[2]);
        }
      }
    }
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
    group.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: css('#2b6a72'), transparent: true, opacity: 0.4 })));
  }
  // markers: enemies, loot/treasure, one pyramid per tripwire, beacons
  const seenLines = new Set();
  for (const e of content.effects) {
    const t = dungeon.roomOf.get(e.room)?.tiles.find((x) => x.key === e.tile); if (!t) continue;
    if (e.type === 'trap') {
      if (e.line !== undefined && seenLines.has(e.line)) continue;
      if (e.line !== undefined) seenLines.add(e.line);
      const m = pyramid(s * 0.2, s * 0.4, '#ff6e5a', true);
      m.position.set(t.x, t.y + s * 0.6, t.z); spinners.push(m); group.add(m);
    } else if (e.type === 'obstacle') {
      const m = new THREE.Mesh(new THREE.OctahedronGeometry(s * 0.26, 0), new THREE.MeshBasicMaterial({ color: css('#3a4a52') }));
      m.position.set(t.x, t.y + s * 0.24, t.z); group.add(m);
    } else {
      const big = e.type === 'treasure';
      const m = pyramid(s * (big ? 0.28 : 0.16), s * (big ? 0.46 : 0.28), big ? '#ffdf9e' : '#d8a94e', false);
      m.position.set(t.x, t.y + s * (big ? 0.28 : 0.18), t.z); spinners.push(m); group.add(m);
    }
  }
  for (const a of content.agents) {
    const t = dungeon.roomOf.get(a.room)?.tiles.find((x) => x.key === a.tile); if (!t) continue;
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s * (0.15 + a.hp * 0.04), 0),
      new THREE.MeshBasicMaterial({ color: css(ENEMY_TYPES[a.type].color) }));
    m.position.set(t.x, t.y + s * 0.28, t.z); group.add(m);
  }
  const e0 = dungeon.roomOf.get(dungeon.entrance).centroid;
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, 6.5, 8),
    new THREE.MeshBasicMaterial({ color: css('#b8ff9e'), transparent: true, opacity: 0.6 }));
  beam.position.set(e0[0], e0[1] + 3.2, e0[2]);
  group.add(beam);
  scene.add(group);
  if (!framed) {
    framed = true;
    const bb = new THREE.Box3().setFromObject(group);
    const c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
    controls.target.copy(c);
    const rad = Math.max(sz.x, sz.z);
    camera.position.set(c.x + rad * 0.8, c.y + sz.y * 1.3 + 6, c.z + rad * 0.8);
    camera.far = rad * 12 + 200; camera.updateProjectionMatrix();
  }
}
(function loop() {
  requestAnimationFrame(loop);
  if (view === '3d') { for (const m of spinners) m.rotation.y += 0.02; controls.update(); renderer.render(scene, camera); }
})();

// view toggle
function setView(v) {
  view = v;
  $('c3').style.display = v === '3d' ? 'block' : 'none';
  $('wrap').style.display = v === 'plan' ? 'flex' : 'none';
  $('view3d').classList.toggle('on', v === '3d');
  $('viewPlan').classList.toggle('on', v === 'plan');
  if (v === 'plan') draw(); else build3d();
}
$('view3d').onclick = () => setView('3d');
$('viewPlan').onclick = () => setView('plan');

function draw() {
  const c = $('planc');
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const r of dungeon.rooms) for (const t of r.tiles) {
    x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x);
    z0 = Math.min(z0, t.z); z1 = Math.max(z1, t.z);
  }
  const pad = dungeon.tileSize * 1.5;
  x0 -= pad; x1 += pad; z0 -= pad; z1 += pad;
  const avail = Math.min(innerWidth - (matchMedia('(max-width: 720px)').matches ? 16 : 300), 1200);
  const availH = matchMedia('(max-width: 720px)').matches ? innerHeight * 0.56 : innerHeight * 0.94;
  const k = Math.min(avail / (x1 - x0), availH / (z1 - z0));
  const dpr = Math.min(devicePixelRatio, 2);
  c.width = Math.round((x1 - x0) * k * dpr); c.height = Math.round((z1 - z0) * k * dpr);
  c.style.width = ((x1 - x0) * k) + 'px';
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawPlan(ctx, { dungeon, content, k, ox: x0, oz: z0, w: c.width / dpr, h: c.height / dpr });
}

function tally() {
  const n = (t) => content.effects.filter((e) => e.type === t).length;
  const byType = {};
  for (const a of content.agents) byType[a.type] = (byType[a.type] ?? 0) + 1;
  const rep = crawlReport(J, { blocked: contentBlocked(content) });
  $('tally').innerHTML =
    '<b>' + n('loot') + '</b> caches · <b>' + n('treasure') + '</b> treasures<br>' +
    '<b>' + n('trap') + '</b> traps · <b>' + n('obstacle') + '</b> rubble<br>' +
    '<b>' + content.agents.length + '</b> enemies (' +
      Object.entries(byType).map(([k, v]) => v + ' ' + k).join(', ') + ')<br>' +
    (rep.complete ? 'crawlable: entrance → every endpoint ✓'
      : '<span class="warn">⚠ not fully crawlable</span>');
}

const DIALS = ['loot', 'traps', 'obstacles', 'enemies', 'toughness', 'gradient'];
function syncDials() {
  for (const d of DIALS) {
    $('s_' + d).value = tuning[d];
    $('v_' + d).textContent = d === 'gradient'
      ? (tuning[d] > 0.15 ? 'deep' : tuning[d] < -0.15 ? 'door' : 'flat') + ' ' + tuning[d].toFixed(1)
      : tuning[d].toFixed(1);
  }
}
for (const d of DIALS) {
  $('s_' + d).oninput = () => { tuning[d] = parseFloat($('s_' + d).value); syncDials(); retune(); };
}
$('reroll').onclick = () => { params.roll = 1 + Math.floor(Math.random() * 9998); retune(); };
$('reset').onclick = () => { tuning = { ...DEFAULT_TUNING }; syncDials(); retune(); };
$('crawlBtn').onclick = () => { location.href = '../crawl/' + hash(); };
$('expBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(content, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'foam-dungeon-content-s' + params.seed + '-r' + params.roll + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// mobile bottom sheet
const isMobile = () => matchMedia('(max-width: 720px)').matches;
$('sheetHead').onclick = () => { if (isMobile()) $('panel').classList.toggle('collapsed'); };
if (isMobile()) $('panel').classList.add('collapsed');
addEventListener('resize', () => { if (!isMobile()) $('panel').classList.remove('collapsed'); dungeon && draw(); });

window.__forge = { ready: false, get content() { return content; }, get tuning() { return { ...tuning }; },
  set: (d, v) => { tuning[d] = v; syncDials(); retune(); } };

$('busy').classList.add('on');
setTimeout(() => {
  try {
    dungeon = generateDungeon({ seed: params.seed, endpoints: params.n, tileShape: params.shape, tileScale: params.scale, size: params.size, twin: params.twin });
    J = dungeonToJSON(dungeon);
    syncDials(); retune();
    window.__forge.ready = true;
  } finally { $('busy').classList.remove('on'); }
}, 30);
</script>
</body>
</html>
