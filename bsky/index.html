<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>bsky — an AppView with no database</title>
<script>
/* Palette before first paint. Duplicating a few lines of lib/theme.js here is
   deliberate: a module import resolves after the first paint, which is exactly
   long enough to flash a white screen at someone who chose Midnight. */
(function () {
  var P = {
    midnight:['#0b0d12','#11141c','#1e2330','#171b25','#e6eaf1','#8590a8','#5c95ff','dark'],
    paper:['#fbfaf8','#ffffff','#e2e0da','#eeece7','#1b1e24','#5f6672','#1d5fd6','light'],
    sepia:['#f5edda','#fdf8ec','#ddd0b4','#eae0c8','#33291b','#6b5c46','#9a4c1a','light'],
    forest:['#0a1310','#0f1a16','#1d2f27','#16241e','#dfeae1','#7e9689','#4ade80','dark'],
    plum:['#120f1a','#191426','#2a2140','#201933','#e9e3f4','#948aae','#c084fc','dark'],
    ember:['#140f0c','#1c1512','#33251d','#261c17','#f0e6de','#a08d7e','#ff9448','dark'],
    mono:['#000000','#0c0c0c','#3a3a3a','#242424','#ffffff','#c2c2c2','#ffd400','dark']
  };
  var want; try { want = localStorage.getItem('bsky:palette'); } catch (e) {}
  if (!want || want === 'auto' || !P[want]) {
    want = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'midnight' : 'paper';
  }
  var p = P[want], r = document.documentElement, k = ['--bg','--panel','--line','--line-soft','--text','--muted','--accent'];
  for (var i = 0; i < k.length; i++) r.style.setProperty(k[i], p[i]);
  r.style.colorScheme = p[7];
  r.dataset.palette = want;
  document.addEventListener('DOMContentLoaded', function () {
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', p[0]);
  });
})();
</script>
<meta name="description" content="A Bluesky client that runs entirely in your browser. Algorithmic feeds, a live timeline with no backend, notifications from a public backlink index, and an archive that grows every visit.">
<style>
:root{
  --bg:#0b0d12; --panel:#11141c; --line:#1e2330; --line-soft:#171b25;
  --text:#e6eaf1; --muted:#79839a; --accent:#4c8dff; --live:#3ddc84; --dead:#e0576a;
  --tabbar:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* An explicit display: rule beats the UA stylesheet's [hidden]{display:none},
   so .chips (display:flex) stayed visible on other tabs. Make hidden win. */
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabbar) + var(--safe-b))}
a{color:var(--accent);text-decoration:none}
img{display:block}
.muted{color:var(--muted)}
button{font-family:inherit;font-size:15px;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;/* 16px stops iOS zooming on focus */
  background:#0a0c11;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px 12px;width:100%}
textarea{resize:none;line-height:1.4}

/* ── top bar ───────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:30;background:rgba(11,13,18,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tbrow{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:52px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.tbrow .spacer{margin-left:auto}
.pill{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;
  color:var(--muted);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.avatar-btn{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--line);flex:none}
.avatar-btn img{width:100%;height:100%;object-fit:cover}

/* horizontally scrolling feed chips — never wraps, never scrolls the page */
.chips{display:flex;gap:8px;padding:0 14px 11px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex:none;white-space:nowrap}

/* ── posts ─────────────────────────────────────────── */
.post{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line-soft)}
.post:active{background:#0e1118}
.pav{width:42px;height:42px;border-radius:50%;background:var(--line);flex:none;object-fit:cover}
.pbody{flex:1;min-width:0}
.phead{display:flex;align-items:baseline;gap:6px;font-size:14px;margin-bottom:2px}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.phandle{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptime{color:var(--muted);font-size:13px;margin-left:auto;flex:none}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.pembed{margin-top:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;display:inline-block}
.pacts{display:flex;gap:26px;margin-top:9px;color:var(--muted);font-size:13px}
.pacts button{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:5px;
  min-height:32px;min-width:44px}
.pacts button:active{color:var(--accent)}

/* ── media ─────────────────────────────────────────── */
.media{margin-top:9px;border-radius:11px;overflow:hidden;display:grid;gap:2px;background:var(--line)}
.media.grid-1{grid-template-columns:1fr}
.media.grid-2{grid-template-columns:1fr 1fr}
.media.grid-3,.media.grid-4{grid-template-columns:1fr 1fr}
.imgcell{display:block;background:var(--line);overflow:hidden;max-height:420px}
.imgcell img{width:100%;height:100%;object-fit:cover;display:block}
.media.video{position:relative;background:#000;max-height:460px}
.media.video video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.vfallback{position:absolute;left:10px;bottom:10px;font-size:12px;background:rgba(0,0,0,.66);
  padding:5px 10px;border-radius:999px;color:#fff}
.card{display:flex;flex-direction:column;margin-top:9px;border:1px solid var(--line);
  border-radius:11px;overflow:hidden;color:inherit}
.cardimg{width:100%;max-height:190px;object-fit:cover}
.cardtext{padding:10px 12px}
.cardhost{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.cardtitle{font-size:14px;font-weight:600;line-height:1.3}
.carddesc{font-size:13px;color:var(--muted);margin-top:4px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.quote{margin-top:9px;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.qhead{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:5px}
.qav{width:20px;height:20px;border-radius:50%;background:var(--line);object-fit:cover}
.qtext{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}

/* ── search results ────────────────────────────────── */
.actor{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.actor:active{background:#0e1118}
.aav{width:44px;height:44px;border-radius:50%;background:var(--line);flex:none;object-fit:cover}
.abody{flex:1;min-width:0}
.aname{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahandle{color:var(--muted);font-size:13px}
.adesc{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.searchbar{padding:11px 14px;border-bottom:1px solid var(--line)}

/* ── notifications ─────────────────────────────────── */
.notif{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.nicon{width:24px;flex:none;text-align:center;font-size:15px;padding-top:2px}
.nbody{flex:1;min-width:0;font-size:14px}
.nsub{color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ── profile ───────────────────────────────────────── */
.pbanner{width:100%;height:118px;object-fit:cover;background:var(--line);display:block}
.backbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}

/* ── profile / me ──────────────────────────────────── */
.phead-big{padding:16px 14px;border-bottom:1px solid var(--line)}
.pbig{width:66px;height:66px;border-radius:50%;background:var(--line);object-fit:cover;margin-bottom:10px}
.pdisp{font-size:19px;font-weight:700}
.phand{color:var(--muted);font-size:14px}
.pdesc{margin-top:9px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.pstats{display:flex;gap:16px;margin-top:11px;font-size:13px;color:var(--muted)}
.pstats b{color:var(--text)}
.section{padding:14px;border-bottom:1px solid var(--line)}
.section h3{font-size:13px;font-weight:600;margin-bottom:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
.section .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.section p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:9px}
.btn{background:var(--accent);color:#fff;border-radius:9px;padding:11px 16px;min-height:44px;
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400}
.btn:disabled{opacity:.42}

/* ── compose sheet ─────────────────────────────────── */
.fab{position:fixed;right:16px;bottom:calc(var(--tabbar) + var(--safe-b) + 16px);z-index:40;
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:23px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  padding-bottom:var(--safe-b)}
.sheet[hidden]{display:none}
.sheethead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.sheetbody{flex:1;padding:14px;overflow-y:auto}
.sheetbody textarea{min-height:180px;border:0;background:transparent;padding:0;font-size:17px}
.sheetfoot{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
#cc{font-size:13px;color:var(--muted);margin-left:auto}
#cc.over{color:var(--dead)}

/* ── tab bar ───────────────────────────────────────── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(11,13,18,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b)}
.tab{flex:1;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;letter-spacing:.02em}
.tab .ic{font-size:19px;line-height:1}
.tab.on{color:var(--accent)}

/* ── palette picker ────────────────────────────────── */
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.pal{border:1px solid var(--line);border-radius:10px;padding:9px;text-align:left;min-height:62px}
.pal.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pal .sw{display:flex;gap:4px;margin-bottom:7px}
.pal .sw i{width:15px;height:15px;border-radius:4px;display:block;border:1px solid rgba(128,128,128,.28)}
.pal .nm{font-size:12px;color:var(--muted)}
.pal.on .nm{color:var(--text)}

/* liked / reposted states */
.pacts button.on[data-act="like"]{color:var(--dead)}
.pacts button.on[data-act="repost"]{color:var(--live)}
.pacts button.busy{opacity:.5}

/* ── misc ──────────────────────────────────────────── */
.bar{padding:9px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:8px;min-height:38px}
.bar .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.bar .dot.live{background:var(--live)}
.empty{padding:36px 22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty strong{color:var(--text);display:block;margin-bottom:7px;font-size:15px}
.more{display:block;width:100%;padding:16px;color:var(--accent);font-size:14px;text-align:center}
.ta-wrap{position:relative;width:100%}
.ta-menu{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:70;list-style:none;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.55);max-height:52vh;overflow-y:auto}
.ta-menu li{display:flex;align-items:center;gap:9px;padding:11px 13px;font-size:14px;min-height:46px}
.ta-menu li.on{background:rgba(76,141,255,.15)}
.ta-menu img{width:26px;height:26px;border-radius:50%;background:var(--line);flex:none;object-fit:cover}
.ta-menu .d{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:640px){ body{max-width:600px;margin:0 auto;border-inline:1px solid var(--line)}
  .tabbar{max-width:600px;left:50%;transform:translateX(-50%)}
  .fab{right:calc(50% - 300px + 16px)} }
</style>
</head>
<body>

<header class="topbar">
  <div class="tbrow">
    <span class="brand">bsky<small id="brand-note">no database</small></span>
    <span class="spacer"></span>
    <button id="authbtn" class="pill">sign in</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="bar" id="statusbar"><span class="dot" id="dot"></span><span id="statustext">ready</span></div>

<main>
  <section id="v-home"></section>
  <section id="v-search" hidden></section>
  <section id="v-notifs" hidden></section>
  <section id="v-profile" hidden></section>
  <section id="v-me" hidden></section>
</main>

<button class="fab" id="fab" aria-label="write a post">✎</button>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Write a post">
  <div class="sheethead">
    <button id="sheet-cancel" class="pill">cancel</button>
    <span class="spacer"></span>
    <button id="sheet-post" class="btn" disabled>post</button>
  </div>
  <div class="sheetbody">
    <textarea id="ct" placeholder="What's up?" maxlength="3000"></textarea>
    <div id="cs" class="muted" style="font-size:13px;margin-top:10px"></div>
  </div>
  <div class="sheetfoot">
    <span class="muted" style="font-size:12.5px">posts to your own repo</span>
    <span id="cc">0/300</span>
  </div>
</div>

<nav class="tabbar">
  <button class="tab on" data-tab="home"><span class="ic">⌂</span>Home</button>
  <button class="tab" data-tab="search"><span class="ic">⌕</span>Search</button>
  <button class="tab" data-tab="notifs"><span class="ic">♡</span>Notifs</button>
  <button class="tab" data-tab="me"><span class="ic">☰</span>Me</button>
</nav>

<script type="module" src="/app.js"></script>
</body>
</html>
