<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper — Academic Wormhole Roulette</title>
<meta name="description" content="A full procedurally-generated journal article — abstract, sections, equations, a results table, and a reference list whose every citation opens another coherent fake paper. Generated fiction. Part of the Academic Wormhole Roulette.">
<meta property="og:title" content="A paper from the Academic Wormhole Roulette">
<meta property="og:description" content="A full procedurally-generated journal article whose references all open other coherent fake papers.">
<link rel="stylesheet" href="/paper.css">
</head>
<body>
<div class="toolbar">
  <span class="brand"><a href="/" title="Academic Wormhole Roulette">⌇ wormhole</a></span>
  <a id="field" href="/">↩ the field</a>
  <span class="grow"></span>
  <button id="tunnel" title="Open a random paper">↯ tunnel</button>
  <button id="share">🔗 link</button>
  <span class="copied" id="copied" hidden>copied</span>
  <button id="flora" title="Grow (or prune) the marginalia">❀ margins</button>
  <a id="herbarium" href="/flora" title="Explore the space of margins">herbarium</a>
  <button id="pdf" title="Save as PDF via your browser's print dialog">⤓ PDF</button>
  <span class="warn">generated fiction — cite nothing</span>
</div>

<article class="sheet" id="sheet" aria-live="polite"></article>
<div class="print-frame" id="printFrame" aria-hidden="true"></div>

<script src="/engine.js"></script>
<script src="/stats.js"></script>
<script src="/charts.js"></script>
<script src="/dataset.js"></script>
<script src="/genome.js"></script>
<script src="/analysis.js"></script>
<script src="/paper.js"></script>
<script src="/flora.js"></script>
<script src="/serpent.js"></script>
<script src="/margins.js"></script>
<script>
(function () {
  "use strict";
  var P = window.WORMHOLE_PAPER;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  function idFromUrl() {
    var m = location.pathname.match(/^\/p\/([^/]+)\/?$/);
    if (m) return decodeURIComponent(m[1]);
    return new URLSearchParams(location.search).get("id") || "1.f";
  }

  function affiliations(authors) {
    // dedupe affils, number them, superscript on authors
    var order = [], map = {};
    authors.forEach(function (a) { if (!(a.affil in map)) { map[a.affil] = order.length + 1; order.push(a.affil); } });
    var names = authors.map(function (a) {
      return esc(a.name) + '<sup>' + map[a.affil] + '</sup>';
    }).join(", ");
    var affils = order.map(function (af, i) { return '<span><sup>' + (i + 1) + '</sup> ' + esc(af) + '</span>'; }).join("");
    return { names: names, affils: affils };
  }

  function renderTable(t) {
    var head = "<tr>" + t.cols.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr>";
    var rows = t.rows.map(function (row) { return "<tr>" + row.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("");
    return '<div class="table-fig"><div class="cap"><b>Table 1.</b> ' + esc(t.caption) + '</div>' +
      '<table class="booktabs"><thead>' + head + "</thead><tbody>" + rows + "</tbody></table></div>";
  }
  function renderBody(p) {
    return p.sections.map(function (s, i) {
      var seenP = false;
      var inner = s.flow.map(function (it) {
        if (it.t === "p") { var cls = (!seenP || it.first) ? "first" : ""; seenP = true; return '<p class="' + cls + '">' + it.html + "</p>"; }
        if (it.t === "h3") {
          seenP = false;
          // the paper→genome bridge: each technique subsection links into /lab
          var body = it.tid
            ? '<a class="techlink" href="/lab/#' + encodeURIComponent(it.tid) + '-1" title="open this technique in the analysis genome">' + esc(it.text) + "</a>"
            : esc(it.text);
          return '<h3 class="subhead">' + body + "</h3>";
        }
        if (it.t === "eq") return '<div class="eq">' + it.html + '<span class="eqno">(' + it.num + ')</span></div>';
        if (it.t === "table") return renderTable(it);
        if (it.t === "fig") return '<figure class="fig' + (it.wide ? " wide" : "") + '">' + it.svg +
          '<figcaption><b>Figure ' + it.num + ".</b> " + it.caption + "</figcaption></figure>";
        return "";
      }).join("");
      return '<h2><span class="secno">' + (i + 1) + "</span>" + esc(s.title) + "</h2>" + inner;
    }).join("");
  }

  function renderRefs(p) {
    var items = p.references.map(function (r) {
      return '<div class="refitem" id="ref-' + r.num + '"><span class="rn">[' + r.num + ']</span> ' +
        esc(r.authors) + " (" + r.year + "). " +
        '<a class="paperlink" href="/p/' + encodeURIComponent(r.id) + '">' + esc(r.title) + "</a>. " +
        "<i>" + esc(r.journal) + "</i>, " + r.volume + (r.issue ? "(" + r.issue + ")" : "") + ", pp. " + esc(r.pages) + ". " +
        '<span class="doi">doi:' + esc(r.doi) + "</span>" +
        (r.sameField ? "" : ' <span class="xf" title="a citation reaching into another field">interdisc.</span>') +
        "</div>";
    }).join("");
    return '<div class="p-refs"><h2>References</h2>' + items + "</div>";
  }

  function render(id, push) {
    var p = P.generate(id);
    var h = p.header;
    var au = affiliations(h.authors);
    var html =
      '<div class="p-venue">' + esc(h.journal) + " · vol. " + h.volume + " (" + h.issue + ") · " + h.year +
      (p.shapeKicker ? ' <span class="kicker">' + esc(p.shapeKicker) + "</span>" : "") + "</div>" +
      '<h1 class="p-title">' + esc(h.title) + "</h1>" +
      '<div class="p-authors">' + au.names + "</div>" +
      '<div class="p-affils">' + au.affils + "</div>" +
      '<div class="p-meta">pp. ' + esc(h.pages) + " · doi:" + esc(h.doi) + " · cited " + h.citations + " times · open access</div>" +
      '<hr class="p-rule">' +
      '<div class="p-abstract"><span class="lbl">Abstract</span><p>' + esc(p.abstract) + "</p></div>" +
      '<div class="p-keywords"><b>Keywords:</b> ' + keywords(p) + "</div>" +
      '<div class="p-body">' + renderBody(p) + "</div>" +
      '<div class="p-acks"><h2>Acknowledgements</h2>' + p.acknowledgements + "</div>" +
      renderRefs(p) +
      '<div class="p-foot">Generated fiction from the Academic Wormhole Roulette — no real paper, person, DOI, or grant is described. ' +
      "Paper id <code>" + esc(p.id) + "</code>. Field: " + esc(p.field.name) + ". Same id → same paper, for ever.</div>";

    $("sheet").innerHTML = html;
    current = p;
    growMargins(true);
    $("field").setAttribute("href", "/f/" + encodeURIComponent(p.fieldSeed));
    $("field").textContent = "↩ " + p.field.name;
    document.title = h.title + " — Wormhole";
    if (push !== false) {
      var path = "/p/" + encodeURIComponent(id);
      if (location.pathname !== path) history.pushState({ id: id }, "", path);
    }
    window.scrollTo(0, 0);
  }

  // ---- the marginalia: a seeded garden in the margins (flora.js) ----
  // biome = the field, so a field's papers share inks and species;
  // specimen = the paper id, so each paper is its own arrangement, for ever.
  // FL is the margins dispatcher: each paper gets flora or serpents by a seeded coin
  var FL = window.WORMHOLE_MARGINS, current = null, lastDims = "", growGen = 0;
  var floraOn = (function () { try { return localStorage.getItem("wormhole-flora") !== "off"; } catch (e) { return true; } })();
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function floraGenome(p) { return FL.genome(p.id, p.fieldSeed); }
  function growMargins(animate) {
    var sheet = $("sheet");
    sheet.querySelectorAll("svg.flora").forEach(function (el) { el.remove(); });
    var gen = ++growGen;
    $("flora").classList.toggle("on", floraOn);
    var on = !!(FL && current && floraOn);
    document.body.classList.toggle("has-flora", on);
    // @page can't be conditioned on a class, so swap the rule itself
    var pr = $("pageRule") || document.head.appendChild(Object.assign(document.createElement("style"), { id: "pageRule" }));
    pr.textContent = on ? "@media print { @page { size: letter; margin: 14mm 0; } }" : "";
    if (!on) { $("printFrame").innerHTML = ""; lastDims = ""; growGen++; return; }
    var cs = getComputedStyle(sheet), W = sheet.offsetWidth, H = sheet.offsetHeight;
    var box = { x0: parseFloat(cs.paddingLeft), y0: parseFloat(cs.paddingTop),
      x1: W - parseFloat(cs.paddingRight), y1: H - parseFloat(cs.paddingBottom) };
    var g = floraGenome(current);
    var anim = animate && !reduceMotion;
    var out = FL.grow(g, { width: W, height: H, box: box }, { animate: anim, idPrefix: "s", tile: 1100 });
    lastDims = W + "x" + H;
    sheet.setAttribute("data-flora", out.genome.name);
    $("herbarium").setAttribute("href", "/flora#" + encodeURIComponent(current.id)); // this paper's specimen
    // insert tile by tile, top first, yielding between them: the text paints
    // at once and the garden grows in down the page
    var i = 0;
    (function next() {
      if (gen !== growGen || i >= out.tiles.length) return;
      var t = out.tiles[i++];
      sheet.insertAdjacentHTML("afterbegin", t.svg);
      var el = sheet.firstElementChild;
      if (anim) { el.classList.add("growing"); setTimeout(function () { el.classList.remove("growing"); }, 4200); }
      setTimeout(next, 16);
    })();
    // the print frame: one Letter page's worth of margin, repeated on every
    // printed page (position:fixed repeats per page in print)
    var pw = 816, ph = 1056 - 2 * 53, side = 128;
    // as one <img>: Chrome repeats a fixed element on every printed page but,
    // past page 1, drops the nested groups of an inline SVG; an image survives
    var frame = FL.grow(g, { width: pw, height: ph, box: { x0: side, y0: -20, x1: pw - side, y1: ph + 20 } },
      { animate: false, idPrefix: "pr" }).svg;
    $("printFrame").innerHTML = '<img alt="" width="' + pw + '" height="' + ph + '" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(frame) + '">';
  }
  if (window.ResizeObserver) {
    var rt = null;
    new ResizeObserver(function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        var s = $("sheet");
        if (floraOn && current && lastDims && lastDims !== s.offsetWidth + "x" + s.offsetHeight) growMargins(false);
      }, 180);
    }).observe($("sheet"));
  }
  $("flora").addEventListener("click", function () {
    floraOn = !floraOn;
    try { localStorage.setItem("wormhole-flora", floraOn ? "on" : "off"); } catch (e) {}
    growMargins(true);
  });

  function keywords(p) {
    // pull a few field terms for a keywords line
    var t = (window.WORMHOLE.generate(p.fieldSeed).subject.terms || []).slice(0, 4);
    return t.map(esc).join("; ");
  }

  function randomFieldSeed() { return String(Math.floor(Math.random() * 9e8) + 1); }

  // intercept reference clicks → tunnel in place (no reload)
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a.paperlink");
    if (a && a.getAttribute("href").indexOf("/p/") === 0) {
      e.preventDefault();
      var id = decodeURIComponent(a.getAttribute("href").slice(3));
      render(id, true);
    }
  });
  window.addEventListener("popstate", function () { render(idFromUrl(), false); });

  $("pdf").addEventListener("click", function () { window.print(); });
  $("tunnel").addEventListener("click", function () { render(randomFieldSeed() + ".f", true); });
  $("share").addEventListener("click", function () {
    var url = location.origin + location.pathname;
    var done = function () { var c = $("copied"); c.hidden = false; setTimeout(function () { c.hidden = true; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
    else prompt("Copy this link:", url);
  });

  render(idFromUrl(), false);
})();
</script>
</body>
</html>
