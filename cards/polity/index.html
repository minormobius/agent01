<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polity Spiral</title>
<meta name="description" content="Every elected American officeholder since 1789, one dot per official per election cycle, coloured by party — presidents, governors, Congress and the state legislatures. Each dot opens its Wikipedia article.">
<meta property="og:title" content="Polity Spiral — the political history of the United States in one graph">
<meta property="og:description" content="Every officeholder since 1789, one dot each per cycle, on a spiral. Hover for Wikipedia.">
<style>
:root {
  --bg: #0d0d12; --panel: rgba(20,20,28,.88); --ink: #e9e7e2; --mute: #9a98a3; --line: rgba(255,255,255,.12);
  --accent: #f0c862; --chip: rgba(255,255,255,.06);
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f6f4ef; --panel: rgba(255,255,255,.9); --ink: #1b1a1f; --mute: #6b6874; --line: rgba(0,0,0,.12); --accent: #9a6b00; --chip: rgba(0,0,0,.05);
} }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; overscroll-behavior: none; }
#gl, #ov { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ov { pointer-events: none; }
header { position: fixed; top: 0; left: 0; padding: 12px 16px; pointer-events: none; max-width: 70vw; }
header h1 { margin: 0; font: 600 18px/1.2 ui-serif, Georgia, serif; letter-spacing: .01em; }
header p { margin: 2px 0 0; color: var(--mute); font-size: 12px; }
header a { pointer-events: auto; color: var(--mute); }
#e26 { pointer-events: auto; margin-top: 10px; display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; backdrop-filter: blur(10px); }
#e26[hidden] { display: none; }
#e26 span { display: flex; flex-direction: column; font-size: 12px; }
#e26 small { color: var(--mute); font-size: 11px; }
#e26 button { appearance: none; border: 0; border-radius: 999px; padding: 6px 12px; background: var(--accent); color: var(--bg); font: 600 12px ui-sans-serif, system-ui; cursor: pointer; }
#panel { position: fixed; right: 12px; top: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
#panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 12px 0 6px; font-weight: 600; }
#panel h2:first-child { margin-top: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .chip { appearance: none; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip.off { opacity: .35; }
.chip small { color: var(--mute); }
select, input[type=search] { width: 100%; background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; }
.row { display: flex; gap: 6px; align-items: center; }
#yearbox { display: none; }
#yearbox.show { display: block; }
#year { width: 100%; accent-color: var(--accent); }
#yearlabel { font: 600 22px ui-serif, Georgia, serif; min-width: 3.2em; }
#play { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
#stats { color: var(--mute); font-size: 11px; margin-top: 10px; }
#stats a { color: var(--mute); }
#toggle { display: none; position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; border-radius: 999px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
#tip { position: fixed; z-index: 10; pointer-events: none; display: none; width: 280px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
#tip.pinned { pointer-events: auto; }
#tip .nm { font: 600 15px/1.25 ui-serif, Georgia, serif; }
#tip .of { color: var(--mute); font-size: 12px; margin-top: 2px; }
#tip .pt { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 4px; }
#tip .pt i { width: 9px; height: 9px; border-radius: 50%; }
#tip .nt { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--accent); }
#tip .wk { display: flex; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--mute); }
#tip .wk img { width: 56px; height: 64px; object-fit: cover; border-radius: 6px; flex: none; background: var(--chip); }
#tip .wk p { margin: 0; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
#tip .go { display: none; margin-top: 8px; text-align: center; padding: 8px; border-radius: 8px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; }
#tip.pinned .go { display: block; }
#tip .hint { margin-top: 6px; font-size: 11px; color: var(--mute); }
#tip.pinned .hint { display: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--mute); font: 15px ui-serif, Georgia, serif; }
@media (max-width: 700px) {
  header { max-width: calc(100vw - 32px); }
  header h1 { font-size: 16px; }
  #e26 { pointer-events: auto; margin-top: 10px; display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; backdrop-filter: blur(10px); }
#e26[hidden] { display: none; }
#e26 span { display: flex; flex-direction: column; font-size: 12px; }
#e26 small { color: var(--mute); font-size: 11px; }
#e26 button { appearance: none; border: 0; border-radius: 999px; padding: 6px 12px; background: var(--accent); color: var(--bg); font: 600 12px ui-sans-serif, system-ui; cursor: pointer; }
#panel { left: 8px; right: 8px; top: auto; bottom: calc(60px + env(safe-area-inset-bottom)); width: auto; max-height: 55vh; display: none; }
  #panel.open { display: block; }
  #toggle { display: block; }
  #e26 { margin-top: 6px; padding: 6px 8px; gap: 6px; }
  #e26 b { font-size: 11px; font-weight: 600; }
  #e26 small { display: none; }
  #e26 button { padding: 5px 10px; font-size: 11px; }
  header p { font-size: 11px; }
  #tip { left: 8px !important; right: 8px; bottom: calc(60px + env(safe-area-inset-bottom)); top: auto !important; width: auto; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<header>
  <h1>Polity Spiral</h1>
  <p>Every elected American officeholder since 1789, through the 2026 election · one dot per official per cycle · <a href="../">Wiki Cards</a></p>
  <div id="e26" hidden><span><b></b><small></small></span><button>See the 2026 results →</button></div>
</header>
<div id="loading">Loading 237 years of elections…</div>
<button id="toggle">Controls</button>
<aside id="panel">
  <h2>View</h2>
  <div class="seg" id="layouts"></div>
  <div id="yearbox">
    <h2>Cross-section</h2>
    <div class="row"><button id="play" title="Play">▶</button><span id="yearlabel">1789</span></div>
    <input type="range" id="year" min="0" max="118" value="118">
  </div>
  <h2>Highlight</h2>
  <div class="seg" id="marks"></div>
  <h2>Offices</h2>
  <div class="seg" id="bodies"></div>
  <h2>State</h2>
  <select id="state"><option value="">All states</option></select>
  <h2>Sort within a cycle</h2>
  <div class="seg" id="sorts"></div>
  <h2>Colour</h2>
  <div class="seg" id="colors"></div>
  <h2>Find</h2>
  <input type="search" id="find" placeholder="Name, e.g. Lincoln" autocomplete="off">
  <h2>Parties <small style="text-transform:none;letter-spacing:0;font-weight:400">— tap to isolate</small></h2>
  <div class="seg" id="legend"></div>
  <div id="stats"></div>
</aside>
<div id="tip"></div>
<script type="module" src="polity.js"></script>
</body>
</html>
